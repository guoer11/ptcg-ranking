<body>
<div id="setupApp" class="app">
  <header class="top"><div class="brand">⚾ 中職棒球實戰</div><button id="recordBtn">紀錄</button></header>
  <main class="screen">
    <section class="card"><h2>1. 選擇球隊</h2><div class="sub">選隊後可以自己排 1～9 棒。每支球隊的自訂打線會記在這台 iPhone。</div><div id="teamGrid" class="team-grid"></div></section>
    <section id="lineupCard" class="card hidden">
      <div class="editor-head"><div><h2 style="margin:0">2. 自訂先發打線</h2><div id="editTeamName" class="sub"></div></div><div id="selectedCount" class="badge">0 / 9</div></div>
      <div class="sub">先點「第幾棒」，再從下面球員名單點一位球員。已排過的球員再次選取時會和目前棒次交換。</div>
      <div id="lineup" class="lineup" style="margin-top:10px"></div>
      <div class="setup-actions"><button id="defaultLineupBtn" class="secondary">套用近期打線</button><button id="clearLineupBtn" class="secondary">清空打線</button></div>
      <h3 style="margin-top:16px">球員名單</h3><div id="roster" class="roster"></div>
    </section>
    <section id="opponentCard" class="card hidden"><h2>3. 選擇對手</h2><div class="select-row"><select id="opponentSelect"></select></div><div id="lineupError" class="error"></div><button id="startGameBtn" class="primary" style="width:100%;margin-top:6px">開始 9 局比賽</button></section>
    <a href="baseball-roster.html" style="display:block;text-align:center;color:#a9c0bb;text-decoration:none;font-weight:800;padding:10px">← 回完整球員名單</a>
  </main>
</div>

<div id="gameApp" class="game hidden">
  <header class="scoreboard"><div class="score-main"><div class="team-score"><span id="cpuShort">CPU</span> <span id="cpuScore">0</span></div><div class="inning"><b id="inningText">1局下</b><span id="situation">0人出局</span></div><div class="team-score right"><span id="userScore">0</span> <span id="userShort">YOU</span></div></div><div class="score-sub"><div class="dots">B <i class="dot b"></i><i class="dot b"></i><i class="dot b"></i></div><div class="dots">S <i class="dot s"></i><i class="dot s"></i></div><div class="dots">O <i class="dot o"></i><i class="dot o"></i><i class="dot o"></i></div></div></header>
  <main id="field" class="field"><div class="stands"></div><div class="crowd"></div><div class="wall"></div><div class="outfield"></div><div class="dirt"></div><div class="grass-in"></div><div class="mound"></div><div id="base1" class="base b1"></div><div id="base2" class="base b2"></div><div id="base3" class="base b3"></div><div class="fielder lf"></div><div class="fielder cf"></div><div class="fielder rf"></div><div class="fielder ss"></div><div class="fielder s2"></div><div class="fielder s1"></div><div class="fielder s3"></div><div class="pitcher"></div><div class="plate"></div><div id="zone" class="zone"><div id="aim" class="aim"></div></div><div id="ball"></div><div id="batter" class="batter"></div><div id="bat" class="bat"></div><div class="hud"><div id="pitchInfo">等待投球</div><div style="color:#a9c0bb;margin-top:3px">點／拖九宮格移動準星</div></div><div class="batter-card"><span id="orderText">第1棒</span><strong id="currentBatter">—</strong><span id="batterRealStats" class="real">AVG —・SLG —・OPS —</span><span id="nextBatters">下一棒：—</span></div><div id="message" class="message"><strong>準備比賽</strong><span>等待投球</span></div></main>
  <footer class="controls"><button id="menuBtn" class="control">結束／選單</button><button id="swingBtn" class="control" disabled>揮棒！</button></footer>
</div>

<div id="recordsOverlay" class="overlay hidden"><div class="modal"><h2>遊戲紀錄</h2><div class="record-tabs"><button class="tab active" data-tab="players">球員</button><button class="tab" data-tab="teams">球隊</button><button class="tab" data-tab="games">比賽</button></div><div id="recordsBody"></div><div class="modal-actions"><button id="closeRecords" class="secondary">關閉</button><button id="resetRecords" class="secondary">清除紀錄</button></div></div></div>
<div id="gameOverOverlay" class="overlay hidden"><div class="modal" style="text-align:center"><div style="font-size:52px">⚾</div><h2 id="gameOverTitle">比賽結束</h2><p id="gameOverText" class="sub"></p><div class="modal-actions"><button id="backSetupBtn" class="secondary">回到選隊</button><button id="againBtn" class="primary">同打線再打一場</button></div></div></div>
<script>

const rate=v=>v==null?'—':num(v).toFixed(3).replace(/^0/,'');
async function loadRealStats(){try{const r=await fetch('data/cpbl_batting_2026.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();realStats=j.players||{};if(selectedTeam)updateBoard()}catch(e){console.warn('CPBL stats unavailable',e)}}
function realStatFor(name){return selectedTeam&&name?realStats[teams[selectedTeam].name+'|'+name]||null:null}
function battingAbility(){const s=realStatFor(lineup[batIndex%9]);if(!s)return{contact:0,power:0,s:null};const pa=Math.max(0,num(s.PA)||0),w=clamp(pa/100,0,1),avg=.255+((num(s.AVG)??.255)-.255)*w,slg=.360+((num(s.SLG)??.360)-.360)*w;return{contact:clamp((avg-.255)/.08,-1,1),power:clamp((slg-.360)/.18,-1,1),s}}
function saveLineups(){localStorage.setItem(LINEUP_KEY,JSON.stringify(savedLineups))}function saveDb(){localStorage.setItem(STATS_KEY,JSON.stringify(db))}
function playerKey(team,name){return team+'|'+name}function ensurePlayer(team,name){const k=playerKey(team,name);if(!db.players[k])db.players[k]={team,name,G:0,PA:0,AB:0,H:0,D2:0,D3:0,HR:0,RBI:0,BB:0,K:0,R:0};return db.players[k]}function ensureTeam(team){if(!db.teams[team])db.teams[team]={G:0,W:0,L:0,T:0,RS:0,RA:0};return db.teams[team]}
function renderTeams(){$('teamGrid').innerHTML=TEAM_KEYS.map(k=>`<button class="team-btn ${selectedTeam===k?'active':''}" data-team="${k}" style="background:linear-gradient(135deg,${teams[k].color}cc,#183536)">${teams[k].name}<span>${teams[k].roster.length} 位可選球員</span></button>`).join('');qsa('[data-team]').forEach(b=>b.onclick=()=>selectTeam(b.dataset.team))}
function selectTeam(k){selectedTeam=k;selectedSlot=0;lineup=(savedLineups[k]&&savedLineups[k].length===9?savedLineups[k]:teams[k].default).slice();$('lineupCard').classList.remove('hidden');$('opponentCard').classList.remove('hidden');$('editTeamName').textContent=teams[k].name+'・點棒次後再點球員';renderTeams();renderLineup();renderRoster();renderOpponent();}
function renderLineup(){$('selectedCount').textContent=lineup.filter(Boolean).length+' / 9';$('lineup').innerHTML=lineup.map((n,i)=>`<div class="slot ${selectedSlot===i?'active':''}" data-slot="${i}"><div class="slot-no">${i+1}</div><div class="slot-name ${n?'':'empty'}">${n||'點這裡選擇第'+(i+1)+'棒'}</div><button class="clear-slot" data-clear="${i}">×</button></div>`).join('');qsa('[data-slot]').forEach(e=>e.onclick=ev=>{if(ev.target.dataset.clear!==undefined)return;selectedSlot=Number(e.dataset.slot);renderLineup()});qsa('[data-clear]').forEach(b=>b.onclick=e=>{e.stopPropagation();lineup[Number(b.dataset.clear)]=null;renderLineup();renderRoster()});}
function renderRoster(){$('roster').innerHTML=teams[selectedTeam].roster.map(n=>{const idx=lineup.indexOf(n),used=idx>=0;return`<button class="player ${used?'used':''}" data-player="${n}"><strong>${n}</strong><small>${used?'已排第 '+(idx+1)+' 棒':'點一下排入第 '+(selectedSlot+1)+' 棒'}</small></button>`}).join('');qsa('[data-player]').forEach(b=>b.onclick=()=>assignPlayer(b.dataset.player))}
function assignPlayer(name){const old=lineup.indexOf(name);if(old===selectedSlot)return;if(old>=0){const temp=lineup[selectedSlot];lineup[selectedSlot]=name;lineup[old]=temp}else lineup[selectedSlot]=name;const next=lineup.findIndex((v,i)=>!v&&i>selectedSlot);if(next>=0)selectedSlot=next;renderLineup();renderRoster();}
$('defaultLineupBtn').onclick=()=>{lineup=teams[selectedTeam].default.slice();selectedSlot=0;renderLineup();renderRoster()};$('clearLineupBtn').onclick=()=>{lineup=Array(9).fill(null);selectedSlot=0;renderLineup();renderRoster()};
function renderOpponent(){const opts=TEAM_KEYS.filter(k=>k!==selectedTeam);$('opponentSelect').innerHTML=opts.map(k=>`<option value="${k}">${teams[k].name}</option>`).join('');opponent=$('opponentSelect').value;$('opponentSelect').onchange=()=>opponent=$('opponentSelect').value}
$('startGameBtn').onclick=()=>{const unique=new Set(lineup.filter(Boolean));if(lineup.some(x=>!x)||unique.size!==9){$('lineupError').textContent='請先排滿 1～9 棒，而且球員不能重複。';return}$('lineupError').textContent='';savedLineups[selectedTeam]=lineup.slice();saveLineups();opponent=$('opponentSelect').value;startGame()};
function setMsg(a,b='',kind=''){$('message').className='message '+kind;$('message').innerHTML=`<strong>${a}</strong><span>${b}</span>`}
function updateBoard(){if(!selectedTeam||!opponent)return;$('cpuShort').textContent=teams[opponent].short;$('userShort').textContent=teams[selectedTeam].short;$('cpuScore').textContent=cpuScore;$('userScore').textContent=userScore;$('inningText').textContent=inning+'局下';$('situation').textContent=outs+'人出局';qsa('.dot.b').forEach((e,i)=>e.classList.toggle('on',i<balls));qsa('.dot.s').forEach((e,i)=>e.classList.toggle('on',i<strikes));qsa('.dot.o').forEach((e,i)=>e.classList.toggle('on',i<outs));[$('base1'),$('base2'),$('base3')].forEach((e,i)=>e.classList.toggle('runner',bases[i]));const cur=lineup[batIndex%9],n1=lineup[(batIndex+1)%9],n2=lineup[(batIndex+2)%9],rs=realStatFor(cur);$('orderText').textContent='第 '+((batIndex%9)+1)+' 棒';$('currentBatter').textContent=cur;$('batterRealStats').textContent=rs?`AVG ${rate(rs.AVG)}・SLG ${rate(rs.SLG)}・OPS ${rate(rs.OPS)}`:'AVG —・SLG —・OPS —';$('nextBatters').textContent='後面：'+n1+'、'+n2}
function clearMotion(){if(raf)cancelAnimationFrame(raf);if(timer)clearTimeout(timer);raf=timer=0;pitching=false;$('ball').style.display='none'}
function resetCount(){balls=strikes=0;updateBoard()}
function cpuRuns(){const r=Math.random();return r<.55?0:r<.79?1:r<.92?2:r<.975?3:4}
function startGame(){$('setupApp').classList.add('hidden');$('gameApp').classList.remove('hidden');$('swingBtn').disabled=false;playing=true;inning=1;userScore=0;cpuScore=0;balls=strikes=outs=0;bases=[false,false,false];batIndex=0;aimX=aimY=.5;$('aim').style.left='50%';$('aim').style.top='50%';lineup.forEach(n=>ensurePlayer(selectedTeam,n).G++);saveDb();updateBoard();simulateCpu(true)}
function simulateCpu(first=false){cpuScore+=cpuRuns();updateBoard();if(inning>=9&&userScore>cpuScore)return endGame('比賽勝利！');setMsg(inning+'局下','輪到 '+teams[selectedTeam].name+' 進攻','');schedulePitch(first?800:950)}
function schedulePitch(delay=720){if(!playing||outs>=3)return;clearMotion();$('pitchInfo').textContent='準備投球';timer=setTimeout(throwPitch,delay)}
function throwPitch(){if(!playing)return;const p=pitchTypes[Math.floor(Math.random()*pitchTypes.length)];lastPitch=p.n;lastSpeed=Math.round(rand(...p.s));pitchDuration=rand(...p.d);const inZone=Math.random()<.72;if(inZone){pitchTargetX=rand(.08,.92);pitchTargetY=rand(.08,.92)}else{const s=Math.floor(Math.random()*4);if(s===0){pitchTargetX=rand(-.25,-.05);pitchTargetY=rand(.05,.95)}if(s===1){pitchTargetX=rand(1.05,1.25);pitchTargetY=rand(.05,.95)}if(s===2){pitchTargetX=rand(.05,.95);pitchTargetY=rand(-.25,-.05)}if(s===3){pitchTargetX=rand(.05,.95);pitchTargetY=rand(1.05,1.25)}}pitchCurve=(Math.random()<.5?-1:1)*p.c;pitchDrop=p.drop;pitchStart=performance.now();pitching=true;$('pitchInfo').textContent=lastPitch+' '+lastSpeed+' km/h';timer=setTimeout(()=>{$('ball').style.display='block';raf=requestAnimationFrame(animatePitch)},130)}
function pitchEnd(){const f=$('field').getBoundingClientRect(),z=$('zone').getBoundingClientRect();return{x:z.left-f.left+z.width*pitchTargetX,y:z.top-f.top+z.height*pitchTargetY}}
function animatePitch(now){if(!pitching)return;const f=$('field').getBoundingClientRect(),e=pitchEnd(),t=clamp((now-pitchStart-130)/pitchDuration,0,1),ease=t*t*(3-2*t),sx=f.width*.5,sy=f.height*.5,x=sx+(e.x-sx)*ease+Math.sin(Math.PI*t)*pitchCurve*(1-t*.35),y=sy+(e.y-sy)*ease+Math.pow(t,2)*pitchDrop,scale=.42+ease*.82;const b=$('ball');b.style.left=x+'px';b.style.top=y+'px';b.style.transform=`translate(-50%,-50%) scale(${scale}) rotate(${t*650}deg)`;if(t>=1){pitching=false;b.style.display='none';takePitch();return}raf=requestAnimationFrame(animatePitch)}
function strikeLoc(){return pitchTargetX>=0&&pitchTargetX<=1&&pitchTargetY>=0&&pitchTargetY<=1}
function curStat(){return ensurePlayer(selectedTeam,lineup[batIndex%9])}
function takePitch(){if(strikeLoc()){strikes++;setMsg('好球！',lastPitch+' '+lastSpeed+' km/h','bad');if(strikes>=3)return finishPA('K')}else{balls++;setMsg('壞球',lastPitch+' '+lastSpeed+' km/h','');if(balls>=4)return finishPA('BB')}updateBoard();schedulePitch(820)}
function swing(){if(!playing||!pitching)return;const batter=$('batter'),bat=$('bat');batter.classList.add('swing');bat.classList.add('swing');setTimeout(()=>{batter.classList.remove('swing');bat.classList.remove('swing')},150);const t=clamp((performance.now()-pitchStart-130)/pitchDuration,0,1),timingErr=Math.abs(t-.91),aimErr=Math.hypot(aimX-pitchTargetX,aimY-pitchTargetY);pitching=false;if(raf)cancelAnimationFrame(raf);$('ball').style.display='none';if(timingErr>.22||aimErr>.73){strikes++;setMsg('揮空！','時機或準星位置沒對上','bad');if(strikes>=3)return finishPA('K');updateBoard();return schedulePitch(820)}const tq=clamp(1-timingErr/.19,0,1),aq=clamp(1-aimErr/.55,0,1),contact=tq*.58+aq*.42;resolveContact(contact)}
function resolveContact(c){const a=battingAbility();c=clamp(c+a.contact*.055+a.power*.04*Math.max(0,(c-.35)/.65),0,1);const r=Math.random();if(c<.28){if(r<.56)return foul();return finishPA('OUT','滾地球出局')}if(c<.45){if(r<.2)return foul();if(r<.68)return finishPA('OUT','內野滾地出局');return finishPA('1B')}if(c<.62){const outCut=clamp(.36-a.contact*.025,.31,.41),singleCut=clamp(.87-a.power*.055,.79,.93);if(r<outCut)return finishPA('OUT','外野高飛球出局');if(r<singleCut)return finishPA('1B');return finishPA('2B')}if(c<.78){const outCut=clamp(.18-a.contact*.02,.14,.22),singleCut=clamp(.58-a.power*.06,.48,.67),doubleCut=clamp(.92-a.power*.025,.86,.95);if(r<outCut)return finishPA('OUT','平飛球接殺');if(r<singleCut)return finishPA('1B');if(r<doubleCut)return finishPA('2B');return finishPA('3B')}if(c<.9){const singleCut=clamp(.18-a.contact*.02,.13,.22),doubleCut=clamp(.54-a.power*.055,.44,.61),tripleCut=clamp(.67-a.power*.025,.61,.71);if(r<singleCut)return finishPA('1B');if(r<doubleCut)return finishPA('2B');if(r<tripleCut)return finishPA('3B');return finishPA('HR')}const hrCut=clamp(.22-a.power*.07,.13,.29);return r<.16?finishPA('2B'):r<hrCut?finishPA('3B'):finishPA('HR')}
function foul(){if(strikes<2)strikes++;setMsg('界外球','繼續這個打席','');updateBoard();schedulePitch(820)}
function advance(type){let runs=0;if(type==='BB'){if(bases[0]&&bases[1]&&bases[2])runs++;bases=[true,bases[1]||bases[0],bases[2]||(bases[1]&&bases[0])]}if(type==='1B'){const n=[true,false,false];if(bases[2])runs++;if(bases[1])Math.random()<.72?runs++:n[2]=true;if(bases[0])n[1]=true;bases=n}if(type==='2B'){const n=[false,true,false];if(bases[2])runs++;if(bases[1])runs++;if(bases[0])Math.random()<.55?runs++:n[2]=true;bases=n}if(type==='3B'){runs+=bases.filter(Boolean).length;bases=[false,false,true]}if(type==='HR'){runs=1+bases.filter(Boolean).length;bases=[false,false,false]}return runs}
function finishPA(result,label=''){const batterName=lineup[batIndex%9],s=curStat();s.PA++;let runs=0;if(result==='K'){s.AB++;s.K++;outs++;label='三振出局'}else if(result==='BB'){s.BB++;runs=advance('BB');label='四壞保送'}else if(result==='OUT'){s.AB++;outs++}else{s.AB++;s.H++;if(result==='2B')s.D2++;if(result==='3B')s.D3++;if(result==='HR')s.HR++;runs=advance(result);s.RBI+=runs;label=result==='1B'?'安打！':result==='2B'?'二壘安打！':result==='3B'?'三壘安打！':'全壘打！！！'}userScore+=runs;setMsg(label,(runs?runs+' 分打點・':'')+batterName,result==='OUT'||result==='K'?'bad':'good');batIndex=(batIndex+1)%9;balls=strikes=0;saveDb();updateBoard();if(inning>=9&&userScore>cpuScore)return endGame('再見勝！');if(outs>=3)return endHalf();schedulePitch(920)}
function endHalf(){clearMotion();outs=0;balls=strikes=0;bases=[false,false,false];updateBoard();if(inning>=9&&userScore!==cpuScore)return endGame(userScore>cpuScore?'比賽勝利！':'比賽敗北');inning++;setMsg(inning+'局上','CPU 進攻中…','');timer=setTimeout(()=>simulateCpu(false),950)}
function endGame(title){playing=false;clearMotion();$('swingBtn').disabled=true;const t=ensureTeam(selectedTeam),o=ensureTeam(opponent);t.G++;o.G++;t.RS+=userScore;t.RA+=cpuScore;o.RS+=cpuScore;o.RA+=userScore;if(userScore>cpuScore){t.W++;o.L++}else if(userScore<cpuScore){t.L++;o.W++}else{t.T++;o.T++}db.games.unshift({date:new Date().toISOString(),team:selectedTeam,opp:opponent,us:userScore,them:cpuScore,lineup:lineup.slice()});db.games=db.games.slice(0,30);saveDb();$('gameOverTitle').textContent=title;$('gameOverText').textContent=teams[selectedTeam].name+' '+userScore+'：'+cpuScore+' '+teams[opponent].name;$('gameOverOverlay').classList.remove('hidden')}
function setAim(x,y){const r=$('zone').getBoundingClientRect();aimX=clamp((x-r.left)/r.width,0,1);aimY=clamp((y-r.top)/r.height,0,1);$('aim').style.left=aimX*100+'%';$('aim').style.top=aimY*100+'%'}
$('zone').addEventListener('pointerdown',e=>{e.preventDefault();setAim(e.clientX,e.clientY)});$('zone').addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){e.preventDefault();setAim(e.clientX,e.clientY)}});$('swingBtn').addEventListener('touchend',e=>{e.preventDefault();lastSwingTouch=Date.now();swing()},{passive:false});$('swingBtn').addEventListener('click',()=>{if(Date.now()-lastSwingTouch>500)swing()});$('menuBtn').onclick=()=>{if(confirm('要結束這場比賽並回選隊畫面嗎？'))returnToSetup()};
function returnToSetup(){playing=false;clearMotion();$('gameApp').classList.add('hidden');$('setupApp').classList.remove('hidden');$('gameOverOverlay').classList.add('hidden');$('swingBtn').disabled=false}
$('backSetupBtn').onclick=returnToSetup;$('againBtn').onclick=()=>{$('gameOverOverlay').classList.add('hidden');startGame()};
function calcAvg(s){return s.AB?s.H/s.AB:0}function calcObp(s){const d=s.AB+s.BB;return d?(s.H+s.BB)/d:0}function calcSlg(s){if(!s.AB)return 0;const singles=s.H-s.D2-s.D3-s.HR;return(singles+2*s.D2+3*s.D3+4*s.HR)/s.AB}function fmtGameRate(v){return v.toFixed(3).replace(/^0/,'')}
function renderRecords(tab='players'){qsa('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='players'){const arr=Object.values(db.players).sort((a,b)=>b.PA-a.PA);$('recordsBody').innerHTML=arr.length?`<div class="table-wrap"><table class="stats"><thead><tr><th>球員</th><th>隊</th><th>G</th><th>PA</th><th>AB</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>RBI</th><th>BB</th><th>K</th><th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th></tr></thead><tbody>${arr.map(s=>{const av=calcAvg(s),ob=calcObp(s),sl=calcSlg(s);return`<tr><td>${s.name}</td><td>${teams[s.team]?.short||''}</td><td>${s.G}</td><td>${s.PA}</td><td>${s.AB}</td><td>${s.H}</td><td>${s.D2}</td><td>${s.D3}</td><td>${s.HR}</td><td>${s.RBI}</td><td>${s.BB}</td><td>${s.K}</td><td>${fmtGameRate(av)}</td><td>${fmtGameRate(ob)}</td><td>${fmtGameRate(sl)}</td><td>${fmtGameRate(ob+sl)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty-note">還沒有球員紀錄</div>'}if(tab==='teams'){const arr=Object.entries(db.teams);$('recordsBody').innerHTML=arr.length?`<div class="table-wrap"><table class="stats"><thead><tr><th>球隊</th><th>G</th><th>W</th><th>L</th><th>T</th><th>得分</th><th>失分</th></tr></thead><tbody>${arr.map(([k,s])=>`<tr><td>${teams[k]?.name||k}</td><td>${s.G}</td><td>${s.W}</td><td>${s.L}</td><td>${s.T}</td><td>${s.RS}</td><td>${s.RA}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-note">還沒有球隊紀錄</div>'}if(tab==='games'){$('recordsBody').innerHTML=db.games.length?db.games.map(g=>`<div class="card" style="margin-bottom:8px"><strong>${teams[g.team].name} ${g.us}：${g.them} ${teams[g.opp].name}</strong><div class="sub">${new Date(g.date).toLocaleString('zh-TW')}<br>打線：${g.lineup.join(' → ')}</div></div>`).join(''):'<div class="empty-note">還沒有比賽紀錄</div>'}}
$('recordBtn').onclick=()=>{$('recordsOverlay').classList.remove('hidden');renderRecords('players')};qsa('.tab').forEach(b=>b.onclick=()=>renderRecords(b.dataset.tab));$('closeRecords').onclick=()=>$('recordsOverlay').classList.add('hidden');$('resetRecords').onclick=()=>{if(confirm('確定要清除所有遊戲紀錄嗎？')){db={players:{},teams:{},games:[]};saveDb();renderRecords('players')}};
renderTeams();loadRealStats();
})();
</script>
