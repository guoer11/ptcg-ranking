<body>
<div id="setupApp" class="app">
<header class="top"><div class="brand">⚾ 中職九局棒球</div><button id="recordBtn">紀錄</button></header>

<section class="card"><div class="pool-head"><div><h2 style="margin:0">1. 球員池</h2><div id="poolStatus" class="sub">正在讀取 2026 一軍球員…</div></div></div><div id="teamFilters" class="filters"></div><div class="tools"><input id="searchInput" type="search" placeholder="搜尋球員姓名"><select id="sortSelect"><option value="OPS">OPS 高到低</option><option value="AVG">打擊率高到低</option><option value="SLG">長打率高到低</option><option value="OBP">上壘率高到低</option><option value="PA">打席多到少</option><option value="NAME">姓名</option></select></div><div id="playerPool" class="pool"><div class="loading">載入中…</div></div></section>

<script>
(()=>{
const $=id=>document.getElementById(id),qsa=s=>[...document.querySelectorAll(s)];
const teams={brothers:{name:'中信兄弟',short:'兄弟',color:'#f4c62f'},lions:{name:'統一7-ELEVEn獅',short:'統一',color:'#f38b2d'},monkeys:{name:'樂天桃猿',short:'樂天',color:'#7f2645'},dragons:{name:'味全龍',short:'味全',color:'#cf3030'},guardians:{name:'富邦悍將',short:'富邦',color:'#1986c5'},hawks:{name:'台鋼雄鷹',short:'台鋼',color:'#b36c18'}};
const teamByName=Object.fromEntries(Object.entries(teams).map(([k,v])=>[v.name,k]));
const fallback={brothers:['王威晨','江坤宇','岳政華','岳東華','宋晟睿','高宇杰','陳俊秀','王政順','曾頌恩','許庭綸','張志豪','詹子賢','黃韋盛'],lions:['陳重羽','林子豪','許哲晏','陳鏞基','林培緯','潘傑楷','林祖傑','陳聖平','李丞齡','邱智呈','陳傑憲','林佳緯','蘇智傑'],monkeys:['林泓育','嚴宏鈞','宋嘉翔','梁家榮','林承飛','林子偉','余德龍','林智平','馬傑森','成晉','林立','林政華','何品室融','陳晨威'],dragons:['郭天信','劉俊緯','朱育賢','陳子豪','李凱威','張政禹','王順和','蔣少宏','張祐銘','林辰勳','拿莫．伊漾','吉力吉撈．鞏冠','劉基鴻','林孝程'],guardians:['戴培峰','林岱安','林澤彬','王念好','葉子霆','王苡丞','范國宸','董子恩','劉俊豪','張育成','申皓瑋','王正棠','孔念恩','周佳樂'],hawks:['王博玄','曾子祐','吳念庭','魔鷹','永田颯太郎','王柏融','陳文杰','藍寅倫','高聖恩','紀慶然','杜家明']};

function saveDb(){localStorage.setItem(STATS_KEY,JSON.stringify(db))}function makeFallback(){return Object.entries(fallback).flatMap(([teamKey,names])=>names.map(name=>({name,teamKey,teamName:teams[teamKey].name,stats:null})))}
async function loadPlayers(){try{const r=await fetch('data/cpbl_batting_2026.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const j=await r.json();players=Object.values(j.players||{}).map(s=>{const teamKey=teamByName[s.team];return teamKey?{name:s.player,teamKey,teamName:s.team,stats:s}:null}).filter(Boolean);const seen=new Set();players=players.filter(p=>{const k=p.teamKey+'|'+p.name;if(seen.has(k))return false;seen.add(k);return true});if(players.length<40)throw Error('too few players');$('poolStatus').textContent=`2026 一軍球員池・共 ${players.length} 人可選`;}catch(e){players=makeFallback();$('poolStatus').textContent=`資料暫時無法更新，使用內建球員池・${players.length} 人可選`;console.warn(e)}renderFilters();renderPool();renderOpponent();}
function renderFilters(){$('teamFilters').innerHTML=`<button class="filter active" data-f="all">全部</button>`+Object.entries(teams).map(([k,t])=>`<button class="filter" data-f="${k}">${t.short}</button>`).join('');qsa('[data-f]').forEach(b=>b.onclick=()=>{filterTeam=b.dataset.f;qsa('[data-f]').forEach(x=>x.classList.toggle('active',x===b));renderPool()})}
function metric(p,key){const s=p.stats||{};if(key==='NAME')return p.name;return num(s[key])}function visiblePlayers(){let list=players.filter(p=>(filterTeam==='all'||p.teamKey===filterTeam)&&(!search||p.name.includes(search)));return list.sort((a,b)=>{if(sortBy==='NAME')return a.name.localeCompare(b.name,'zh-Hant');const av=metric(a,sortBy),bv=metric(b,sortBy);if(av==null&&bv!=null)return 1;if(av!=null&&bv==null)return-1;if(av==null&&bv==null)return a.name.localeCompare(b.name,'zh-Hant');return bv-av||a.name.localeCompare(b.name,'zh-Hant')})}
function playerId(p){return p.teamKey+'|'+p.name}function selectedIndex(p){const id=playerId(p);return lineup.findIndex(x=>playerId(x)===id)}
function renderPool(){const list=visiblePlayers();$('playerPool').innerHTML=list.length?list.map(p=>{const i=selectedIndex(p),s=p.stats;return`<button class="player ${i>=0?'selected':''} ${s?'':'nodata'}" data-pid="${playerId(p)}">${i>=0?`<span class="pickno">${i+1}</span>`:''}<strong>${p.name}</strong><div class="team">${p.teamName}</div><div class="numbers"><span>AVG<b>${rate(s?.AVG)}</b></span><span>SLG<b>${rate(s?.SLG)}</b></span><span>OPS<b>${rate(s?.OPS)}</b></span></div></button>`}).join(''):'<div class="loading">沒有符合的球員</div>';qsa('[data-pid]').forEach(b=>b.onclick=()=>togglePlayer(b.dataset.pid))}
function togglePlayer(id){const p=players.find(x=>playerId(x)===id);if(!p)return;const i=selectedIndex(p);$('lineupError').textContent='';if(i>=0){lineup.splice(i,1)}else if(lineup.length<9){lineup.push(p)}else{$('lineupError').textContent='已選滿 9 人，先移除一位再加入。';return}renderPool();renderLineup()}
function renderLineup(){$('selectedCount').textContent=lineup.length+' / 9';$('selectedCountTop').textContent=lineup.length+' / 9';$('startGameBtn').disabled=lineup.length!==9;$('startGameBtn').textContent=lineup.length===9?'開始 9 局比賽':'選滿 9 人後開始比賽';$('lineup').innerHTML=lineup.length?lineup.map((p,i)=>`<div class="slot"><div class="slot-no">${i+1}</div><div><div class="slot-name">${p.name}</div><div class="slot-team">${p.teamName}・第 ${i+1} 棒</div></div><div class="actions"><button data-u="${i}" ${i===0?'disabled':''}>↑</button><button data-d="${i}" ${i===lineup.length-1?'disabled':''}>↓</button><button class="del" data-x="${i}">×</button></div></div>`).join(''):'<div class="lineup-empty">還沒選球員。從上面球員池挑 9 個。</div>';qsa('[data-u]').forEach(b=>b.onclick=()=>move(+b.dataset.u,-1));qsa('[data-d]').forEach(b=>b.onclick=()=>move(+b.dataset.d,1));qsa('[data-x]').forEach(b=>b.onclick=()=>{lineup.splice(+b.dataset.x,1);renderPool();renderLineup()})}
function move(i,d){const j=i+d;if(j<0||j>=lineup.length)return;[lineup[i],lineup[j]]=[lineup[j],lineup[i]];renderPool();renderLineup()}$('clearLineupBtn').onclick=()=>{lineup=[];$('lineupError').textContent='';renderPool();renderLineup()};$('randomLineupBtn').onclick=()=>{const a=[...players].sort(()=>Math.random()-.5);lineup=a.slice(0,9);$('lineupError').textContent='';renderPool();renderLineup()};$('searchInput').oninput=e=>{search=e.target.value.trim();renderPool()};$('sortSelect').onchange=e=>{sortBy=e.target.value;renderPool()};
function renderOpponent(){$('opponentSelect').innerHTML=Object.entries(teams).map(([k,t])=>`<option value="${k}">${t.name}</option>`).join('');opponent=$('opponentSelect').value;$('opponentSelect').onchange=()=>opponent=$('opponentSelect').value}$('startGameBtn').onclick=()=>{if(lineup.length!==9){$('lineupError').textContent='請先選滿 9 位先發球員。';return}opponent=$('opponentSelect').value;startGame()};
function ensurePlayer(p){const k=playerId(p);if(!db.players[k])db.players[k]={team:p.teamKey,name:p.name,G:0,PA:0,AB:0,H:0,D2:0,D3:0,HR:0,RBI:0,BB:0,K:0};return db.players[k]}function ensureTeam(k){if(!db.teams[k])db.teams[k]={G:0,W:0,L:0,T:0,RS:0,RA:0};return db.teams[k]}function currentPlayer(){return lineup[batIndex%9]}function currentStat(){return ensurePlayer(currentPlayer())}
function battingAbility(){const s=currentPlayer()?.stats;if(!s)return{contact:0,power:0};const pa=Math.max(0,num(s.PA)||0),w=clamp(pa/100,0,1),avg=.255+((num(s.AVG)??.255)-.255)*w,slg=.360+((num(s.SLG)??.360)-.360)*w;return{contact:clamp((avg-.255)/.08,-1,1),power:clamp((slg-.360)/.18,-1,1)}}
function setMsg(a,b='',kind=''){$('message').className='message '+kind;$('message').innerHTML=`<strong>${a}</strong><span>${b}</span>`}
function updateBoard(){if(!opponent||!lineup.length)return;$('cpuShort').textContent=teams[opponent].short;$('cpuScore').textContent=cpuScore;$('userScore').textContent=userScore;$('inningText').textContent=inning+'局下';$('situation').textContent=outs+'人出局';qsa('.dot.b').forEach((e,i)=>e.classList.toggle('on',i<balls));qsa('.dot.s').forEach((e,i)=>e.classList.toggle('on',i<strikes));qsa('.dot.o').forEach((e,i)=>e.classList.toggle('on',i<outs));[$('base1'),$('base2'),$('base3')].forEach((e,i)=>e.classList.toggle('runner',bases[i]));const cur=currentPlayer(),n1=lineup[(batIndex+1)%9],n2=lineup[(batIndex+2)%9],s=cur.stats;$('orderText').textContent='第 '+((batIndex%9)+1)+' 棒';$('currentBatter').textContent=cur.name;$('batterTeam').textContent=cur.teamName;$('batterRealStats').textContent=s?`AVG ${rate(s.AVG)}・SLG ${rate(s.SLG)}・OPS ${rate(s.OPS)}`:'AVG —・SLG —・OPS —';$('nextBatters').textContent='後面：'+n1.name+'、'+n2.name}
function clearMotion(){if(raf)cancelAnimationFrame(raf);if(timer)clearTimeout(timer);raf=timer=0;pitching=false;$('ball').style.display='none'}function startGame(){$('setupApp').classList.add('hidden');$('gameApp').classList.remove('hidden');$('swingBtn').disabled=false;playing=true;inning=1;userScore=0;cpuScore=0;balls=strikes=outs=0;bases=[false,false,false];batIndex=0;aimX=aimY=.5;$('aim').style.left='50%';$('aim').style.top='50%';lineup.forEach(p=>ensurePlayer(p).G++);saveDb();updateBoard();simulateCpu(true)}
function cpuRuns(){const r=Math.random();return r<.57?0:r<.80?1:r<.93?2:r<.98?3:4}function simulateCpu(first=false){cpuScore+=cpuRuns();updateBoard();if(inning===9&&userScore>cpuScore)return endGame('比賽勝利！');setMsg(inning+'局下','輪到你的自選 9 人進攻','');schedulePitch(first?800:950)}function schedulePitch(delay=720){if(!playing||outs>=3)return;clearMotion();$('pitchInfo').textContent='準備投球';timer=setTimeout(throwPitch,delay)}
function throwPitch(){if(!playing)return;const p=pitchTypes[Math.floor(Math.random()*pitchTypes.length)];lastPitch=p.n;lastSpeed=Math.round(rand(...p.s));pitchDuration=rand(...p.d);const inZone=Math.random()<.72;if(inZone){pitchTargetX=rand(.08,.92);pitchTargetY=rand(.08,.92)}else{const side=Math.floor(Math.random()*4);if(side===0){pitchTargetX=rand(-.25,-.05);pitchTargetY=rand(.05,.95)}if(side===1){pitchTargetX=rand(1.05,1.25);pitchTargetY=rand(.05,.95)}if(side===2){pitchTargetX=rand(.05,.95);pitchTargetY=rand(-.25,-.05)}if(side===3){pitchTargetX=rand(.05,.95);pitchTargetY=rand(1.05,1.25)}}pitchCurve=(Math.random()<.5?-1:1)*p.c;pitchDrop=p.drop;pitchStart=performance.now();pitching=true;$('pitchInfo').textContent=lastPitch+' '+lastSpeed+' km/h';timer=setTimeout(()=>{$('ball').style.display='block';raf=requestAnimationFrame(animatePitch)},130)}function pitchEnd(){const f=$('field').getBoundingClientRect(),z=$('zone').getBoundingClientRect();return{x:z.left-f.left+z.width*pitchTargetX,y:z.top-f.top+z.height*pitchTargetY}}function animatePitch(now){if(!pitching)return;const f=$('field').getBoundingClientRect(),e=pitchEnd(),t=clamp((now-pitchStart-130)/pitchDuration,0,1),ease=t*t*(3-2*t),sx=f.width*.5,sy=f.height*.5,x=sx+(e.x-sx)*ease+Math.sin(Math.PI*t)*pitchCurve*(1-t*.35),y=sy+(e.y-sy)*ease+Math.pow(t,2)*pitchDrop,scale=.42+ease*.82;const b=$('ball');b.style.left=x+'px';b.style.top=y+'px';b.style.transform=`translate(-50%,-50%) scale(${scale}) rotate(${t*650}deg)`;if(t>=1){pitching=false;b.style.display='none';takePitch();return}raf=requestAnimationFrame(animatePitch)}function strikeLoc(){return pitchTargetX>=0&&pitchTargetX<=1&&pitchTargetY>=0&&pitchTargetY<=1}
function takePitch(){if(strikeLoc()){strikes++;setMsg('好球！',lastPitch+' '+lastSpeed+' km/h','bad');if(strikes>=3)return finishPA('K')}else{balls++;setMsg('壞球',lastPitch+' '+lastSpeed+' km/h','');if(balls>=4)return finishPA('BB')}updateBoard();schedulePitch(820)}function swing(){if(!playing||!pitching)return;const batter=$('batter'),bat=$('bat');batter.classList.add('swing');bat.classList.add('swing');setTimeout(()=>{batter.classList.remove('swing');bat.classList.remove('swing')},150);const t=clamp((performance.now()-pitchStart-130)/pitchDuration,0,1),timingErr=Math.abs(t-.91),aimErr=Math.hypot(aimX-pitchTargetX,aimY-pitchTargetY);pitching=false;if(raf)cancelAnimationFrame(raf);$('ball').style.display='none';if(timingErr>.22||aimErr>.73){strikes++;setMsg('揮空！','時機或準星位置沒對上','bad');if(strikes>=3)return finishPA('K');updateBoard();return schedulePitch(820)}const tq=clamp(1-timingErr/.19,0,1),aq=clamp(1-aimErr/.55,0,1),contact=tq*.58+aq*.42;resolveContact(contact)}
function resolveContact(c){const a=battingAbility();c=clamp(c+a.contact*.055+a.power*.04*Math.max(0,(c-.35)/.65),0,1);const r=Math.random();if(c<.28){if(r<.56)return foul();return finishPA('OUT','滾地球出局')}if(c<.45){if(r<.2)return foul();if(r<.68)return finishPA('OUT','內野滾地出局');return finishPA('1B')}if(c<.62){const outCut=clamp(.36-a.contact*.025,.31,.41),singleCut=clamp(.87-a.power*.055,.79,.93);if(r<outCut)return finishPA('OUT','外野高飛球出局');if(r<singleCut)return finishPA('1B');return finishPA('2B')}if(c<.78){const outCut=clamp(.18-a.contact*.02,.14,.22),singleCut=clamp(.58-a.power*.06,.48,.67),doubleCut=clamp(.92-a.power*.025,.86,.95);if(r<outCut)return finishPA('OUT','平飛球接殺');if(r<singleCut)return finishPA('1B');if(r<doubleCut)return finishPA('2B');return finishPA('3B')}if(c<.9){const singleCut=clamp(.18-a.contact*.02,.13,.22),doubleCut=clamp(.54-a.power*.055,.44,.61),tripleCut=clamp(.67-a.power*.025,.61,.71);if(r<singleCut)return finishPA('1B');if(r<doubleCut)return finishPA('2B');if(r<tripleCut)return finishPA('3B');return finishPA('HR')}const hrCut=clamp(.22-a.power*.07,.13,.29);return r<.16?finishPA('2B'):r<hrCut?finishPA('3B'):finishPA('HR')}
function foul(){if(strikes<2)strikes++;setMsg('界外球','繼續這個打席','');updateBoard();schedulePitch(820)}function advance(type){let runs=0;if(type==='BB'){if(bases[0]&&bases[1]&&bases[2])runs++;bases=[true,bases[1]||bases[0],bases[2]||(bases[1]&&bases[0])]}if(type==='1B'){const n=[true,false,false];if(bases[2])runs++;if(bases[1])Math.random()<.72?runs++:n[2]=true;if(bases[0])n[1]=true;bases=n}if(type==='2B'){const n=[false,true,false];if(bases[2])runs++;if(bases[1])runs++;if(bases[0])Math.random()<.55?runs++:n[2]=true;bases=n}if(type==='3B'){runs+=bases.filter(Boolean).length;bases=[false,false,true]}if(type==='HR'){runs=1+bases.filter(Boolean).length;bases=[false,false,false]}return runs}
function finishPA(result,label=''){const p=currentPlayer(),s=currentStat();s.PA++;let runs=0;if(result==='K'){s.AB++;s.K++;outs++;label='三振出局'}else if(result==='BB'){s.BB++;runs=advance('BB');if(runs)s.RBI+=runs;label='四壞保送'}else if(result==='OUT'){s.AB++;outs++}else{s.AB++;s.H++;if(result==='2B')s.D2++;if(result==='3B')s.D3++;if(result==='HR')s.HR++;runs=advance(result);s.RBI+=runs;label=result==='1B'?'安打！':result==='2B'?'二壘安打！':result==='3B'?'三壘安打！':'全壘打！！！'}userScore+=runs;setMsg(label,(runs?runs+' 分打點・':'')+p.name,result==='OUT'||result==='K'?'bad':'good');batIndex=(batIndex+1)%9;balls=strikes=0;saveDb();updateBoard();if(inning===9&&userScore>cpuScore)return endGame('再見勝！');if(outs>=3)return endHalf();schedulePitch(920)}function endHalf(){clearMotion();outs=0;balls=strikes=0;bases=[false,false,false];updateBoard();if(inning===9){if(userScore>cpuScore)return endGame('比賽勝利！');if(userScore<cpuScore)return endGame('比賽敗北');return endGame('九局和局')}inning++;setMsg(inning+'局上',teams[opponent].name+' 進攻中…','');timer=setTimeout(()=>simulateCpu(false),950)}
function endGame(title){playing=false;clearMotion();$('swingBtn').disabled=true;const us=ensureTeam('custom'),them=ensureTeam(opponent);us.G++;them.G++;us.RS+=userScore;us.RA+=cpuScore;them.RS+=cpuScore;them.RA+=userScore;if(userScore>cpuScore){us.W++;them.L++}else if(userScore<cpuScore){us.L++;them.W++}else{us.T++;them.T++}db.games.unshift({date:new Date().toISOString(),opp:opponent,us:userScore,them:cpuScore,lineup:lineup.map(p=>({name:p.name,team:p.teamKey}))});db.games=db.games.slice(0,50);saveDb();$('gameOverTitle').textContent=title;$('gameOverText').textContent='自選隊 '+userScore+'：'+cpuScore+' '+teams[opponent].name;$('gameOverOverlay').classList.remove('hidden')}
function setAim(x,y){const r=$('zone').getBoundingClientRect();aimX=clamp((x-r.left)/r.width,0,1);aimY=clamp((y-r.top)/r.height,0,1);$('aim').style.left=aimX*100+'%';$('aim').style.top=aimY*100+'%'}$('zone').addEventListener('pointerdown',e=>{e.preventDefault();setAim(e.clientX,e.clientY)});$('zone').addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){e.preventDefault();setAim(e.clientX,e.clientY)}});$('swingBtn').addEventListener('touchend',e=>{e.preventDefault();lastSwingTouch=Date.now();swing()},{passive:false});$('swingBtn').addEventListener('click',()=>{if(Date.now()-lastSwingTouch>500)swing()});$('menuBtn').onclick=()=>{if(confirm('要結束這場比賽並重新選 9 人嗎？'))returnToSetup()};
function returnToSetup(){playing=false;clearMotion();$('gameApp').classList.add('hidden');$('setupApp').classList.remove('hidden');$('gameOverOverlay').classList.add('hidden');$('swingBtn').disabled=false;lineup=[];renderPool();renderLineup();window.scrollTo(0,0)}$('backSetupBtn').onclick=returnToSetup;$('againBtn').onclick=()=>{$('gameOverOverlay').classList.add('hidden');startGame()};
function calcAvg(s){return s.AB?s.H/s.AB:0}function calcObp(s){const d=s.AB+s.BB;return d?(s.H+s.BB)/d:0}function calcSlg(s){if(!s.AB)return 0;const singles=s.H-s.D2-s.D3-s.HR;return(singles+2*s.D2+3*s.D3+4*s.HR)/s.AB}function fmtGameRate(v){return v.toFixed(3).replace(/^0/,'')}
function renderRecords(tab='players'){qsa('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='players'){const arr=Object.values(db.players).sort((a,b)=>b.PA-a.PA);$('recordsBody').innerHTML=arr.length?`<div class="table-wrap"><table class="stats"><thead><tr><th>球員</th><th>隊</th><th>G</th><th>PA</th><th>H</th><th>HR</th><th>RBI</th><th>BB</th><th>K</th><th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th></tr></thead><tbody>${arr.map(s=>{const av=calcAvg(s),ob=calcObp(s),sl=calcSlg(s);return`<tr><td>${s.name}</td><td>${teams[s.team]?.short||''}</td><td>${s.G}</td><td>${s.PA}</td><td>${s.H}</td><td>${s.HR}</td><td>${s.RBI}</td><td>${s.BB}</td><td>${s.K}</td><td>${fmtGameRate(av)}</td><td>${fmtGameRate(ob)}</td><td>${fmtGameRate(sl)}</td><td>${fmtGameRate(ob+sl)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty-note">還沒有球員紀錄</div>'}if(tab==='teams'){const arr=Object.entries(db.teams);$('recordsBody').innerHTML=arr.length?`<div class="table-wrap"><table class="stats"><thead><tr><th>隊伍</th><th>G</th><th>W</th><th>L</th><th>T</th><th>得分</th><th>失分</th></tr></thead><tbody>${arr.map(([k,s])=>`<tr><td>${k==='custom'?'自選隊':teams[k]?.name||k}</td><td>${s.G}</td><td>${s.W}</td><td>${s.L}</td><td>${s.T}</td><td>${s.RS}</td><td>${s.RA}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-note">還沒有戰績</div>'}if(tab==='games'){$('recordsBody').innerHTML=db.games.length?db.games.map(g=>`<div class="card" style="margin-bottom:8px"><strong>自選隊 ${g.us}：${g.them} ${teams[g.opp]?.name||g.opp}</strong><div class="sub">${new Date(g.date).toLocaleString('zh-TW')}<br>${g.lineup.map((p,i)=>`${i+1}.${p.name}`).join('　')}</div></div>`).join(''):'<div class="empty-note">還沒有比賽紀錄</div>'}}
$('recordBtn').onclick=()=>{$('recordsOverlay').classList.remove('hidden');renderRecords('players')};qsa('.tab').forEach(b=>b.onclick=()=>renderRecords(b.dataset.tab));$('closeRecords').onclick=()=>$('recordsOverlay').classList.add('hidden');$('resetRecords').onclick=()=>{if(confirm('確定清除所有遊戲紀錄嗎？')){db={players:{},teams:{},games:[]};saveDb();renderRecords('players')}};renderLineup();loadPlayers();
})();
