<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061719;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:#fff}button,select{font:inherit}.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}

.field{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(#8ccce6 0 18%,#284c3c 18% 100%)}.stands{position:absolute;left:-4%;top:14%;width:108%;height:19%;background:linear-gradient(#50646c,#273b3d 62%,#172e2c);clip-path:polygon(0 25%,18% 6%,50% 0,82% 6%,100% 25%,100% 100%,0 100%);border-bottom:4px solid #d1c39e}.crowd{position:absolute;top:18%;left:0;width:100%;height:11%;opacity:.75;background-image:radial-gradient(circle,#f1d1a9 0 1px,transparent 1.5px),radial-gradient(circle,#d75c5c 0 1px,transparent 1.6px),radial-gradient(circle,#5889b9 0 1px,transparent 1.6px);background-size:12px 10px,15px 12px,18px 14px}.wall{position:absolute;left:0;top:32%;width:100%;height:5%;background:#0d3e32;border-top:2px solid #d8cfaa}.outfield{position:absolute;inset:37% 0 0;background:repeating-linear-gradient(101deg,#2f7b45 0 50px,#367f49 50px 100px)}.dirt{position:absolute;left:50%;top:65%;width:min(80vw,510px);aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);background:#b47c4c;border-radius:8%}.grass-in{position:absolute;left:50%;top:65%;width:min(56vw,355px);aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);background:#347b45;border-radius:50%}.mound{position:absolute;left:50%;top:55%;width:58px;height:24px;transform:translate(-50%,-50%);border-radius:50%;background:#b57c4c}.base{position:absolute;width:15px;height:15px;background:#f5f0db;transform:rotate(45deg);box-shadow:0 2px 4px #0006}.b1{left:70%;top:65%}.b2{left:50%;top:49%}.b3{left:28%;top:65%}.base.runner{background:#ffd54a;box-shadow:0 0 12px #ffd54acc}.plate{position:absolute;left:50%;bottom:7%;width:25px;height:20px;background:#f5f2e7;clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%);transform:translateX(-50%)}
.fielder{position:absolute;width:18px;height:27px;z-index:3}.fielder:before{content:"";position:absolute;left:5px;top:0;width:9px;height:9px;border-radius:50%;background:#c48a68}.fielder:after{content:"";position:absolute;left:3px;top:9px;width:13px;height:17px;border-radius:4px;background:#e9ebe3}.lf{left:21%;top:42%}.cf{left:48%;top:38%}.rf{right:20%;top:42%}.ss{left:36%;top:56%}.sb{right:35%;top:56%}.fb{right:24%;top:64%}.tb{left:24%;top:64%}
.pitcher{position:absolute;left:50%;top:50%;width:40px;height:75px;transform:translate(-50%,-50%);z-index:8}.pitcher .head{position:absolute;left:13px;top:0;width:15px;height:16px;border-radius:50%;background:#c58a67}.pitcher .body{position:absolute;left:8px;top:14px;width:25px;height:32px;border-radius:8px;background:#efeee6}.pitcher .arm{position:absolute;left:2px;top:18px;width:8px;height:28px;border-radius:5px;background:#c58a67;transform-origin:50% 4px;transform:rotate(22deg)}.pitcher .leg{position:absolute;top:44px;width:9px;height:29px;border-radius:5px;background:#e8e7df}.pitcher .l1{left:9px}.pitcher .l2{right:8px}.pitcher.throw .arm{animation:throw .36s ease}@keyframes throw{45%{transform:rotate(-120deg)}100%{transform:rotate(40deg)}}
.batter{position:absolute;left:calc(50% + 56px);bottom:7%;width:60px;height:116px;z-index:13;transform-origin:29px 98px;transition:.1s}.batter .head{position:absolute;left:18px;top:0;width:20px;height:23px;border-radius:50%;background:#b97c59}.batter .body{position:absolute;left:12px;top:22px;width:35px;height:43px;border-radius:10px;background:#f1eee5}.batter .leg{position:absolute;top:63px;width:12px;height:50px;border-radius:6px;background:#ebe8dc}.batter .l1{left:13px;transform:rotate(7deg)}.batter .l2{right:12px;transform:rotate(-7deg)}.batter.swing{transform:rotate(-13deg) translateX(-5px)}.bat{position:absolute;left:calc(50% + 98px);bottom:19%;width:8px;height:100px;border-radius:8px;background:linear-gradient(90deg,#c88b45,#e2b771 55%,#95602f);z-index:14;transform-origin:50% 90%;transform:rotate(28deg);transition:.105s}.bat.swing{transform:rotate(-88deg)}
.zone{position:absolute;left:50%;bottom:14%;width:96px;height:120px;transform:translateX(-50%);border:1.5px solid #ffffffb8;z-index:16;touch-action:none}.zone:before,.zone:after{content:"";position:absolute;background:#ffffff35}.zone:before{left:33.33%;top:0;width:1px;height:100%;box-shadow:31px 0 0 #ffffff35}.zone:after{top:33.33%;left:0;width:100%;height:1px;box-shadow:0 39px 0 #ffffff35}.aim{position:absolute;width:30px;height:30px;border:2px solid #ffd757;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}.aim:before,.aim:after{content:"";position:absolute;background:#ffd757}.aim:before{left:50%;top:-7px;width:1px;height:40px}.aim:after{top:50%;left:-7px;width:40px;height:1px}#ball{position:absolute;width:19px;height:19px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 35%,#e5e2da 72%,#cfcac0 100%);display:none;z-index:22;box-shadow:0 2px 6px #0007}.hud{position:absolute;left:9px;top:9px;z-index:25;background:#031210c4;border:1px solid #ffffff1f;padding:7px 9px;border-radius:10px;font-size:11px;font-weight:900}.hud .speed{color:#ffe17b}.batter-card{position:absolute;right:9px;top:46px;z-index:25;background:#031210c4;border:1px solid #ffffff1f;padding:8px 10px;border-radius:12px;min-width:132px;text-align:right}.batter-card small{display:block;color:#a9beb8;font-size:9px}.batter-card b{font-size:14px}.message{position:absolute;left:50%;top:24%;transform:translateX(-50%);z-index:26;width:94%;text-align:center;text-shadow:0 3px 8px #000b;pointer-events:none}.message .main{font-size:27px;font-weight:950}.message .sub{font-size:13px;font-weight:850;margin-top:4px}.message.good .main{color:#ffe269}.message.bad .main{color:#ff8585}
.controls{display:grid;grid-template-columns:.82fr 1.18fr;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#0b2723,#061917);z-index:30}.control{border:0;border-radius:17px;min-height:58px;font-size:18px;font-weight:950;box-shadow:0 5px 0 #0005;touch-action:manipulation}.control:active{transform:translateY(3px)}#startBtn{background:#e9eeeb;color:#17372d}#swingBtn{background:linear-gradient(#ffd960,#f6b92f);color:#4b3100;font-size:21px}#swingBtn:disabled{opacity:.42}
.overlay{position:absolute;inset:0;z-index:80;background:#03110fe8;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.card{width:min(520px,96vw);max-height:92vh;overflow:auto;background:#f7f8f5;color:#17322a;border-radius:24px;padding:20px;box-shadow:0 20px 55px #0006}.card h1{margin:0 0 7px;font-size:26px}.card p{line-height:1.55;color:#4f665e}.section-title{font-size:13px;font-weight:950;margin:15px 0 8px}.teams{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.team-btn{border:2px solid transparent;border-radius:15px;padding:12px 8px;background:#e9eeea;color:#18352c;font-weight:900}.team-btn.selected{border-color:#163e31;background:#d9eee4}.lineup{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.player-btn{border:2px solid transparent;border-radius:13px;background:#edf0ed;padding:9px 5px;color:#1d372f;font-size:12px;font-weight:900}.player-btn.selected{border-color:#e1aa22;background:#fff2c7}.player-btn small{display:block;color:#6e7f79;font-size:9px;margin-bottom:2px}.row{display:flex;gap:8px;align-items:center}.row select{flex:1;border:1px solid #cbd5d0;border-radius:12px;padding:10px;background:#fff;color:#17322a}.primary{width:100%;border:0;border-radius:15px;padding:14px;background:#f4be35;color:#493200;font-weight:950;font-size:17px;margin-top:14px}.secondary{width:100%;border:0;border-radius:15px;padding:12px;background:#dfe8e4;color:#17322a;font-weight:900;margin-top:8px}.note{font-size:11px!important;color:#74857f!important}.modal{position:absolute;inset:0;z-index:90;background:#03110fec;display:none;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.modal-card{width:min(620px,97vw);max-height:90vh;overflow:auto;background:#f7f8f5;color:#18352c;border-radius:22px;padding:16px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#dfe7e3;border-radius:10px;padding:8px 10px;font-weight:900}.tabs{display:flex;gap:7px;margin:12px 0}.tab{border:0;border-radius:999px;padding:8px 11px;background:#e3e9e6;color:#244238;font-weight:900}.tab.active{background:#173c31;color:white}.table-wrap{overflow:auto}.stats{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}.stats th,.stats td{padding:7px 6px;border-bottom:1px solid #dfe5e2;text-align:right}.stats th:first-child,.stats td:first-child{text-align:left;position:sticky;left:0;background:#f7f8f5}.recent{display:grid;gap:7px}.game-row{background:#eaf0ed;border-radius:12px;padding:10px;font-size:12px}.flash{position:absolute;inset:0;z-index:60;background:#061513d9;display:none;align-items:center;justify-content:center;text-align:center;font-size:29px;font-weight:950}
@media(max-height:700px){.message{top:22%}.message .main{font-size:23px}.batter{height:105px}.bat{height:88px}.zone{height:105px}}
</style>

<body>
<div class="app">
<header class="scoreboard"><div class="score-main"><div class="team-score"><small id="cpuName">CPU</small><span id="cpuScore">0</span></div><div class="inning"><b id="inningText">1局下</b><span id="outsText">0 人出局</span></div><div class="team-score right"><small id="userName">YOU</small><span id="userScore">0</span></div></div><div class="subline"><span>B</span><span class="dots"><i class="dot b"></i><i class="dot b"></i><i class="dot b"></i></span><span>S</span><span class="dots"><i class="dot s"></i><i class="dot s"></i></span><span>O</span><span class="dots"><i class="dot o"></i><i class="dot o"></i></span></div></header>
<div class="field" id="field"><div class="stands"></div><div class="crowd"></div><div class="wall"></div><div class="outfield"></div><div class="dirt"></div><div class="grass-in"></div><div class="mound"></div><div id="base1" class="base b1"></div><div id="base2" class="base b2"></div><div id="base3" class="base b3"></div><div class="plate"></div><i class="fielder lf"></i><i class="fielder cf"></i><i class="fielder rf"></i><i class="fielder ss"></i><i class="fielder sb"></i><i class="fielder fb"></i><i class="fielder tb"></i><div id="pitcher" class="pitcher"><i class="head"></i><i class="body"></i><i class="arm"></i><i class="leg l1"></i><i class="leg l2"></i></div><div id="zone" class="zone"><div id="aim" class="aim"></div></div><div id="ball"></div><div id="batter" class="batter"><i class="head"></i><i class="body"></i><i class="leg l1"></i><i class="leg l2"></i></div><div id="bat" class="bat"></div><div class="hud"><div id="pitchName">等待投球</div><div id="speed" class="speed"></div></div><div class="batter-card"><small>目前打者</small><b id="currentBatter">—</b><small id="onDeck">下一棒：—</small></div><div id="message" class="message"><div id="mainMsg" class="main">準備比賽</div><div id="subMsg" class="sub">先選球隊與先發打線</div></div><div class="top-actions"><button id="recordsBtn" class="mini-btn">紀錄</button></div><div id="flash" class="flash"></div></div>
<div class="controls"><button id="startBtn" class="control">重新選隊</button><button id="swingBtn" class="control" disabled>揮棒！</button></div>
</div>
<div id="setup" class="overlay"><div class="card"><h1>⚾ 中職棒球實戰</h1><p>選一支球隊，9 位先發會依打序輪流上場。你也可以點一位球員，讓比賽從他開始打。</p><div class="section-title">1. 選擇球隊</div><div id="teamButtons" class="teams"></div><div class="section-title">2. 選擇第一位上場球員</div><div id="lineupButtons" class="lineup"></div><div class="section-title">3. 對戰球隊</div><div class="row"><select id="opponentSelect"></select></div><button id="playBtn" class="primary">開始 9 局比賽</button><button id="setupRecordsBtn" class="secondary">查看生涯紀錄</button><p class="note">預設打線依中職官網現役名單與近期陣容整理；遊戲紀錄會保存在這台裝置。</p></div></div>
<div id="recordsModal" class="modal"><div class="modal-card"><div class="modal-head"><div><h2 style="margin:0">生涯紀錄</h2><small id="recordTeamLabel"></small></div><button id="closeRecords" class="close">關閉</button></div><div class="tabs"><button class="tab active" data-tab="players">球員</button><button class="tab" data-tab="team">球隊</button><button class="tab" data-tab="recent">最近比賽</button></div><div id="recordBody"></div></div></div>
<script>
(()=>{
const TEAMS={
BRO:{name:'中信兄弟',short:'兄弟',color:'#f1c232',lineup:['王威晨','宋晟睿','岳政華','江坤宇','許基宏','陳俊秀','岳東華','高宇杰','張仁瑋']},
UNI:{name:'統一7-ELEVEn獅',short:'統一',color:'#f58220',lineup:['邱智呈','李丞齡','陳傑憲','潘傑楷','陳鏞基','林培緯','林祖傑','陳重羽','許哲晏']},
MON:{name:'樂天桃猿',short:'樂天',color:'#a90026',lineup:['林政華','威克','林泓育','林智平','梁家榮','馬傑森','林承飛','嚴宏鈞','成晉']},
DRA:{name:'味全龍',short:'味全',color:'#b7192d',lineup:['郭天信','劉俊緯','朱育賢','陳子豪','李凱威','張政禹','王順和','蔣少宏','張祐銘']},
FUB:{name:'富邦悍將',short:'富邦',color:'#124a8c',lineup:['孔念恩','張育成','林澤彬','范國宸','董子恩','王苡丞','申皓瑋','戴培峰','劉俊豪']},
TSG:{name:'台鋼雄鷹',short:'台鋼',color:'#1f6b4d',lineup:['王博玄','曾子祐','永田颯太郎','魔鷹','陳文杰','高聖恩','紀慶然','湯家豪','陳世嘉']}
};
const pitches=[{n:'四縫線速球',min:145,max:155,d:[720,870],cx:6,drop:2},{n:'二縫線速球',min:140,max:150,d:[770,910],cx:14,drop:6},{n:'滑球',min:128,max:139,d:[860,1010],cx:34,drop:9},{n:'變速球',min:119,max:132,d:[980,1160],cx:10,drop:17},{n:'曲球',min:112,max:126,d:[1040,1230],cx:22,drop:29}];
const $=id=>document.getElementById(id), field=$('field'),zone=$('zone'),aim=$('aim'),ball=$('ball'),pitcher=$('pitcher'),batter=$('batter'),bat=$('bat');
const storeKey='cpblBaseballCareerV4';
let career=loadCareer(),selectedTeam='BRO',startIndex=0,opponent='UNI',lineupIndex=0,currentPlayer='';
let inning=1,userScore=0,cpuScore=0,outs=0,balls=0,strikes=0,bases=[false,false,false],playing=false,pitching=false,swung=false,raf=0,timer=0,pitchStart=0,duration=850,targetX=.5,targetY=.5,curveX=0,drop=0,lastPitch='',lastSpeed=0,aimX=.5,aimY=.5;
function loadCareer(){try{return JSON.parse(localStorage.getItem(storeKey))||{players:{},teams:{},recent:[]}}catch(e){return{players:{},teams:{},recent:[]}}}
function saveCareer(){localStorage.setItem(storeKey,JSON.stringify(career))}
function pKey(team,name){return team+'|'+name}
function ensurePlayer(team,name){const k=pKey(team,name);if(!career.players[k])career.players[k]={team,name,G:0,PA:0,AB:0,H:0,D2:0,D3:0,HR:0,RBI:0,BB:0,K:0};return career.players[k]}
function ensureTeam(team){if(!career.teams[team])career.teams[team]={G:0,W:0,L:0,T:0,RS:0,RA:0};return career.teams[team]}
function renderSetup(){const box=$('teamButtons');box.innerHTML='';Object.entries(TEAMS).forEach(([id,t])=>{const b=document.createElement('button');b.className='team-btn'+(id===selectedTeam?' selected':'');b.textContent=t.name;b.onclick=()=>{selectedTeam=id;startIndex=0;renderSetup()};box.appendChild(b)});const l=$('lineupButtons');l.innerHTML='';TEAMS[selectedTeam].lineup.forEach((n,i)=>{const b=document.createElement('button');b.className='player-btn'+(i===startIndex?' selected':'');b.innerHTML='<small>'+(i+1)+'棒</small>'+n;b.onclick=()=>{startIndex=i;renderSetup()};l.appendChild(b)});const s=$('opponentSelect'),prev=s.value;s.innerHTML='';Object.entries(TEAMS).filter(([id])=>id!==selectedTeam).forEach(([id,t])=>{const o=document.createElement('option');o.value=id;o.textContent=t.name;s.appendChild(o)});opponent=(prev&&prev!==selectedTeam&&TEAMS[prev])?prev:s.options[0].value;s.value=opponent}
function updateBoard(){$('cpuName').textContent=TEAMS[opponent].short;$('userName').textContent=TEAMS[selectedTeam].short;$('cpuScore').textContent=cpuScore;$('userScore').textContent=userScore;$('inningText').textContent=inning+'局下';$('outsText').textContent=outs+' 人出局';document.querySelectorAll('.dot.b').forEach((e,i)=>e.classList.toggle('on',i<balls));document.querySelectorAll('.dot.s').forEach((e,i)=>e.classList.toggle('on',i<strikes));document.querySelectorAll('.dot.o').forEach((e,i)=>e.classList.toggle('on',i<outs));[$('base1'),$('base2'),$('base3')].forEach((e,i)=>e.classList.toggle('runner',bases[i]));updateBatterCard()}
function updateBatterCard(){const lu=TEAMS[selectedTeam].lineup;currentPlayer=lu[lineupIndex%9];$('currentBatter').textContent=(lineupIndex%9+1)+'棒 '+currentPlayer;$('onDeck').textContent='下一棒：'+lu[(lineupIndex+1)%9]}
function setMsg(a,b='',kind=''){$('mainMsg').textContent=a;$('subMsg').textContent=b;$('message').className='message'+(kind?' '+kind:'')}
function clearMotion(){if(raf)cancelAnimationFrame(raf);if(timer)clearTimeout(timer);raf=0;timer=0;pitching=false;ball.style.display='none';pitcher.classList.remove('throw')}
function resetCount(){balls=0;strikes=0;swung=false;updateBoard()}
function nextBatter(){lineupIndex=(lineupIndex+1)%9;updateBatterCard()}
function markGameForLineup(){TEAMS[selectedTeam].lineup.forEach(n=>ensurePlayer(selectedTeam,n).G++)}
function beginGame(){opponent=$('opponentSelect').value;career=loadCareer();inning=1;userScore=0;cpuScore=0;outs=0;balls=0;strikes=0;bases=[false,false,false];lineupIndex=startIndex;playing=true;aimX=.5;aimY=.5;aim.style.left='50%';aim.style.top='50%';markGameForLineup();$('setup').style.display='none';$('swingBtn').disabled=false;updateBoard();simulateCpuTop(true)}
function cpuRuns(){const r=Math.random();return r<.53?0:r<.78?1:r<.92?2:r<.98?3:4}
function flash(text,cb){$('flash').textContent=text;$('flash').style.display='flex';setTimeout(()=>{$('flash').style.display='none';cb&&cb()},850)}
function simulateCpuTop(first=false){const r=cpuRuns();cpuScore+=r;updateBoard();flash(inning+'局上 '+TEAMS[opponent].short+(r?' 得 '+r+' 分':' 無得分'),()=>{setMsg(inning+'局下','輪到 '+currentPlayer+' 打擊');schedule(first?600:750)})}
function schedule(delay=650){if(!playing||outs>=3)return;clearMotion();swung=false;$('pitchName').textContent='準備投球';$('speed').textContent='';timer=setTimeout(throwPitch,delay)}
function rnd(a,b){return Math.random()*(b-a)+a}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function throwPitch(){const p=pitches[Math.floor(Math.random()*pitches.length)];lastPitch=p.n;lastSpeed=Math.round(rnd(p.min,p.max));duration=rnd(p.d[0],p.d[1]);const inz=Math.random()<.72;if(inz){targetX=rnd(.08,.92);targetY=rnd(.08,.92)}else{const q=Math.floor(Math.random()*4);if(q===0){targetX=rnd(-.24,-.06);targetY=rnd(.05,.95)}if(q===1){targetX=rnd(1.06,1.24);targetY=rnd(.05,.95)}if(q===2){targetX=rnd(.05,.95);targetY=rnd(-.24,-.06)}if(q===3){targetX=rnd(.05,.95);targetY=rnd(1.06,1.24)}}curveX=(Math.random()<.5?-1:1)*p.cx;drop=p.drop;pitchStart=performance.now();pitching=true;swung=false;$('pitchName').textContent=p.n;$('speed').textContent=lastSpeed+' km/h';pitcher.classList.remove('throw');void pitcher.offsetWidth;pitcher.classList.add('throw');timer=setTimeout(()=>{ball.style.display='block';raf=requestAnimationFrame(animatePitch)},140)}
function pitchEnd(){const fr=field.getBoundingClientRect(),zr=zone.getBoundingClientRect();return{x:zr.left-fr.left+zr.width*targetX,y:zr.top-fr.top+zr.height*targetY}}
function animatePitch(now){if(!pitching)return;const fr=field.getBoundingClientRect(),e=pitchEnd(),t=clamp((now-pitchStart-140)/duration,0,1),u=t*t*(3-2*t),sx=fr.width*.5,sy=fr.height*.51,x=sx+(e.x-sx)*u+Math.sin(Math.PI*t)*curveX*(1-t*.35),y=sy+(e.y-sy)*u+t*t*drop,sc=.42+u*.78;ball.style.left=x+'px';ball.style.top=y+'px';ball.style.transform=`translate(-50%,-50%) scale(${sc}) rotate(${t*650}deg)`;if(t>=1){pitching=false;ball.style.display='none';takePitch();return}raf=requestAnimationFrame(animatePitch)}
function inZone(){return targetX>=0&&targetX<=1&&targetY>=0&&targetY<=1}
function takePitch(){if(inZone()){strikes++;setMsg('好球！',lastPitch+' '+lastSpeed+' km/h','bad');if(strikes>=3){finishPA('K');return}}else{balls++;setMsg('壞球',lastPitch+' '+lastSpeed+' km/h');if(balls>=4){finishPA('BB');return}}updateBoard();schedule(780)}
function swing(){if(!playing||!pitching||swung)return;swung=true;batter.classList.add('swing');bat.classList.add('swing');setTimeout(()=>{batter.classList.remove('swing');bat.classList.remove('swing')},150);const t=clamp((performance.now()-pitchStart-140)/duration,0,1),te=Math.abs(t-.91),ae=Math.hypot(aimX-targetX,aimY-targetY);pitching=false;if(raf)cancelAnimationFrame(raf);ball.style.display='none';const tq=clamp(1-te/.19,0,1),aq=clamp(1-ae/.55,0,1),q=tq*.58+aq*.42;if(te>.22||ae>.72){strikes++;setMsg('揮空！','時機或準星位置沒對上','bad');if(strikes>=3)finishPA('K');else{updateBoard();schedule(760)}return}resolveContact(q)}
function resolveContact(q){const r=Math.random();if(q<.28){if(r<.6)foul();else finishPA('OUT');return}if(q<.46){if(r<.24){foul();return}finishPA(r<.72?'OUT':'1B');return}if(q<.63){finishPA(r<.4?'OUT':r<.88?'1B':'2B');return}if(q<.79){finishPA(r<.18?'OUT':r<.58?'1B':r<.92?'2B':'3B');return}if(q<.91){finishPA(r<.16?'1B':r<.58?'2B':r<.69?'3B':'HR');return}finishPA(r<.15?'2B':r<.22?'3B':'HR')}
function foul(){if(strikes<2)strikes++;setMsg('界外球','繼續纏鬥');updateBoard();schedule(780)}
function advance(hit){let runs=0;if(hit===1){const n=[true,false,false];if(bases[2])runs++;if(bases[1]){if(Math.random()<.72)runs++;else n[2]=true}if(bases[0])n[1]=true;bases=n}else if(hit===2){const n=[false,true,false];if(bases[2])runs++;if(bases[1])runs++;if(bases[0]){if(Math.random()<.55)runs++;else n[2]=true}bases=n}else if(hit===3){runs=bases.filter(Boolean).length;bases=[false,false,true]}else if(hit===4){runs=1+bases.filter(Boolean).length;bases=[false,false,false]}userScore+=runs;return runs}
function forceWalk(){let r=0;if(bases[0]&&bases[1]&&bases[2])r=1;const b3=bases[2]||(bases[1]&&bases[0]),b2=bases[1]||bases[0];bases=[true,b2,b3];userScore+=r;return r}
function finishPA(type){const p=ensurePlayer(selectedTeam,currentPlayer);p.PA++;let rbi=0,label='';if(type==='K'){p.AB++;p.K++;outs++;label='三振出局';setMsg(label,currentPlayer,'bad')}else if(type==='BB'){p.BB++;rbi=forceWalk();p.RBI+=rbi;label='四壞保送';setMsg(label,currentPlayer+(rbi?'・'+rbi+'分打點':''),'good')}else if(type==='OUT'){p.AB++;outs++;label=Math.random()<.5?'內野滾地出局':'外野高飛球出局';setMsg(label,currentPlayer,'bad')}else{p.AB++;p.H++;const n=type==='1B'?1:type==='2B'?2:type==='3B'?3:4;if(n===2)p.D2++;if(n===3)p.D3++;if(n===4)p.HR++;rbi=advance(n);p.RBI+=rbi;label=n===1?'安打！':n===2?'二壘安打！':n===3?'三壘安打！':(rbi===4?'滿貫全壘打！！！':'全壘打！！！');setMsg(label,currentPlayer+(rbi?'・'+rbi+'分打點':''),'good')}saveCareer();resetCount();nextBatter();updateBoard();if(inning>=9&&userScore>cpuScore){endGame('再見勝！');return}if(outs>=3){endHalf();return}schedule(type==='HR'?1050:850)}
function endHalf(){clearMotion();outs=0;balls=0;strikes=0;bases=[false,false,false];updateBoard();if(inning>=9&&userScore!==cpuScore){endGame(userScore>cpuScore?'比賽結束・勝利！':'比賽結束・敗北');return}inning++;flash(inning>9?'延長 '+inning+' 局':'攻守交換',()=>simulateCpuTop(false))}
function endGame(title){playing=false;clearMotion();$('swingBtn').disabled=true;const ut=ensureTeam(selectedTeam),ot=ensureTeam(opponent);ut.G++;ot.G++;ut.RS+=userScore;ut.RA+=cpuScore;ot.RS+=cpuScore;ot.RA+=userScore;if(userScore>cpuScore){ut.W++;ot.L++}else if(userScore<cpuScore){ut.L++;ot.W++}else{ut.T++;ot.T++}career.recent.unshift({ts:Date.now(),team:selectedTeam,opp:opponent,us:userScore,them:cpuScore,result:userScore>cpuScore?'勝':userScore<cpuScore?'敗':'和'});career.recent=career.recent.slice(0,30);saveCareer();setMsg(title,TEAMS[selectedTeam].short+' '+userScore+'：'+cpuScore+' '+TEAMS[opponent].short,userScore>cpuScore?'good':'bad');setTimeout(()=>{$('setup').style.display='flex';renderSetup()},1200)}
function setAim(x,y){const r=zone.getBoundingClientRect();aimX=clamp((x-r.left)/r.width,0,1);aimY=clamp((y-r.top)/r.height,0,1);aim.style.left=aimX*100+'%';aim.style.top=aimY*100+'%'}
zone.addEventListener('pointerdown',e=>{e.preventDefault();setAim(e.clientX,e.clientY)});zone.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){e.preventDefault();setAim(e.clientX,e.clientY)}});zone.addEventListener('touchstart',e=>{const t=e.touches[0];if(t){e.preventDefault();setAim(t.clientX,t.clientY)}},{passive:false});zone.addEventListener('touchmove',e=>{const t=e.touches[0];if(t){e.preventDefault();setAim(t.clientX,t.clientY)}},{passive:false});
function bind(el,fn){let t=false;el.addEventListener('touchend',e=>{e.preventDefault();t=true;fn();setTimeout(()=>t=false,350)},{passive:false});el.addEventListener('click',()=>{if(!t)fn()})}
bind($('swingBtn'),swing);bind($('startBtn'),()=>{clearMotion();playing=false;$('swingBtn').disabled=true;$('setup').style.display='flex';renderSetup()});bind($('playBtn'),beginGame);$('opponentSelect').onchange=e=>opponent=e.target.value;
function calcAvg(p){return p.AB?(p.H/p.AB).toFixed(3).replace(/^0/,''):'.000'}function calcSlg(p){const tb=(p.H-p.D2-p.D3-p.HR)+2*p.D2+3*p.D3+4*p.HR;return p.AB?(tb/p.AB).toFixed(3).replace(/^0/,''):'.000'}
function showRecords(tab='players'){career=loadCareer();$('recordsModal').classList.add('show');$('recordTeamLabel').textContent='目前：'+TEAMS[selectedTeam].name;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const body=$('recordBody');if(tab==='players'){const rows=Object.values(career.players).filter(p=>p.team===selectedTeam).sort((a,b)=>TEAMS[selectedTeam].lineup.indexOf(a.name)-TEAMS[selectedTeam].lineup.indexOf(b.name));body.innerHTML='<div class="table-wrap"><table class="stats"><thead><tr><th>球員</th><th>G</th><th>PA</th><th>AB</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>RBI</th><th>BB</th><th>K</th><th>AVG</th><th>SLG</th></tr></thead><tbody>'+rows.map(p=>`<tr><td>${p.name}</td><td>${p.G}</td><td>${p.PA}</td><td>${p.AB}</td><td>${p.H}</td><td>${p.D2}</td><td>${p.D3}</td><td>${p.HR}</td><td>${p.RBI}</td><td>${p.BB}</td><td>${p.K}</td><td>${calcAvg(p)}</td><td>${calcSlg(p)}</td></tr>`).join('')+'</tbody></table></div>';if(!rows.length)body.innerHTML='<p>還沒有球員紀錄，先打一場吧。</p>'}else if(tab==='team'){body.innerHTML='<div class="table-wrap"><table class="stats"><thead><tr><th>球隊</th><th>G</th><th>W</th><th>L</th><th>T</th><th>勝率</th><th>得分</th><th>失分</th></tr></thead><tbody>'+Object.entries(TEAMS).map(([id,t])=>{const s=career.teams[id]||{G:0,W:0,L:0,T:0,RS:0,RA:0},pct=(s.W+s.L)?(s.W/(s.W+s.L)).toFixed(3).replace(/^0/,''):'.000';return`<tr><td>${t.short}</td><td>${s.G}</td><td>${s.W}</td><td>${s.L}</td><td>${s.T}</td><td>${pct}</td><td>${s.RS}</td><td>${s.RA}</td></tr>`}).join('')+'</tbody></table></div>'}else{const games=career.recent||[];body.innerHTML='<div class="recent">'+(games.length?games.map(g=>`<div class="game-row"><b>${TEAMS[g.team]?.short||g.team} ${g.us}：${g.them} ${TEAMS[g.opp]?.short||g.opp}</b>　${g.result}<br><small>${new Date(g.ts).toLocaleString('zh-TW')}</small></div>`).join(''):'<p>還沒有比賽紀錄。</p>')+'</div>'}}
$('recordsBtn').onclick=()=>showRecords('players');$('setupRecordsBtn').onclick=()=>showRecords('players');$('closeRecords').onclick=()=>$('recordsModal').classList.remove('show');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showRecords(b.dataset.tab));$('recordsModal').addEventListener('click',e=>{if(e.target===$('recordsModal'))$('recordsModal').classList.remove('show')});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){clearMotion();schedule(800)}});renderSetup();updateBoard();
})();
</script>
