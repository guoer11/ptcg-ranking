<style>
:root{--bg:#071416;--panel:#0d292a;--line:#2f5050;--muted:#adc1bd;--gold:#ffd052;--green:#63d281;--red:#ff7777}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:#fff}button,input,select{font:inherit}button{touch-action:manipulation}.hidden{display:none!important}
.app{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:40;background:linear-gradient(#102d30,#071719);border-bottom:1px solid #254545;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:950;font-size:18px}.top button{border:0;border-radius:12px;background:#173d3d;color:#fff;padding:9px 12px;font-weight:850}
.screen{padding:14px 12px 28px;max-width:860px;margin:auto}.card{background:linear-gradient(180deg,#103333,#0a2526);border:1px solid #29494a;border-radius:20px;padding:15px;box-shadow:0 12px 30px rgba(0,0,0,.18);margin-bottom:12px}.card h2,.card h3{margin:0 0 10px}.sub{color:var(--muted);font-size:13px;line-height:1.55}
.hero{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.hero strong{font-size:20px}.badge{display:inline-flex;align-items:center;background:#173e3e;border:1px solid #315555;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900;color:#e7f0ed;white-space:nowrap}
.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 8px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid #365858;border-radius:999px;background:#173a3b;color:#d9e6e3;padding:8px 11px;font-weight:850}.filter.active{background:#ffd052;color:#493500;border-color:#ffd052}
.tools{display:grid;grid-template-columns:1fr 145px;gap:8px;margin-bottom:10px}.tools input,.tools select,.opponent select{width:100%;border:1px solid #365758;background:#0a2425;color:#fff;border-radius:13px;padding:11px 12px;outline:none}
.pool-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.pool{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:48vh;overflow:auto;padding-right:2px}.player{border:1px solid #345354;background:#102d2e;border-radius:14px;padding:10px;color:#fff;text-align:left;min-height:88px;position:relative}.player strong{display:block;font-size:15px;padding-right:28px}.player .team{font-size:11px;color:#9fb4af;margin-top:2px}.player .numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px;font-size:10px;color:#b8cbc7}.player .numbers b{display:block;color:#fff;font-size:12px}.player.selected{border-color:#ffd052;background:#183d36;box-shadow:0 0 0 2px rgba(255,208,82,.12)}.pickno{position:absolute;right:8px;top:8px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#ffd052;color:#493500;font-size:12px;font-weight:950}.nodata{opacity:.78}.loading{padding:20px;text-align:center;color:#b9cac6;grid-column:1/-1}
.lineup{display:grid;gap:7px}.slot{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;border:1px solid #315052;background:#0c2425;border-radius:14px;padding:8px;min-height:54px}.slot-no{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#173e3e;font-weight:950;color:#ffe184}.slot-name{font-weight:900}.slot-team{font-size:11px;color:#9fb4af;margin-top:2px}.actions{display:flex;gap:5px}.actions button{width:32px;height:32px;border:0;border-radius:9px;background:#173c3d;color:#fff;font-weight:950}.actions .del{background:#492c2d;color:#ffc2c2}.lineup-empty{text-align:center;color:#8da5a0;padding:15px}
.setup-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.secondary,.primary{border:0;border-radius:15px;min-height:48px;font-weight:900}.secondary{background:#1a4242;color:#fff;border:1px solid #355858}.primary{background:linear-gradient(#ffdc66,#f2b934);color:#4a3400}.primary:disabled{opacity:.38}.opponent{display:grid;gap:9px}.error{color:#ff9c9c;font-size:13px;min-height:18px}
.record-tabs{display:flex;gap:7px;margin-bottom:10px}.tab{border:0;border-radius:999px;padding:8px 11px;background:#183d3d;color:#cbd9d6;font-weight:850}.tab.active{background:#ffd052;color:#4a3400}.table-wrap{overflow:auto;border:1px solid #29494a;border-radius:13px}.stats{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}.stats th,.stats td{padding:8px 9px;border-bottom:1px solid #234143;text-align:right}.stats th:first-child,.stats td:first-child{text-align:left;position:sticky;left:0;background:#0d292a}.stats th{color:#b8cbc7;background:#102f30}.empty-note{padding:18px;text-align:center;color:#9fb4af}

.gamebar{height:58px;background:linear-gradient(#111c20,#070d10);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:5px 9px;border-bottom:1px solid rgba(255,255,255,.12);z-index:30}
.scoreteam{font-weight:950;font-size:18px}.scoreteam.right{text-align:right}.centerScore{text-align:center;font-size:11px;color:#b6c2c1}.centerScore b{display:block;font-size:15px;color:white}.minirow{display:flex;gap:7px;justify-content:center;margin-top:2px}.lamp{width:8px;height:8px;border-radius:50%;background:#364541}.lamp.on.b{background:#68d889}.lamp.on.s{background:#f6d052}.lamp.on.o{background:#ff6c6c}
.scene{position:relative;flex:1;min-height:0;overflow:hidden;perspective:900px;background:

.skyGlow{position:absolute;inset:0 0 58% 0;background:

.scoreboardBig{position:absolute;top:25%;left:50%;transform:translateX(-50%);width:23%;height:9%;background:#152322;border:4px solid #475b56;border-radius:2px;box-shadow:0 5px 0 #14201f;display:grid;place-items:center;font-weight:950;font-size:clamp(9px,2vw,17px);color:#ffd45d;z-index:3}
.light{position:absolute;top:11%;width:9px;height:80px;background:#5f6c70;z-index:2}.light:before{content:"";position:absolute;left:-22px;top:-6px;width:52px;height:30px;background:repeating-linear-gradient(90deg,#d8eff6 0 4px,#7b878b 5px 8px);border:2px solid #4d5b5f}.l1{left:17%}.l2{right:17%}
.outfield{position:absolute;left:-4%;right:-4%;top:42%;bottom:-10%;background:

.foulLine{position:absolute;bottom:7%;height:2px;background:rgba(255,255,255,.85);transform-origin:left center;z-index:5}.fl{left:50%;width:52%;transform:rotate(20deg)}.fr{right:50%;width:52%;transform-origin:right center;transform:rotate(-20deg)}
.mound{position:absolute;left:50%;top:57%;width:70px;height:26px;border-radius:50%;background:#9b6844;transform:translate(-50%,-50%);box-shadow:0 5px 8px rgba(0,0,0,.18)}
.base{position:absolute;width:13px;height:13px;background:#f6f2e5;transform:rotate(45deg);z-index:7;box-shadow:0 2px 3px #0004}.b1{left:68%;top:70%}.b2{left:50%;top:54%}.b3{right:68%;top:70%}.base.runner{background:#ffda4d;box-shadow:0 0 10px #ffd84e}
.playerMan{position:absolute;z-index:9;transform-origin:50% 100%}.playerMan .head{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;background:#ba7b55}.playerMan .body{position:absolute;left:50%;transform:translateX(-50%);border-radius:20% 20% 35% 35%;background:linear-gradient(#f7f6f2,#d7d8d4)}.playerMan .leg{position:absolute;background:#eceae2;border-radius:4px;transform-origin:50% 0}

.fielder{width:22px;height:38px;transform:translate(-50%,-50%) scale(.5)}.fielder .head{top:0;width:13px;height:13px}.fielder .body{top:12px;width:20px;height:27px}.f-lf{left:24%;top:49%}.f-cf{left:50%;top:46%}.f-rf{left:76%;top:49%}.f-ss{left:39%;top:61%}.f-2b{left:61%;top:61%}.f-1b{left:70%;top:69%}.f-3b{left:30%;top:69%}
.batter{position:absolute;right:7%;bottom:3%;width:104px;height:235px;z-index:18;transform-origin:50% 92%;filter:drop-shadow(0 7px 5px rgba(0,0,0,.35));transition:transform .1s}
.batter .head{position:absolute;left:39px;top:2px;width:31px;height:35px;border-radius:48%;background:#b97c59;box-shadow:0 -8px 0 3px #152034}

.batter .leg{position:absolute;top:118px;width:24px;height:105px;background:#eee;border-radius:8px}.batter .leg.a{left:27px;transform:rotate(2deg)}.batter .leg.b{right:23px;transform:rotate(-4deg)}

.zone:before,.zone:after{content:"";position:absolute;background:rgba(255,255,255,.18)}.zone:before{left:33.33%;top:0;width:1px;height:100%;box-shadow:30px 0 0 rgba(255,255,255,.18)}.zone:after{top:33.33%;left:0;width:100%;height:1px;box-shadow:0 39px 0 rgba(255,255,255,.18)}

#ball{position:absolute;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 36%,#eee9e0 70%,#d3cec3 100%);display:none;z-index:22;box-shadow:0 2px 5px #0008}
.hud{position:absolute;left:9px;top:9px;z-index:24;background:rgba(2,15,17,.72);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:7px 9px;font-size:11px;font-weight:850;backdrop-filter:blur(5px)}
.batterCard{position:absolute;right:9px;top:9px;z-index:24;background:rgba(2,15,17,.78);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 10px;text-align:right;font-size:11px;max-width:58vw;backdrop-filter:blur(5px)}.batterCard strong{display:block;color:#ffe078;font-size:15px}.batterCard .real{display:block;color:#c6d4d1;margin-top:2px;font-size:10px}
.message{position:absolute;left:50%;top:19%;transform:translateX(-50%);z-index:26;width:94%;text-align:center;pointer-events:none;text-shadow:0 3px 8px rgba(0,0,0,.8)}.message strong{display:block;font-size:29px}.message span{font-size:13px;font-weight:800}.message.good strong{color:#ffe169}.message.bad strong{color:#ff8585}
.intro{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);z-index:32;width:min(680px,92%);background:linear-gradient(90deg,rgba(9,14,18,.93),rgba(40,44,49,.92));border:1px solid rgba(255,255,255,.25);box-shadow:0 8px 25px #0008;display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:12px;padding:11px 13px;animation:introIn .28s ease-out}.intro.hidden{display:none!important}.intro .avatar{height:58px;border-radius:8px;background:linear-gradient(135deg,#5b2b18,#e58a2e);display:grid;place-items:center;font-size:30px}.intro .name{font-size:20px;font-weight:950}.intro .teamname{font-size:11px;color:#c9d4d2}.intro .idata{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;text-align:center;font-size:10px;color:#b8c5c3}.intro .idata b{display:block;color:#fff;font-size:16px}@keyframes introIn{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.controls{display:grid;grid-template-columns:.72fr 1.28fr;gap:10px;padding:9px 11px calc(9px + env(safe-area-inset-bottom));background:#071514;border-top:1px solid #23413e}.control{border:0;border-radius:17px;min-height:56px;font-weight:950;box-shadow:0 5px 0 rgba(0,0,0,.25)}#menuBtn{background:#e9efeb;color:#14362d}#swingBtn{background:linear-gradient(#ffdc65,#f4b936);color:#4a3200;font-size:21px}#swingBtn:disabled{opacity:.45}
.hitCam{position:absolute;inset:0;z-index:40;background:linear-gradient(#71bde9 0 27%,#275239 28%);overflow:hidden;transition:filter .25s ease}.hitCam.hidden{display:none!important}.hitCam.hrMode{filter:saturate(1.15) brightness(.88)}.hitCam .stad{position:absolute;left:-5%;right:-5%;top:18%;height:22%;background:#465b5e;clip-path:polygon(0 30%,15% 7%,50% 0,85% 7%,100% 30%,100% 100%,0 100%)}.hitCam .green{position:absolute;left:0;right:0;top:34%;bottom:0;background:repeating-linear-gradient(90deg,#2f7a45 0 42px,#3a844d 42px 84px)}.hitCam .diamond{position:absolute;left:50%;top:66%;width:min(52vw,360px);height:min(42vw,290px);background:#ac7349;transform:translate(-50%,-50%) rotate(45deg)}.hitCam .diamond:after{content:"";position:absolute;inset:18%;background:#3a7d49}.flyball{position:absolute;width:18px;height:18px;border-radius:50%;background:white;box-shadow:0 0 10px #fff8,0 3px 5px #0006;left:50%;top:78%;z-index:9}.resultSplash{position:absolute;left:50%;top:12%;transform:translateX(-50%);z-index:12;font-size:clamp(28px,8vw,58px);font-weight:1000;text-shadow:0 5px 12px #0009;color:#fff;white-space:nowrap}.hitCam.hrMode .resultSplash{color:#ffe56a;text-shadow:0 0 20px #ffb000,0 7px 18px #000}.hitFielder{position:absolute;width:18px;height:30px;z-index:8;transform:translate(-50%,-50%);transition:filter .2s}.hitFielder:before{content:"";position:absolute;left:5px;top:0;width:9px;height:9px;border-radius:50%;background:#bd815e}.hitFielder:after{content:"";position:absolute;left:2px;top:8px;width:14px;height:21px;border-radius:4px;background:linear-gradient(#f4f3ed,#cfd4d2);box-shadow:0 12px 0 -5px #eee}.hf-lf{left:23%;top:48%}.hf-cf{left:50%;top:44%}.hf-rf{left:77%;top:48%}.hf-ss{left:39%;top:62%}.hf-2b{left:61%;top:62%}.hf-1b{left:70%;top:71%}.hf-3b{left:30%;top:71%}.hitRunner{position:absolute;left:50%;top:84%;width:18px;height:28px;z-index:10;transform:translate(-50%,-50%);opacity:0}.hitRunner:before{content:"";position:absolute;left:5px;top:0;width:9px;height:9px;border-radius:50%;background:#b97b59;box-shadow:0 -3px 0 1px #18253b}.hitRunner:after{content:"";position:absolute;left:2px;top:8px;width:14px;height:20px;border-radius:4px;background:#e98b2d}.catchFlash{position:absolute;width:42px;height:42px;border:3px solid #fff;border-radius:50%;z-index:11;opacity:0;transform:translate(-50%,-50%) scale(.5);pointer-events:none}.catchFlash.pop{animation:catchPop .38s ease-out}@keyframes catchPop{0%{opacity:1;transform:translate(-50%,-50%) scale(.35)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(2,15,14,.91);display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:min(650px,96vw);max-height:88vh;overflow:auto;background:#0b2829;border:1px solid #315152;border-radius:22px;padding:17px}.modal h2{margin:0 0 8px}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}

@media(min-width:760px){.pool{grid-template-columns:repeat(3,1fr)}}

<body>
<div id="setupApp" class="app">
  <header class="top"><div class="brand">⚾ 中職九局棒球</div><button id="recordBtn">紀錄</button></header>
  <main class="screen">
    <section class="card">
      <div class="hero"><div><strong>從全部一軍球員挑 9 人</strong><div id="poolStatus" class="sub">讀取完整球員池中…</div></div><span id="selectedCountTop" class="badge">0 / 9</span></div>
      <div id="teamFilters" class="filters" style="margin-top:10px"></div>
      <div class="tools"><input id="searchInput" placeholder="搜尋球員姓名"><select id="sortSelect"><option value="OPS">OPS 高→低</option><option value="AVG">AVG 高→低</option><option value="SLG">SLG 高→低</option><option value="NAME">姓名</option></select></div>
      <div class="pool-head"><h3 style="margin:0">球員池</h3><span class="sub">點球員加入先發</span></div>
      <div id="playerPool" class="pool"><div class="loading">載入中…</div></div>
    </section>

    <section class="card">
      <div class="hero"><div><h2 style="margin:0">我的先發九人</h2><div class="sub">選取順序就是棒次，可用 ↑ ↓ 調整。</div></div><span id="selectedCount" class="badge">0 / 9</span></div>
      <div id="lineup" class="lineup" style="margin-top:10px"><div class="lineup-empty">還沒選球員。</div></div>
      <div class="setup-actions"><button id="randomLineupBtn" class="secondary">隨機選 9 人</button><button id="clearLineupBtn" class="secondary">清空</button></div>
    </section>

    <section class="card opponent">
      <h2>選擇對手</h2>
      <select id="opponentSelect"></select>
      <div id="lineupError" class="error"></div>
      <button id="startGameBtn" class="primary" style="width:100%" disabled>選滿 9 人後開始比賽</button>
    </section>
  </main>
</div>

<div id="gameApp" class="game hidden">
  <header class="gamebar">
    <div class="scoreteam"><span id="cpuShort">CPU</span> <span id="cpuScore">0</span></div>
    <div class="centerScore"><b id="inningText">1局下</b><span id="situation">0人出局</span><div class="minirow">B <i class="lamp b"></i><i class="lamp b"></i><i class="lamp b"></i> S <i class="lamp s"></i><i class="lamp s"></i> O <i class="lamp o"></i><i class="lamp o"></i><i class="lamp o"></i></div></div>
    <div class="scoreteam right"><span id="userScore">0</span> STAR</div>
  </header>

<script>
(()=>{
const $=id=>document.getElementById(id),qsa=s=>[...document.querySelectorAll(s)];
const teams={brothers:{name:'中信兄弟',short:'兄弟'},lions:{name:'統一7-ELEVEn獅',short:'統一'},monkeys:{name:'樂天桃猿',short:'樂天'},dragons:{name:'味全龍',short:'味全'},guardians:{name:'富邦悍將',short:'富邦'},hawks:{name:'台鋼雄鷹',short:'台鋼'}};
const teamByName=Object.fromEntries(Object.entries(teams).map(([k,v])=>[v.name,k]));
const STATS_KEY='cpblFantasyGameStatsV5',LINEUP_KEY='cpblFantasyLineupV5';
let db=JSON.parse(localStorage.getItem(STATS_KEY)||localStorage.getItem('cpblFantasyGameStatsV4')||'{"players":{},"games":[]}');
let players=[],lineup=[],filterTeam='all',search='',sortBy='OPS',opponent='brothers';
let playing=false,inning=1,userScore=0,cpuScore=0,balls=0,strikes=0,outs=0,bases=[false,false,false],batIndex=0;
let pitching=false,pitchStart=0,pitchDuration=1100,pitchTargetX=.5,pitchTargetY=.5,pitchCurve=0,pitchDrop=0,lastPitch='直球',lastSpeed=145,raf=0,timer=0,aimX=.5,aimY=.5,lastSwingTouch=0,introTimer=0;
const pitchTypes=[{n:'四縫線',s:[142,156],d:[760,930],c:8,drop:4},{n:'二縫線',s:[138,150],d:[820,980],c:18,drop:8},{n:'滑球',s:[128,142],d:[900,1060],c:34,drop:12},{n:'變速球',s:[118,132],d:[1010,1200],c:12,drop:20},{n:'曲球',s:[113,128],d:[1060,1280],c:24,drop:34}];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>Math.random()*(b-a)+a,num=v=>{const n=Number(v);return Number.isFinite(n)?n:null},rate=v=>v==null?'—':num(v).toFixed(3).replace(/^0/,'');
function playerId(p){return p.teamKey+'|'+p.name}
function saveDb(){localStorage.setItem(STATS_KEY,JSON.stringify(db))}
function saveLineup(){localStorage.setItem(LINEUP_KEY,JSON.stringify(lineup.map(p=>playerId(p))))}
async function loadPlayers(){
 try{
  const r=await fetch('data/cpbl_batting_2026.json?v='+Date.now(),{cache:'no-store'}); if(!r.ok)throw Error(r.status);
  const j=await r.json(); players=Object.values(j.players||{}).map(s=>{const teamKey=teamByName[s.team];return teamKey?{name:s.player,teamKey,teamName:s.team,stats:s}:null}).filter(Boolean);
  const seen=new Set();players=players.filter(p=>{const k=playerId(p);if(seen.has(k))return false;seen.add(k);return true});
  $('poolStatus').textContent=`2026 正式註冊一軍球員池・共 ${players.length} 人可選`;
  const saved=JSON.parse(localStorage.getItem(LINEUP_KEY)||'[]');
  if(Array.isArray(saved)&&saved.length){lineup=saved.map(id=>players.find(p=>playerId(p)===id)).filter(Boolean).slice(0,9)}
 }catch(e){$('poolStatus').textContent='球員資料讀取失敗，請重新整理後再試';console.warn(e)}
 renderFilters();renderPool();renderLineup();renderOpponent();
}
function renderFilters(){$('teamFilters').innerHTML=`<button class="filter active" data-f="all">全部</button>`+Object.entries(teams).map(([k,t])=>`<button class="filter" data-f="${k}">${t.short}</button>`).join('');qsa('[data-f]').forEach(b=>b.onclick=()=>{filterTeam=b.dataset.f;qsa('[data-f]').forEach(x=>x.classList.toggle('active',x===b));renderPool()})}
function metric(p,key){const s=p.stats||{};if(key==='NAME')return p.name;return num(s[key])}
function visiblePlayers(){let list=players.filter(p=>(filterTeam==='all'||p.teamKey===filterTeam)&&(!search||p.name.includes(search)));return list.sort((a,b)=>{if(sortBy==='NAME')return a.name.localeCompare(b.name,'zh-Hant');const av=metric(a,sortBy),bv=metric(b,sortBy);if(av==null&&bv!=null)return 1;if(av!=null&&bv==null)return-1;if(av==null&&bv==null)return a.name.localeCompare(b.name,'zh-Hant');return bv-av||a.name.localeCompare(b.name,'zh-Hant')})}
function selectedIndex(p){const id=playerId(p);return lineup.findIndex(x=>playerId(x)===id)}
function renderPool(){const list=visiblePlayers();$('playerPool').innerHTML=list.length?list.map(p=>{const i=selectedIndex(p),s=p.stats;return`<button class="player ${i>=0?'selected':''} ${s?.AVG==null?'nodata':''}" data-pid="${playerId(p)}">${i>=0?`<span class="pickno">${i+1}</span>`:''}<strong>${p.name}</strong><div class="team">${p.teamName}</div><div class="numbers"><span>AVG<b>${rate(s?.AVG)}</b></span><span>SLG<b>${rate(s?.SLG)}</b></span><span>OPS<b>${rate(s?.OPS)}</b></span></div></button>`}).join(''):'<div class="loading">沒有符合的球員</div>';qsa('[data-pid]').forEach(b=>b.onclick=()=>togglePlayer(b.dataset.pid))}
function togglePlayer(id){const p=players.find(x=>playerId(x)===id);if(!p)return;const i=selectedIndex(p);$('lineupError').textContent='';if(i>=0)lineup.splice(i,1);else if(lineup.length<9)lineup.push(p);else{$('lineupError').textContent='已選滿 9 人，請先移除一位。';return}saveLineup();renderPool();renderLineup()}
function renderLineup(){$('selectedCount').textContent=lineup.length+' / 9';$('selectedCountTop').textContent=lineup.length+' / 9';$('startGameBtn').disabled=lineup.length!==9;$('startGameBtn').textContent=lineup.length===9?'開始 9 局比賽':'選滿 9 人後開始比賽';$('lineup').innerHTML=lineup.length?lineup.map((p,i)=>`<div class="slot"><div class="slot-no">${i+1}</div><div><div class="slot-name">${p.name}</div><div class="slot-team">${p.teamName}・第 ${i+1} 棒</div></div><div class="actions"><button data-u="${i}" ${i===0?'disabled':''}>↑</button><button data-d="${i}" ${i===lineup.length-1?'disabled':''}>↓</button><button class="del" data-x="${i}">×</button></div></div>`).join(''):'<div class="lineup-empty">還沒選球員。從上面球員池挑 9 個。</div>';qsa('[data-u]').forEach(b=>b.onclick=()=>move(+b.dataset.u,-1));qsa('[data-d]').forEach(b=>b.onclick=()=>move(+b.dataset.d,1));qsa('[data-x]').forEach(b=>b.onclick=()=>{lineup.splice(+b.dataset.x,1);saveLineup();renderPool();renderLineup()})}
function move(i,d){const j=i+d;if(j<0||j>=lineup.length)return;[lineup[i],lineup[j]]=[lineup[j],lineup[i]];saveLineup();renderPool();renderLineup()}
$('clearLineupBtn').onclick=()=>{lineup=[];saveLineup();renderPool();renderLineup()};
$('randomLineupBtn').onclick=()=>{lineup=[...players].sort(()=>Math.random()-.5).slice(0,9);saveLineup();renderPool();renderLineup()};
$('searchInput').oninput=e=>{search=e.target.value.trim();renderPool()};$('sortSelect').onchange=e=>{sortBy=e.target.value;renderPool()};
function renderOpponent(){$('opponentSelect').innerHTML=Object.entries(teams).map(([k,t])=>`<option value="${k}">${t.name}</option>`).join('');opponent=$('opponentSelect').value;$('opponentSelect').onchange=()=>opponent=$('opponentSelect').value}
$('startGameBtn').onclick=()=>{if(lineup.length!==9){$('lineupError').textContent='請先選滿 9 位先發球員。';return}opponent=$('opponentSelect').value;startGame()};

function ensurePlayer(p){const k=playerId(p);if(!db.players[k])db.players[k]={team:p.teamKey,name:p.name,G:0,PA:0,AB:0,H:0,D2:0,D3:0,HR:0,RBI:0,BB:0,K:0};return db.players[k]}
function currentPlayer(){return lineup[batIndex%9]}function currentStat(){return ensurePlayer(currentPlayer())}
function battingAbility(){const s=currentPlayer()?.stats;if(!s)return{contact:0,power:0};const pa=Math.max(0,num(s.PA)||0),w=clamp(pa/100,0,1),avg=.255+((num(s.AVG)??.255)-.255)*w,slg=.360+((num(s.SLG)??.360)-.360)*w;return{contact:clamp((avg-.255)/.08,-1,1),power:clamp((slg-.360)/.18,-1,1)}}
function teamOffenseStrength(teamKey){const a=players.filter(p=>p.teamKey===teamKey&&num(p.stats?.OPS)!=null).sort((x,y)=>(num(y.stats.OPS)||0)-(num(x.stats.OPS)||0)).slice(0,9);if(!a.length)return 0;const avg=a.reduce((s,p)=>s+(num(p.stats.OPS)||.65),0)/a.length;return clamp((avg-.68)/.18,-.6,.7)}
function setMsg(a,b='',kind=''){$('message').className='message '+kind;$('message').innerHTML=`<strong>${a}</strong><span>${b}</span>`}
function showIntro(){clearTimeout(introTimer);const p=currentPlayer(),s=p.stats;$('introName').textContent=p.name;$('introTeam').textContent=p.teamName+'・第 '+((batIndex%9)+1)+' 棒';$('introAvg').textContent=rate(s?.AVG);$('introSlg').textContent=rate(s?.SLG);$('introOps').textContent=rate(s?.OPS);$('introCard').classList.remove('hidden');introTimer=setTimeout(()=>$('introCard').classList.add('hidden'),950)}
function updateBoard(){if(!opponent||!lineup.length)return;$('cpuShort').textContent=teams[opponent].short;$('cpuScore').textContent=cpuScore;$('userScore').textContent=userScore;$('inningText').textContent=inning+'局下';$('situation').textContent=outs+'人出局';qsa('.lamp.b').forEach((e,i)=>e.classList.toggle('on',i<balls));qsa('.lamp.s').forEach((e,i)=>e.classList.toggle('on',i<strikes));qsa('.lamp.o').forEach((e,i)=>e.classList.toggle('on',i<outs));[$('base1'),$('base2'),$('base3')].forEach((e,i)=>e.classList.toggle('runner',bases[i]));const cur=currentPlayer(),n1=lineup[(batIndex+1)%9],n2=lineup[(batIndex+2)%9],s=cur.stats;$('orderText').textContent='第 '+((batIndex%9)+1)+' 棒';$('currentBatter').textContent=cur.name;$('batterTeam').textContent=cur.teamName;$('batterRealStats').textContent=`AVG ${rate(s?.AVG)}・SLG ${rate(s?.SLG)}・OPS ${rate(s?.OPS)}`;$('nextBatters').textContent='後面：'+n1.name+'、'+n2.name}
function clearMotion(){if(raf)cancelAnimationFrame(raf);if(timer)clearTimeout(timer);raf=timer=0;pitching=false;$('ball').style.display='none';$('pitcher').classList.remove('windup','release')}
function startGame(){$('setupApp').classList.add('hidden');$('gameApp').classList.remove('hidden');$('swingBtn').disabled=false;playing=true;inning=1;userScore=0;cpuScore=0;balls=strikes=outs=0;bases=[false,false,false];batIndex=0;aimX=aimY=.5;$('aim').style.left='50%';$('aim').style.top='50%';lineup.forEach(p=>ensurePlayer(p).G++);saveDb();updateBoard();simulateCpu(true)}
function cpuRuns(){const boost=teamOffenseStrength(opponent),r=Math.random(),a=.57-boost*.06,b=.80-boost*.035,c=.93-boost*.015,d=.98-boost*.008;return r<a?0:r<b?1:r<c?2:r<d?3:4}
function simulateCpu(first=false){cpuScore+=cpuRuns();updateBoard();if(inning===9&&userScore>cpuScore)return endGame('比賽勝利！');setMsg(inning+'局下','輪到你的自選 9 人進攻','');showIntro();schedulePitch(first?1000:1100)}
function schedulePitch(delay=720){if(!playing||outs>=3)return;clearMotion();$('pitchInfo').textContent='投手準備';timer=setTimeout(beginWindup,delay)}
function beginWindup(){if(!playing)return;$('pitcher').classList.add('windup');timer=setTimeout(throwPitch,470)}
function throwPitch(){if(!playing)return;$('pitcher').classList.remove('windup');$('pitcher').classList.add('release');const p=pitchTypes[Math.floor(Math.random()*pitchTypes.length)];lastPitch=p.n;lastSpeed=Math.round(rand(...p.s));pitchDuration=rand(...p.d);const inZone=Math.random()<.71;if(inZone){pitchTargetX=rand(.08,.92);pitchTargetY=rand(.08,.92)}else{const side=Math.floor(Math.random()*4);if(side===0){pitchTargetX=rand(-.25,-.05);pitchTargetY=rand(.05,.95)}if(side===1){pitchTargetX=rand(1.05,1.25);pitchTargetY=rand(.05,.95)}if(side===2){pitchTargetX=rand(.05,.95);pitchTargetY=rand(-.25,-.05)}if(side===3){pitchTargetX=rand(.05,.95);pitchTargetY=rand(1.05,1.25)}}pitchCurve=(Math.random()<.5?-1:1)*p.c;pitchDrop=p.drop;pitchStart=performance.now();pitching=true;$('pitchInfo').textContent=lastPitch+' '+lastSpeed+' km/h';$('ball').style.display='block';raf=requestAnimationFrame(animatePitch)}
function pitchEnd(){const f=$('scene').getBoundingClientRect(),z=$('zone').getBoundingClientRect();return{x:z.left-f.left+z.width*pitchTargetX,y:z.top-f.top+z.height*pitchTargetY}}
function animatePitch(now){if(!pitching)return;const f=$('scene').getBoundingClientRect(),e=pitchEnd(),t=clamp((now-pitchStart)/pitchDuration,0,1),ease=t*t*(3-2*t),sx=f.width*.5,sy=f.height*.53,x=sx+(e.x-sx)*ease+Math.sin(Math.PI*t)*pitchCurve*(1-t*.2),y=sy+(e.y-sy)*ease+Math.pow(t,2)*pitchDrop,scale=.42+ease*1.16;const b=$('ball');b.style.left=x+'px';b.style.top=y+'px';b.style.transform=`translate(-50%,-50%) scale(${scale})`;if(t>=1){pitching=false;b.style.display='none';takePitch();return}raf=requestAnimationFrame(animatePitch)}
function strikeLoc(){return pitchTargetX>=0&&pitchTargetX<=1&&pitchTargetY>=0&&pitchTargetY<=1}
function takePitch(){if(strikeLoc()){strikes++;setMsg('好球！',lastPitch+' '+lastSpeed+' km/h','bad');if(strikes>=3)return finishPA('K')}else{balls++;setMsg('壞球',lastPitch+' '+lastSpeed+' km/h','');if(balls>=4)return finishPA('BB')}updateBoard();schedulePitch(820)}
function swing(){if(!playing||!pitching)return;const batter=$('batter'),bat=$('bat');batter.classList.add('swing');bat.classList.add('swing');setTimeout(()=>{batter.classList.remove('swing');bat.classList.remove('swing')},240);const t=clamp((performance.now()-pitchStart)/pitchDuration,0,1),timingErr=Math.abs(t-.89),aimErr=Math.hypot(aimX-pitchTargetX,aimY-pitchTargetY);pitching=false;if(raf)cancelAnimationFrame(raf);$('ball').style.display='none';if(timingErr>.23||aimErr>.72){strikes++;setMsg('揮空！','時機或準星位置沒對上','bad');if(strikes>=3)return finishPA('K');updateBoard();return schedulePitch(820)}const tq=clamp(1-timingErr/.20,0,1),aq=clamp(1-aimErr/.56,0,1),contact=tq*.58+aq*.42;resolveContact(contact)}
function resolveContact(c){const a=battingAbility();c=clamp(c+a.contact*.055+a.power*.04*Math.max(0,(c-.35)/.65),0,1);const r=Math.random();if(c<.28){if(r<.56)return foul();return showHitThen('OUT','滾地球出局')}if(c<.45){if(r<.2)return foul();if(r<.68)return showHitThen('OUT','內野滾地出局');return showHitThen('1B')}if(c<.62){const outCut=clamp(.36-a.contact*.025,.31,.41),singleCut=clamp(.87-a.power*.055,.79,.93);if(r<outCut)return showHitThen('OUT','外野高飛球出局');if(r<singleCut)return showHitThen('1B');return showHitThen('2B')}if(c<.78){const outCut=clamp(.18-a.contact*.02,.14,.22),singleCut=clamp(.58-a.power*.06,.48,.67),doubleCut=clamp(.92-a.power*.025,.86,.95);if(r<outCut)return showHitThen('OUT','平飛球接殺');if(r<singleCut)return showHitThen('1B');if(r<doubleCut)return showHitThen('2B');return showHitThen('3B')}if(c<.9){const singleCut=clamp(.18-a.contact*.02,.13,.22),doubleCut=clamp(.54-a.power*.055,.44,.61),tripleCut=clamp(.67-a.power*.025,.61,.71);if(r<singleCut)return showHitThen('1B');if(r<doubleCut)return showHitThen('2B');if(r<tripleCut)return showHitThen('3B');return showHitThen('HR')}const hrCut=clamp(.22-a.power*.07,.13,.29);return r<.16?showHitThen('2B'):r<hrCut?showHitThen('3B'):showHitThen('HR')}
function resetHitCamera(){const cam=$('hitCam'),ball=$('flyball'),runner=$('hitRunner');cam.classList.remove('hrMode');ball.getAnimations().forEach(a=>a.cancel());runner.getAnimations().forEach(a=>a.cancel());runner.style.opacity='0';runner.style.left='50%';runner.style.top='84%';qsa('[data-hf]').forEach(f=>{f.getAnimations().forEach(a=>a.cancel());f.style.filter='';});const flash=$('catchFlash');flash.classList.remove('pop');flash.style.opacity='0'}
function nearestHitFielder(x,y){const map={lf:[23,48],cf:[50,44],rf:[77,48],ss:[39,62],'2b':[61,62],'1b':[70,71],'3b':[30,71]};let best=null,bd=1e9;for(const [k,[fx,fy]] of Object.entries(map)){const d=(fx-x)**2+(fy-y)**2;if(d<bd){bd=d;best=k}}return qsa('[data-hf]').find(f=>f.dataset.hf===best)}
function animateRunner(result,duration){const runner=$('hitRunner');const pts={'1B':[[50,84],[70,70]],'2B':[[50,84],[70,70],[50,51]],'3B':[[50,84],[70,70],[50,51],[30,70]],HR:[[50,84],[70,70],[50,51],[30,70],[50,84]]}[result];if(!pts)return;runner.style.opacity='1';const frames=pts.map((p,i)=>({left:p[0]+'%',top:p[1]+'%',offset:i/(pts.length-1),transform:`translate(-50%,-50%) ${i%2?'rotate(5deg)':'rotate(-5deg)'}`}));runner.animate(frames,{duration,easing:'linear',fill:'forwards'})}
function showHitThen(result,label=''){resetHitCamera();const cam=$('hitCam'),ball=$('flyball'),splash=$('resultSplash');cam.classList.remove('hidden');const text=result==='HR'?'HOME RUN!':result==='3B'?'三壘安打':result==='2B'?'二壘安打':result==='1B'?'安打':label||'出局';splash.textContent=text;const target={HR:[50,8],'3B':[26,41],'2B':[74,44],'1B':[62,58],OUT:[50,49]}[result]||[50,50];const isHr=result==='HR',dur=isHr?1450:980;cam.classList.toggle('hrMode',isHr);const fielder=nearestHitFielder(target[0],target[1]);if(fielder&&!isHr){const rect=fielder.getBoundingClientRect(),crect=cam.getBoundingClientRect();const sx=(rect.left+rect.width/2-crect.left)/crect.width*100,sy=(rect.top+rect.height/2-crect.top)/crect.height*100;fielder.animate([{left:sx+'%',top:sy+'%'},{left:(target[0]+(result==='OUT'?0:(target[0]>50?-4:4)))+'%',top:(target[1]+4)+'%'}],{duration:760,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'})}const ballFrames=isHr?[{left:'50%',top:'78%',transform:'scale(1)'},{left:'48%',top:'43%',transform:'scale(.78)'},{left:'52%',top:'8%',transform:'scale(.38)'}]:[{left:'50%',top:'78%',transform:'scale(1)'},{left:((target[0]+50)/2)+'%',top:((target[1]+78)/2-10)+'%',transform:'scale(.82)'},{left:target[0]+'%',top:target[1]+'%',transform:'scale(.68)'}];ball.animate(ballFrames,{duration:dur,easing:isHr?'cubic-bezier(.18,.65,.15,1)':'cubic-bezier(.2,.7,.2,1)',fill:'forwards'});if(result!=='OUT')animateRunner(result,isHr?1800:result==='3B'?1450:result==='2B'?1200:950);if(result==='OUT'&&fielder){setTimeout(()=>{const flash=$('catchFlash');flash.style.left=target[0]+'%';flash.style.top=target[1]+'%';flash.style.opacity='1';flash.classList.remove('pop');void flash.offsetWidth;flash.classList.add('pop');splash.textContent=label||'接殺出局'},720)}if(isHr){setTimeout(()=>{splash.textContent='全壘打！'},720)}setTimeout(()=>{cam.classList.add('hidden');resetHitCamera();finishPA(result,label)},isHr?1900:result==='3B'?1500:result==='2B'?1280:1080)}
function foul(){if(strikes<2)strikes++;setMsg('界外球','繼續這個打席','');updateBoard();schedulePitch(820)}
function advance(type){let runs=0;if(type==='BB'){if(bases[0]&&bases[1]&&bases[2])runs++;bases=[true,bases[1]||bases[0],bases[2]||(bases[1]&&bases[0])]}if(type==='1B'){const n=[true,false,false];if(bases[2])runs++;if(bases[1])Math.random()<.72?runs++:n[2]=true;if(bases[0])n[1]=true;bases=n}if(type==='2B'){const n=[false,true,false];if(bases[2])runs++;if(bases[1])runs++;if(bases[0])Math.random()<.55?runs++:n[2]=true;bases=n}if(type==='3B'){runs+=bases.filter(Boolean).length;bases=[false,false,true]}if(type==='HR'){runs=1+bases.filter(Boolean).length;bases=[false,false,false]}return runs}
function finishPA(result,label=''){const p=currentPlayer(),s=currentStat();s.PA++;let runs=0;if(result==='K'){s.AB++;s.K++;outs++;label='三振出局'}else if(result==='BB'){s.BB++;runs=advance('BB');label='四壞保送'}else if(result==='OUT'){s.AB++;outs++}else{s.AB++;s.H++;if(result==='2B')s.D2++;if(result==='3B')s.D3++;if(result==='HR')s.HR++;runs=advance(result);s.RBI+=runs;label=result==='1B'?'安打！':result==='2B'?'二壘安打！':result==='3B'?'三壘安打！':'全壘打！！！'}userScore+=runs;setMsg(label,(runs?runs+' 分打點・':'')+p.name,result==='OUT'||result==='K'?'bad':'good');batIndex=(batIndex+1)%9;balls=strikes=0;saveDb();updateBoard();if(inning===9&&userScore>cpuScore)return endGame('再見勝！');if(outs>=3)return endHalf();showIntro();schedulePitch(1100)}
function endHalf(){clearMotion();outs=0;balls=strikes=0;bases=[false,false,false];updateBoard();if(inning>=9){if(userScore!==cpuScore)return endGame(userScore>cpuScore?'比賽勝利！':'比賽敗北');return endGame('九局和局')}inning++;setMsg(inning+'局上','對手進攻中…','');timer=setTimeout(()=>simulateCpu(false),1100)}
function endGame(title){playing=false;clearMotion();$('swingBtn').disabled=true;db.games.unshift({date:new Date().toISOString(),opp:opponent,us:userScore,them:cpuScore,lineup:lineup.map(p=>({name:p.name,team:p.teamName}))});db.games=db.games.slice(0,30);saveDb();$('gameOverTitle').textContent=title;$('gameOverText').textContent='自選明星隊 '+userScore+'：'+cpuScore+' '+teams[opponent].name;$('gameOverOverlay').classList.remove('hidden')}
function setAim(x,y){const r=$('zone').getBoundingClientRect();aimX=clamp((x-r.left)/r.width,0,1);aimY=clamp((y-r.top)/r.height,0,1);$('aim').style.left=aimX*100+'%';$('aim').style.top=aimY*100+'%'}
$('zone').addEventListener('pointerdown',e=>{e.preventDefault();setAim(e.clientX,e.clientY)});$('zone').addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){e.preventDefault();setAim(e.clientX,e.clientY)}})
$('swingBtn').addEventListener('touchend',e=>{e.preventDefault();lastSwingTouch=Date.now();swing()},{passive:false});$('swingBtn').addEventListener('click',()=>{if(Date.now()-lastSwingTouch>500)swing()})
$('menuBtn').onclick=()=>{if(confirm('要結束這場比賽並回選人畫面嗎？'))returnToSetup()};function returnToSetup(){playing=false;clearMotion();$('gameApp').classList.add('hidden');$('setupApp').classList.remove('hidden');$('gameOverOverlay').classList.add('hidden');$('swingBtn').disabled=false;renderPool();renderLineup()}$('backSetupBtn').onclick=returnToSetup;$('againBtn').onclick=()=>{$('gameOverOverlay').classList.add('hidden');startGame()};

function calcAvg(s){return s.AB?s.H/s.AB:0}function calcObp(s){const d=s.AB+s.BB;return d?(s.H+s.BB)/d:0}function calcSlg(s){if(!s.AB)return 0;const singles=s.H-s.D2-s.D3-s.HR;return(singles+2*s.D2+3*s.D3+4*s.HR)/s.AB}function fr(v){return v.toFixed(3).replace(/^0/,'')}
function renderRecords(tab='players'){qsa('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='players'){const arr=Object.values(db.players).sort((a,b)=>b.PA-a.PA);$('recordsBody').innerHTML=arr.length?`<div class="table-wrap"><table class="stats"><thead><tr><th>球員</th><th>G</th><th>PA</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>RBI</th><th>BB</th><th>K</th><th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th></tr></thead><tbody>${arr.map(s=>{const av=calcAvg(s),ob=calcObp(s),sl=calcSlg(s);return`<tr><td>${s.name}</td><td>${s.G}</td><td>${s.PA}</td><td>${s.H}</td><td>${s.D2}</td><td>${s.D3}</td><td>${s.HR}</td><td>${s.RBI}</td><td>${s.BB}</td><td>${s.K}</td><td>${fr(av)}</td><td>${fr(ob)}</td><td>${fr(sl)}</td><td>${fr(ob+sl)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty-note">還沒有球員紀錄</div>'}else{$('recordsBody').innerHTML=db.games.length?db.games.map(g=>`<div class="card" style="margin-bottom:8px"><strong>自選明星隊 ${g.us}：${g.them} ${teams[g.opp]?.name||g.opp}</strong><div class="sub">${new Date(g.date).toLocaleString('zh-TW')}<br>${g.lineup.map((p,i)=>`${i+1}.${p.name}`).join('　')}</div></div>`).join(''):'<div class="empty-note">還沒有比賽紀錄</div>'}}
$('recordBtn').onclick=()=>{$('recordsOverlay').classList.remove('hidden');renderRecords('players')};qsa('.tab').forEach(b=>b.onclick=()=>renderRecords(b.dataset.tab));$('closeRecords').onclick=()=>$('recordsOverlay').classList.add('hidden');$('resetRecords').onclick=()=>{if(confirm('確定要清除所有遊戲紀錄嗎？')){db={players:{},games:[]};saveDb();renderRecords('players')}};
loadPlayers();
})();
