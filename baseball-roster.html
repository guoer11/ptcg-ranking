<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>中職先發名單管理</title>
<style>
:root{--bg:#061719;--panel:#0d292a;--panel2:#123637;--line:#315354;--muted:#a8beb8;--gold:#ffd052}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}button,input{font:inherit}.hidden{display:none!important}
header{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(#0d2d2f,#071b1d);border-bottom:1px solid #244647;font-weight:950;font-size:18px}
main{max-width:820px;margin:auto;padding:14px 12px 30px}.card{background:linear-gradient(#103333,#0a2526);border:1px solid #29494a;border-radius:20px;padding:15px;margin-bottom:12px}.card h2{margin:0 0 9px}.sub{color:var(--muted);font-size:13px;line-height:1.55}
.team-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.team{min-height:65px;border:2px solid transparent;border-radius:16px;color:#fff;text-align:left;padding:10px;font-weight:950}.team span{display:block;font-size:11px;opacity:.82;margin-top:3px}.team.active{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,208,82,.13)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{border:1px solid #355b5b;background:#173f40;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:900}.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin:10px 0}.tools input{width:100%;background:#081f20;color:#fff;border:1px solid #365858;border-radius:12px;padding:11px}.tools button,.small{border:0;background:#1a4242;color:#fff;border-radius:12px;padding:0 12px;font-weight:850}
.roster{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:430px;overflow:auto}.player{border:1px solid #355556;background:#102d2e;color:#fff;border-radius:13px;padding:10px;text-align:left;min-height:52px}.player strong{display:block}.player small{display:block;color:#a0b5b0;margin-top:3px}.player.on{border-color:var(--gold);background:#193c37}.player.on small{color:#ffe181}
.lineup{display:grid;gap:7px;margin-top:10px}.slot{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;border:1px solid #315152;background:#0c2526;border-radius:13px;padding:8px}.no{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#173e3e;color:#ffe181;font-weight:950}.actions{display:flex;gap:5px}.actions button{border:0;background:#173d3d;color:#fff;width:32px;height:32px;border-radius:9px}.actions .del{color:#ffaaa5}
.primary{width:100%;border:0;border-radius:15px;min-height:52px;background:linear-gradient(#ffdc66,#f2b934);color:#4b3400;font-weight:950;font-size:17px;margin-top:10px}.primary:disabled{opacity:.42}.note{font-size:11px;line-height:1.55;color:#8fa6a1;margin-top:8px}
#gameWrap{position:fixed;inset:0;background:#061719;z-index:50}.gameTop{height:54px;padding:calc(7px + env(safe-area-inset-top)) 10px 7px;background:#071b1d;display:flex;align-items:center;justify-content:space-between}.gameTop button{border:0;border-radius:11px;background:#173d3d;color:#fff;padding:8px 11px;font-weight:850}.gameTop span{font-weight:900}.frame{width:100%;height:calc(100% - 54px - env(safe-area-inset-top));border:0;background:#061719}
@media(min-width:700px){.team-grid{grid-template-columns:repeat(3,1fr)}.roster{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>⚾ 中職先發名單管理</header>
<main>
<section class="card"><h2>1. 選擇球隊</h2><div class="sub">選一隊後，會出現該隊完整的現役註冊球員池。</div><div id="teams" class="team-grid"></div></section>
<section id="poolCard" class="card hidden"><div class="head"><div><h2>2. 從全隊選 9 人</h2><div id="poolName" class="sub"></div></div><div id="count" class="badge">0 / 9</div></div><div class="tools"><input id="search" type="search" placeholder="搜尋球員"><button id="clear">清空</button></div><div id="roster" class="roster"></div><div class="note">名單依中職官網現役球員資料整理；已排除官網標記為註銷註冊（#）、合約所屬僅二軍（*）、自培／尚未註冊（◎）的球員。名單會隨聯盟異動而可能變更。</div></section>
<section id="orderCard" class="card hidden"><div class="head"><div><h2>3. 排第 1～9 棒</h2><div class="sub">選人的順序就是初始棒次，也可以用 ↑ ↓ 調整。</div></div><button id="recent" class="small" style="height:38px">近期打線</button></div><div id="lineup" class="lineup"></div><button id="enter" class="primary" disabled>保存打線並進入比賽</button></section>
</main>
<div id="gameWrap" class="hidden"><div class="gameTop"><button id="back">← 名單</button><span id="playingTeam"></span><button id="reload">重載比賽</button></div><iframe id="gameFrame" class="frame" src="about:blank"></iframe></div>

const KEY='cpblGameLineupsV3';let saved=JSON.parse(localStorage.getItem(KEY)||'{}'),team=null,lineup=[],filter='';
function drawTeams(){$('teams').innerHTML=Object.entries(T).map(([k,t])=>`<button class="team ${team===k?'active':''}" data-t="${k}" style="background:linear-gradient(135deg,${t.c}cc,#173838)">${t.n}<span>${t.r.length} 位可選球員</span></button>`).join('');q('[data-t]').forEach(b=>b.onclick=()=>chooseTeam(b.dataset.t))}
function chooseTeam(k){team=k;filter='';$('search').value='';const old=saved[k];lineup=Array.isArray(old)?old.filter(n=>T[k].r.includes(n)).slice(0,9):[];$('poolCard').classList.remove('hidden');$('orderCard').classList.remove('hidden');$('poolName').textContent=T[k].n+'・'+T[k].r.length+' 位現役註冊球員';drawTeams();drawRoster();drawLineup()}

function toggle(n){const i=lineup.indexOf(n);if(i>=0)lineup.splice(i,1);else if(lineup.length<9)lineup.push(n);drawRoster();drawLineup()}
function drawLineup(){$('count').textContent=lineup.length+' / 9';$('enter').disabled=lineup.length!==9;$('lineup').innerHTML=lineup.length?lineup.map((n,i)=>`<div class="slot"><div class="no">${i+1}</div><div><strong>${n}</strong><div class="sub">第 ${i+1} 棒</div></div><div class="actions"><button data-u="${i}" ${i===0?'disabled':''}>↑</button><button data-d="${i}" ${i===lineup.length-1?'disabled':''}>↓</button><button class="del" data-x="${i}">×</button></div></div>`).join(''):'<div class="sub">先從上方球員池挑選 9 人。</div>';q('[data-u]').forEach(b=>b.onclick=()=>move(+b.dataset.u,-1));q('[data-d]').forEach(b=>b.onclick=()=>move(+b.dataset.d,1));q('[data-x]').forEach(b=>b.onclick=()=>{lineup.splice(+b.dataset.x,1);drawRoster();drawLineup()})}
function move(i,d){const j=i+d;if(j<0||j>=lineup.length)return;[lineup[i],lineup[j]]=[lineup[j],lineup[i]];drawLineup()}
