async function loadLocalJson(){const r=await fetch('data/cpbl_batting_2026.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('local '+r.status);const j=await r.json();if(!j.players||Object.keys(j.players).length<20)throw Error('local empty');batStats=j.players;sourceLabel='中職官方全記錄';return Object.keys(batStats).length}
function parseCsv(text){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i],next=text[i+1];if(c==='"'){if(quote&&next==='"'){cell+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&next==='\n')i++;row.push(cell);cell='';if(row.some(v=>v!==''))rows.push(row);row=[]}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
async function loadFallbackCsv(){const url='https://raw.githubusercontent.com/Lily09-project/CPBL-baseball/main/data/processed/batters_scored.csv';const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('fallback '+r.status);const rows=parseCsv(await r.text());const h=rows.shift().map(x=>x.replace(/^\uFEFF/,'')),ix=Object.fromEntries(h.map((x,i)=>[x,i])),tmp={};for(const a of rows){if(a[ix.season]!=='2026')continue;const teamName=a[ix.team],name=a[ix.player_name];if(!teamName||!name)continue;const avg=n(a[ix.batting_average]),obp=n(a[ix.obp]),slg=n(a[ix.slg]);tmp[teamName+'|'+name]={AVG:avg,OBP:obp,SLG:slg,OPS:n(a[ix.ops])??(obp!=null&&slg!=null?obp+slg:null),PA:n(a[ix.pa]),H:n(a[ix.hits]),HR:n(a[ix.home_runs]),OPSplus:null}}if(Object.keys(tmp).length<20)throw Error('fallback parsed '+Object.keys(tmp).length);batStats=tmp;sourceLabel='CPBL 官方資料備援快照（2026/9/18）';return Object.keys(tmp).length}
async function loadStats(){setStatus('正在抓取 2026 一軍打者數據…');let count=0;try{count=await loadAdvancedApi();setStatus(`${sourceLabel}・${count} 名有打擊資料的球員`)}catch(e1){try{count=await loadLocalJson();setStatus(`${sourceLabel}・${count} 名有打擊資料的球員`)}catch(e2){try{count=await loadFallbackCsv();setStatus(`${sourceLabel}・${count} 名有打擊資料的球員`)}catch(e3){batStats={};setStatus('打擊數據暫時無法讀取；球員名單仍可正常選擇。');console.warn(e1,e2,e3)}}}if(team)drawRoster()}
$('search').oninput=e=>{filter=e.target.value.trim();drawRoster()};$('clear').onclick=()=>{lineup=[];drawRoster();drawLineup()};$('recent').onclick=()=>{lineup=T[team].d.slice();drawRoster();drawLineup()};$('sort').onchange=e=>{sortBy=e.target.value;setStatus(sourceLabel?`${sourceLabel}・${Object.keys(batStats).length} 名有打擊資料的球員`:'正在讀取打擊數據…');drawRoster()};$('refreshStats').onclick=loadStats;
$('enter').onclick=()=>{if(lineup.length!==9)return;saved[team]=lineup.slice();localStorage.setItem(KEY,JSON.stringify(saved));$('playingTeam').textContent=T[team].n+'・自訂先發';$('gameWrap').classList.remove('hidden');const f=$('gameFrame');f.src='baseball-game.html?manager=1&t='+Date.now();f.onload=()=>setTimeout(()=>{try{const d=f.contentDocument,btn=d.querySelector(`[data-team="${team}"]`);if(btn)btn.click()}catch(e){}},300)};
$('back').onclick=()=>{$('gameWrap').classList.add('hidden');$('gameFrame').src='about:blank'};$('reload').onclick=()=>{$('gameFrame').src='baseball-game.html?manager=1&t='+Date.now()};
drawTeams();loadStats();
})();
