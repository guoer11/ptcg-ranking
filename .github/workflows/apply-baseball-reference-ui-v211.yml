name: Apply baseball reference UI v211
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - run: python .github/scripts/apply_baseball_reference_ui_v211.py
      - run: git diff --check
      - run: |
          if git diff --quiet -- baseball-game.html; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add baseball-game.html
          git commit -m "feat: enable reference-style baseball game view"
          git push origin main
