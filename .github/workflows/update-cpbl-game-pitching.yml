name: Update CPBL game pitching stats

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_cpbl_pitching.py'
      - '.github/workflows/update-cpbl-game-pitching.yml'
  schedule:
    - cron: '35 16 * * *'

permissions:
  contents: write

env:
  TZ: Asia/Taipei

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Fetch CPBL pitching stats
        run: python scripts/update_cpbl_pitching.py
      - name: Commit data when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cpbl_pitching_2026.json
          if git diff --cached --quiet; then
            echo 'No pitching changes'
            exit 0
          fi
          git commit -m 'Update CPBL pitching stats'
          git push
