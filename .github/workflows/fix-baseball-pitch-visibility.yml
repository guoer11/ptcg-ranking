name: Fix baseball pitch visibility

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_pitch_visibility.py
      - .github/workflows/fix-baseball-pitch-visibility.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Patch pitch visibility
        run: python scripts/fix_pitch_visibility.py
      - name: Commit patched game
        run: |
          if git diff --quiet -- baseball-game.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball-game.html
          git commit -m "Fix pitch visibility and pitcher distance"
          git push
