name: Smoke test baseball 3D renderer
on:
  workflow_dispatch:
  push:
    paths:
      - 'baseball-3d.js'
      - 'baseball-3d.css'
      - 'baseball-game.html'
      - '.github/workflows/baseball-3d-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 3D script syntax
        run: node --check baseball-3d.js
      - name: Install headless browser controller
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.58.2
      - name: Start local site
        run: |
          python3 -m http.server 8999 --bind 127.0.0.1 >/tmp/baseball-http.log 2>&1 &
      - name: Render and verify the actual game in Chrome
        run: |
          node <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({
              executablePath:'/usr/bin/google-chrome',
              headless:true,
              args:['--no-sandbox','--enable-webgl','--enable-unsafe-swiftshader',
                    '--use-angle=swiftshader','--disable-dev-shm-usage']
            });
            const page=await browser.newPage({viewport:{width:1108,height:512},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push('JS: '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            await page.goto('http://127.0.0.1:8999/baseball-game.html',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>{
              document.getElementById('setupApp').classList.add('hidden');
              const game=document.getElementById('gameApp');
              game.classList.remove('hidden');
              game.classList.add('v202-mode-bat','v202-cinematic-game');
              document.getElementById('scene').classList.add('v202-cinematic-bat');
            });
            try {
              await page.waitForFunction(()=>document.getElementById('gameApp')
                .classList.contains('baseball-3d-ready'),null,{timeout:55000});
              const value=await page.evaluate(()=>{
                const canvas=document.querySelector('.baseball-3d-canvas');
                return {canvas:!!canvas,
                  width:canvas?.width,height:canvas?.height,
                  webgl:!!canvas?.getContext('webgl2')};
              });
              if(!value.canvas||value.width<200||value.height<100)throw Error('Invalid canvas: '+JSON.stringify(value));
              await page.screenshot({path:'baseball-3d-smoke.png'});
              await page.evaluate(()=>{
                const game=document.getElementById('gameApp');
                const scene=document.getElementById('scene');
                game.classList.remove('v202-mode-bat');
                // Reproduce the reported bug: pitching half without cinematic camera.
                game.classList.remove('v202-mode-bat','v202-mode-pitch');
                game.classList.add('pitch-ui-top');
                scene.classList.remove('v202-cinematic-bat','v202-cinematic-pitch');
                scene.classList.add('user-pitching');
                const pitchButton=document.getElementById('userPitchBtn');
                pitchButton.classList.remove('hidden');
                pitchButton.disabled=false;
                window.__pitchClickCount=0;
                pitchButton.addEventListener('click',()=>window.__pitchClickCount++);
                const panel=document.getElementById('pitchModePanel');
                scene.appendChild(panel);
                panel.classList.remove('hidden');
                document.getElementById('pitchTypeButtons').innerHTML=
                  '<button class="pitch-type active">四縫線</button><button class="pitch-type">滑球</button><button class="pitch-type">指叉球</button>';
                document.getElementById('message').innerHTML=
                  '<strong>右外野飛球接殺</strong><span>上一打席結果測試</span>';
              });
              await page.waitForTimeout(650);
              await page.screenshot({path:'baseball-3d-pitch.png'});
              const pitchView=await page.evaluate(()=>{
                const panel=document.getElementById('pitchModePanel');
                const msg=document.getElementById('message');
                return {panel:panel.getBoundingClientRect().toJSON(),
                  result:msg.getBoundingClientRect().toJSON(),
                  ready:document.getElementById('gameApp').classList.contains('baseball-3d-ready')};
              });
              if(!pitchView.ready)throw Error('Pitching WebGL mode failed');
              const action=await page.evaluate(()=>{
                const btn=document.getElementById('userPitchBtn');
                const rect=btn.getBoundingClientRect();
                const style=getComputedStyle(btn);
                const x=rect.left+rect.width/2,y=rect.top+rect.height/2;
                const hit=document.elementFromPoint(x,y);
                return {x,y,w:rect.width,h:rect.height,display:style.display,
                  disabled:btn.disabled,hit:hit?.id||hit?.className,
                  within:x>=0&&x<innerWidth&&y>=0&&y<innerHeight};
              });
              if(action.display==='none'||action.w<70||action.h<70
                  ||action.hit!=='userPitchBtn'||!action.within)
                  throw Error('Landscape pitch button not tappable: '+JSON.stringify(action));
              await page.mouse.click(action.x,action.y);
              const clickCount=await page.evaluate(()=>window.__pitchClickCount);
              if(clickCount!==1)throw Error('Pitch action click did not fire: '+clickCount);
              await page.setViewportSize({width:844,height:390});
              await page.waitForTimeout(250);
              const small=await page.evaluate(()=>{
                const btn=document.getElementById('userPitchBtn');
                const r=btn.getBoundingClientRect();
                const el=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
                return {hit:el?.id,x:r.x,y:r.y,right:r.right,bottom:r.bottom,
                  width:innerWidth,height:innerHeight};
              });
              if(small.hit!=='userPitchBtn'||small.right>small.width||small.bottom>small.height)
                throw Error('iPhone landscape pitch button is blocked: '+JSON.stringify(small));
              await page.screenshot({path:'baseball-3d-iphone-pitch.png'});
              console.log('PITCH ACTION PASS',JSON.stringify({action,clickCount,small}));
              console.log('3D PITCH VIEW PASS',JSON.stringify(pitchView));
              console.log('3D SMOKE PASS',JSON.stringify(value));
              if(errors.length)console.log('Browser errors:',errors.join(' | ').slice(0,1500));
            } catch(e){
              await page.screenshot({path:'baseball-3d-smoke.png'}).catch(()=>{});
              console.log('Browser errors:',errors.join(' | ').slice(0,3000));
              throw e;
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseball-3d-smoke-screenshot
          path: |
            baseball-3d-smoke.png
            baseball-3d-pitch.png
            baseball-3d-iphone-pitch.png
          if-no-files-found: ignore
