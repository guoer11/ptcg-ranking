name: Smoke test baseball 3D renderer
on:
  workflow_dispatch:
  push:
    paths:
      - 'baseball-3d.js'
      - 'baseball-3d.css'
      - 'baseball-game.html'
      - '.github/workflows/baseball-3d-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 3D script syntax
        run: node --check baseball-3d.js
      - name: Install headless browser controller
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.58.2
      - name: Start local site
        run: |
          python3 -m http.server 8999 --bind 127.0.0.1 >/tmp/baseball-http.log 2>&1 &
      - name: Render and verify the actual game in Chrome
        run: |
          node <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({
              executablePath:'/usr/bin/google-chrome',
              headless:true,
              args:['--no-sandbox','--enable-webgl','--enable-unsafe-swiftshader',
                    '--use-angle=swiftshader','--disable-dev-shm-usage']
            });
            const page=await browser.newPage({viewport:{width:1108,height:512},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',e=>errors.push('JS: '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            // Expose only two existing game-closure functions to test through
            // a local HTML response rewrite. Never modify production source.
            await page.route('**/baseball-game.html',async route=>{
              const response=await route.fetch();
              let body=await response.text();
              body=body.replace('function setHalfMode(mode){',
                'window.__qaSetHalfMode=mode=>setHalfMode(mode);function setHalfMode(mode){');
              body=body.replace('function v144BeginHalfBreak(onFinish){',
                'window.__qaBeginHalfBreak=cb=>v144BeginHalfBreak(cb);function v144BeginHalfBreak(onFinish){');
              body=body.replace('v306InstallMeter();', 'window.__qa306={grade:v306SwingGrade,feedback:v306SwingFeedback,meter:v306MeterValue,accuracy:v306PitchAccuracy};v306InstallMeter();');
              body=body.replace('v306InstallMeter();', `window.__qa307={
                start(){const saved={playing,halfMode,lineup,batIndex,bases,finishPA};playing=true;halfMode='bat';lineup=[{name:'QA打者',teamKey:'brothers'}];batIndex=0;bases=[null,null,null];window.__qa307Done=[];finishPA=(...args)=>window.__qa307Done.push(args);window.__qa307.restore=()=>{playing=saved.playing;halfMode=saved.halfMode;lineup=saved.lineup;batIndex=saved.batIndex;bases=saved.bases;finishPA=saved.finishPA};showHitThen('HR','全壘打',{distance:420,fence:400,exit:108,launch:30,spray:15,targetX:60,targetY:20,hang:4});},
                pause(value){setGamePaused(value)}
              };v306InstallMeter();`);
              await route.fulfill({response,body});
            });
            await page.goto('http://127.0.0.1:8999/baseball-game.html',{waitUntil:'domcontentloaded'});
            await page.evaluate(()=>{
              document.getElementById('setupApp').classList.add('hidden');
              const game=document.getElementById('gameApp');
              game.classList.remove('hidden');
              game.classList.add('v202-mode-bat','v202-cinematic-game');
              document.getElementById('scene').classList.add('v202-cinematic-bat');
            });
            try {
              await page.waitForFunction(()=>document.getElementById('gameApp')
                .classList.contains('baseball-3d-ready'),null,{timeout:55000});
              const value=await page.evaluate(()=>{
                const canvas=document.querySelector('.baseball-3d-canvas');
                return {canvas:!!canvas,
                  width:canvas?.width,height:canvas?.height,
                  webgl:!!canvas?.getContext('webgl2')};
              });
              if(!value.canvas||value.width<200||value.height<100)throw Error('Invalid canvas: '+JSON.stringify(value));
              const gameplay306=await page.evaluate(()=>{
                const q=window.__qa306;
                if(!q)throw Error('Missing v306 test hooks');
                const grades=[q.grade(.89,.1).kind,q.grade(.83,.2).kind,q.grade(.75,.2).label,q.grade(.98,.2).label,q.grade(.89,.9).label];
                q.feedback(.89,.1);
                return {grades,feedback:document.getElementById('v306Feedback')?.textContent,meter:!!document.getElementById('v306PrecisionToggle'),defaultAccuracy:q.accuracy()};
              });
              if(JSON.stringify(gameplay306.grades)!==JSON.stringify(['perfect','good','稍早','稍晚','準星偏離'])||!gameplay306.feedback?.includes('PERFECT')||!gameplay306.meter||gameplay306.defaultAccuracy!==1)
                throw Error('v306 feedback failed '+JSON.stringify(gameplay306));
              console.log('V306 GAMEPLAY PASS',JSON.stringify(gameplay306));
              await page.evaluate(()=>document.getElementById('v306Feedback').classList.add('hidden'));
              await page.screenshot({path:'baseball-3d-smoke.png'});
              // Real HR presentation; stub only the final scoring callback.
              await page.evaluate(()=>window.__qa307.start());
              await page.waitForFunction(()=>document.getElementById('scene').classList.contains('v307-hr-tracking'),null,{timeout:12000});
              const hr=await page.evaluate(()=>{
                const cam=document.getElementById('hitCam'),card=document.getElementById('v307HrCard');
                const a=document.getElementById('flyball').getAnimations()[0];
                return {distance:cam.dataset.hrDistance,duration:a.effect.getTiming().duration,
                  text:card.textContent,visible:getComputedStyle(card).display!=='none'&&getComputedStyle(card).opacity==='1',
                  done:window.__qa307Done.length};
              });
              if(hr.distance!=='420'||hr.duration!==2900||!hr.visible||!hr.text.includes('128.0 m')||hr.done!==0)
                throw Error('V307 HR presentation failed '+JSON.stringify(hr));
              await page.evaluate(()=>window.__qa307.pause(true));
              // Web Animations pause is asynchronous: wait for its pending task to settle.
              const time1=await page.evaluate(async()=>{
                const a=document.getElementById('flyball').getAnimations()[0];
                await a.ready;
                if(a.playState!=='paused'||a.pending)throw Error('V307 animation not paused: '+a.playState);
                return a.currentTime;
              });
              await page.waitForTimeout(350);
              const time2=await page.evaluate(()=>document.getElementById('flyball').getAnimations()[0].currentTime);
              if(Math.abs(time2-time1)>2)throw Error('V307 pause did not freeze ball: '+time1+' -> '+time2);
              await page.evaluate(()=>window.__qa307.pause(false));
              await page.waitForTimeout(650);
              await page.screenshot({path:'baseball-3d-home-run.png'});
              await page.waitForFunction(()=>window.__qa307Done.length===1&&!document.getElementById('scene').classList.contains('v307-hr-tracking'),null,{timeout:12000});
              const hrEnd=await page.evaluate(()=>({done:window.__qa307Done,hidden:document.getElementById('v307HrCard').classList.contains('hidden'),data:document.getElementById('hitCam').dataset.hrDistance||null}));
              if(!hrEnd.hidden||hrEnd.data||hrEnd.done[0][0]!=='HR')throw Error('V307 HR finish failed '+JSON.stringify(hrEnd));
              await page.evaluate(()=>window.__qa307.restore());
              console.log('V307 HOME RUN PASS',JSON.stringify({hr,hrEnd,pauseDrift:time2-time1}));
              await page.evaluate(()=>{
                const game=document.getElementById('gameApp');
                const scene=document.getElementById('scene');
                game.classList.remove('v202-mode-bat');
                // Reproduce the reported bug: pitching half without cinematic camera.
                game.classList.remove('v202-mode-bat','v202-mode-pitch');
                game.classList.add('pitch-ui-top');
                scene.classList.remove('v202-cinematic-bat','v202-cinematic-pitch');
                scene.classList.add('user-pitching');
                const pitchButton=document.getElementById('userPitchBtn');
                pitchButton.classList.remove('hidden');
                pitchButton.disabled=false;
                window.__pitchClickCount=0;
                pitchButton.addEventListener('click',()=>window.__pitchClickCount++);
                const panel=document.getElementById('pitchModePanel');
                scene.appendChild(panel);
                panel.classList.remove('hidden');
                document.getElementById('pitchTypeButtons').innerHTML=
                  '<button class="pitch-type active" data-qa-pitch="ff"><span>四縫線</span><b class="pitch-grade">C</b></button>'+
                  '<button class="pitch-type" data-qa-pitch="ch"><span>變速球</span><b class="pitch-grade">D</b></button>'+
                  '<button class="pitch-type" data-qa-pitch="ct"><span>卡特球</span><b class="pitch-grade">B</b></button>'+
                  '<button class="pitch-type" data-qa-pitch="si"><span>二縫線 / 伸卡</span><b class="pitch-grade">D</b></button>'+
                  '<button class="pitch-type" data-qa-pitch="sl"><span>滑球</span><b class="pitch-grade">C</b></button>';
                document.getElementById('pitchDefenseActions').innerHTML=
                  '<button class="pitch-mini-action">牽制一壘</button>';
                document.getElementById('message').innerHTML=
                  '<strong>右外野飛球接殺</strong><span>上一打席結果測試</span>';
              });
              await page.waitForTimeout(650);
              await page.screenshot({path:'baseball-3d-pitch.png'});
              const pitchView=await page.evaluate(()=>{
                const panel=document.getElementById('pitchModePanel');
                const msg=document.getElementById('message');
                return {panel:panel.getBoundingClientRect().toJSON(),
                  result:msg.getBoundingClientRect().toJSON(),
                  ready:document.getElementById('gameApp').classList.contains('baseball-3d-ready')};
              });
              if(!pitchView.ready)throw Error('Pitching WebGL mode failed');
              async function checkSelectorPosition(){
                return await page.evaluate(()=>{
                  const selector=document.getElementById('pitchModePanel');
                  const pitchBtns=[...selector.querySelectorAll('.pitch-type')];
                  const chart=selector.querySelector('.pitch-chart-btn');
                  const box=selector.getBoundingClientRect();
                  const result=document.getElementById('message').getBoundingClientRect();
                  const zone=document.getElementById('zone').getBoundingClientRect();
                  const action=document.getElementById('userPitchBtn').getBoundingClientRect();
                  const hit=el=>{
                    const r=el.getBoundingClientRect();
                    return document.elementFromPoint(r.x+r.width/2,r.y+r.height/2);
                  };
                  return {
                    view:{w:innerWidth,h:innerHeight},panel:box.toJSON(),
                    pitchCount:pitchBtns.length,
                    allPitchesTap:pitchBtns.every(b=>b.contains(hit(b))),
                    chartTap:chart.contains(hit(chart)),
                    nonOverlapResult:box.top>result.bottom,
                    nonOverlapZone:box.right<zone.left||box.left>zone.right||box.bottom<zone.top||box.top>zone.bottom,
                    nonOverlapAction:box.right<action.left,
                    leftBottom:box.left<30&&box.bottom>=innerHeight-35,
                    compact:box.width<=310&&box.width<innerWidth*.48
                  };
                });
              }
              const selectorLarge=await checkSelectorPosition();
              if(!selectorLarge.allPitchesTap||!selectorLarge.chartTap||
                !selectorLarge.nonOverlapResult||!selectorLarge.nonOverlapZone||
                !selectorLarge.nonOverlapAction||!selectorLarge.leftBottom||
                !selectorLarge.compact||selectorLarge.pitchCount!==5)
                throw Error('Compact landscape pitch panel failed: '+JSON.stringify(selectorLarge));
              console.log('COMPACT PITCH PANEL',JSON.stringify(selectorLarge));
              const action=await page.evaluate(()=>{
                const btn=document.getElementById('userPitchBtn');
                const rect=btn.getBoundingClientRect();
                const style=getComputedStyle(btn);
                const x=rect.left+rect.width/2,y=rect.top+rect.height/2;
                const hit=document.elementFromPoint(x,y);
                return {x,y,w:rect.width,h:rect.height,display:style.display,
                  disabled:btn.disabled,hit:hit?.id||hit?.className,
                  within:x>=0&&x<innerWidth&&y>=0&&y<innerHeight};
              });
              if(action.display==='none'||action.w<70||action.h<70
                  ||action.hit!=='userPitchBtn'||!action.within)
                  throw Error('Landscape pitch button not tappable: '+JSON.stringify(action));
              await page.mouse.click(action.x,action.y);
              const clickCount=await page.evaluate(()=>window.__pitchClickCount);
              if(clickCount!==1)throw Error('Pitch action click did not fire: '+clickCount);
              await page.setViewportSize({width:844,height:390});
              await page.waitForTimeout(250);
              const small=await page.evaluate(()=>{
                const btn=document.getElementById('userPitchBtn');
                const r=btn.getBoundingClientRect();
                const el=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
                return {hit:el?.id,x:r.x,y:r.y,right:r.right,bottom:r.bottom,
                  width:innerWidth,height:innerHeight};
              });
              if(small.hit!=='userPitchBtn'||small.right>small.width||small.bottom>small.height)
                throw Error('iPhone landscape pitch button is blocked: '+JSON.stringify(small));
              const selectorSmall=await checkSelectorPosition();
              if(!selectorSmall.allPitchesTap||!selectorSmall.chartTap||
                !selectorSmall.nonOverlapResult||!selectorSmall.nonOverlapZone||
                !selectorSmall.nonOverlapAction||!selectorSmall.leftBottom||
                !selectorSmall.compact)
                throw Error('iPhone selector failed: '+JSON.stringify(selectorSmall));
              await page.screenshot({path:'baseball-3d-iphone-pitch.png'});
              console.log('COMPACT IPHONE PITCH PANEL',JSON.stringify(selectorSmall));
              console.log('PITCH ACTION PASS',JSON.stringify({action,clickCount,small}));

              // Switch to the actual non-cinematic 3D batting half: button must
              // remain in view even with no v202-mode-bat camera class.
              await page.evaluate(()=>{
                const game=document.getElementById('gameApp');
                const scene=document.getElementById('scene');
                game.classList.remove('pitch-ui-top','v202-mode-pitch','v202-mode-bat');
                scene.classList.remove('user-pitching','v202-cinematic-pitch');
                const swing=document.getElementById('swingBtn');
                swing.classList.remove('hidden');
                swing.disabled=false;
                swing.textContent='揮棒！';
                document.getElementById('userPitchBtn').classList.add('hidden');
                document.getElementById('pitchModePanel').classList.add('hidden');
                window.__swingClickCount=0;
                swing.addEventListener('click',()=>window.__swingClickCount++);
              });
              await page.waitForTimeout(250);
              const batting=await page.evaluate(()=>{
                const btn=document.getElementById('swingBtn');
                const rect=btn.getBoundingClientRect();
                const style=getComputedStyle(btn);
                const px=rect.x+rect.width/2,py=rect.y+rect.height/2;
                return {
                  x:px,y:py,width:rect.width,height:rect.height,
                  display:style.display,visible:style.visibility,
                  coveredBy:document.elementFromPoint(px,py)?.id,
                  disabled:btn.disabled,hidden:btn.classList.contains('hidden'),
                  inView:px>0&&px<innerWidth&&py>0&&py<innerHeight,
                  pitchButtonHidden:document.getElementById('userPitchBtn').classList.contains('hidden')
                };
              });
              if(batting.display==='none'||batting.hidden||batting.disabled||
                 batting.visible!=='visible'||batting.width<70||batting.height<70||
                 batting.coveredBy!=='swingBtn'||!batting.inView||!batting.pitchButtonHidden)
                throw Error('iPhone landscape swing button not tappable: '+JSON.stringify(batting));
              await page.screenshot({path:'baseball-3d-iphone-batting.png'});
              await page.mouse.click(batting.x,batting.y);
              const swingClicks=await page.evaluate(()=>window.__swingClickCount);
              if(swingClicks!==1)throw Error('Swing button click not delivered: '+swingClicks);
              console.log('BAT ACTION PASS',JSON.stringify({batting,swingClicks}));
              // Reproduce the reported screenshot: cinematic 3D batting view
              // while the 5-second half-inning transition has disabled actions.
              await page.evaluate(()=>{
                const game=document.getElementById('gameApp');
                game.classList.add('v202-cinematic-game','v202-mode-bat');
                const sw=document.getElementById('swingBtn');
                sw.disabled=true;
                document.getElementById('v144HalfBreakChip')?.classList.remove('hidden');
              });
              const breakState=await page.evaluate(()=>{
                const btn=document.getElementById('swingBtn');
                const r=btn.getBoundingClientRect();
                const cs=getComputedStyle(btn);
                const mid=document.elementFromPoint(r.x+r.width/2,r.y+r.height/2);
                const footer=document.querySelector('#gameApp > .controls');
                const fc=getComputedStyle(footer);
                return {parent:btn.parentElement?.className,hidden:btn.classList.contains('hidden'),
                  rect:r.toJSON(),display:cs.display,opacity:cs.opacity,
                  visibility:cs.visibility,position:cs.position,z:cs.zIndex,
                  hit:mid?.id||mid?.className,
                  footer:{position:fc.position,z:fc.zIndex,display:fc.display},
                  game:document.getElementById('gameApp').className};
              });
              await page.screenshot({path:'baseball-3d-half-break.png'});
              console.log('BAT HALF BREAK DIAGNOSTIC',JSON.stringify(breakState));
              // Drive the *real* setHalfMode and half-break code, not synthetic
              // class removals (the v303 test had incorrectly removed hidden).
              await page.evaluate(()=>{
                const game=document.getElementById('gameApp');
                game.classList.add('v202-cinematic-game','v202-mode-bat');
                window.__qaSetHalfMode('bat');
                window.__qaBeginHalfBreak(()=>{});
                // The old bug could leave "hidden" on an otherwise batting button.
                // Check the CSS failsafe in exactly that case as well.
                document.getElementById('swingBtn').classList.add('hidden');
              });
              await page.waitForTimeout(450);
              const liveBreak=await page.evaluate(()=>{
                const game=document.getElementById('gameApp');
                const btn=document.getElementById('swingBtn');
                const r=btn.getBoundingClientRect(),st=getComputedStyle(btn);
                const x=r.left+r.width/2,y=r.top+r.height/2;
                return {display:st.display,visibility:st.visibility,opacity:+st.opacity,
                  disabled:btn.disabled,hidden:btn.classList.contains('hidden'),
                  match:game.matches('#gameApp:not(.pitch-ui-top)'),
                  hit:document.elementFromPoint(x,y)?.id,
                  rect:r.toJSON(),viewport:[innerWidth,innerHeight],
                  chip:document.getElementById('v144HalfBreakChip')?.textContent};
              });
              console.log('REAL BAT HALF BREAK',JSON.stringify(liveBreak));
              if(!liveBreak.match||!liveBreak.disabled||
                 liveBreak.display==='none'||liveBreak.visibility!=='visible'||
                 liveBreak.opacity<.6||liveBreak.hit!=='swingBtn'||
                 liveBreak.rect.width<80||liveBreak.rect.right>liveBreak.viewport[0])
                throw Error('Actual batting half-break control missing: '+JSON.stringify(liveBreak));
              await page.screenshot({path:'baseball-3d-real-half-break.png'});
              // Then confirm it becomes active after the transition.
              await page.evaluate(()=>{
                const chip=document.getElementById('v144HalfBreakChip');
                chip?.classList.add('hidden');
                const btn=document.getElementById('swingBtn');
                btn.classList.remove('hidden');
                btn.disabled=false;
              });
              await page.waitForTimeout(80);
              const active=await page.evaluate(()=>{
                const b=document.getElementById('swingBtn'),r=b.getBoundingClientRect();
                const x=r.x+r.width/2,y=r.y+r.height/2;
                return {disabled:b.disabled,hit:document.elementFromPoint(x,y)?.id,
                  display:getComputedStyle(b).display,x,y};
              });
              if(active.disabled||active.hit!=='swingBtn'||active.display==='none')
                throw Error('Batting control did not resume after break: '+JSON.stringify(active));
              console.log('BAT AFTER BREAK PASS',JSON.stringify(active));
              if(breakState.display==='none'||breakState.rect.width<70||breakState.opacity==='0')
                throw Error('Half-break cinematic swing button hidden: '+JSON.stringify(breakState));

              console.log('3D PITCH VIEW PASS',JSON.stringify(pitchView));
              console.log('3D SMOKE PASS',JSON.stringify(value));
              if(errors.length)console.log('Browser errors:',errors.join(' | ').slice(0,1500));
            } catch(e){
              await page.screenshot({path:'baseball-3d-smoke.png'}).catch(()=>{});
              console.log('Browser errors:',errors.join(' | ').slice(0,3000));
              throw e;
            } finally {await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseball-3d-smoke-screenshot
          path: |
            baseball-3d-smoke.png
            baseball-3d-pitch.png
            baseball-3d-iphone-pitch.png
            baseball-3d-iphone-batting.png
            baseball-3d-half-break.png
            baseball-3d-real-half-break.png
            baseball-3d-home-run.png
          if-no-files-found: ignore
