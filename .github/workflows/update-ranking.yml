name: Update PTCG ranking

on:
  workflow_dispatch:
  schedule:
    # Supabase Cron 於台灣時間 00:05 主動觸發 workflow_dispatch。
    # GitHub schedule 僅作台灣時間 00:15 備援；cron 使用 UTC。
    - cron: "15 16 * * *"
  push:
    branches:
      - main
    paths:
      - "scraper.py"
      - "update_log.py"
      - "ensure_ranking_update_log.py"
      - "requirements.txt"
      - ".github/workflows/update-ranking.yml"

permissions:
  contents: write

concurrency:
  group: update-ptcg-ranking
  # 連續修改來源/抓取程式時，只保留最新一次；避免舊任務拿過期 main 寫回造成衝突。
  cancel-in-progress: true

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 排行榜例行更新只抓 Pokémon Asia 官網。
      # Ivan／歷史姓名等資料不在每日排行更新時重新抓取。
      # 玩家實績徽章由賽事更新 workflow 建立，避免兩個 workflow 同時修改同一資料檔。
      - name: Fetch official ranking
        env:
          POKEMON_EMAIL: ${{ secrets.POKEMON_EMAIL }}
          POKEMON_PASSWORD: ${{ secrets.POKEMON_PASSWORD }}
        run: python scraper.py

      - name: Build ranking update log
        run: |
          python update_log.py ranking
          python ensure_ranking_update_log.py

      - name: Commit data changes
        id: commit
        run: |
          # 僅提交排行榜專屬檔案，避免與賽事流程同時寫入 player_badges.json 衝突。
          git add data/ranking.json data/ranking_history.json data/update_log_ranking.json
          if [ -d data/seasons ]; then git add data/seasons; fi
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "ranking_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --cached --quiet -- data/ranking_history.json; then
            ranking_changed=false
          else
            ranking_changed=true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update official ranking data"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "ranking_changed=$ranking_changed" >> "$GITHUB_OUTPUT"

      - name: Notify immediately after effective ranking changes
        if: steps.commit.outputs.ranking_changed == 'true'
        run: |
          # 只有排名／積分／玩家進出榜等有效排名變動才立即通知。
          sleep 3
          curl --fail-with-body --silent --show-error \
            -X POST "https://ceobnyikrudlxasyjukg.supabase.co/functions/v1/ptcg-line" \
            -H "Content-Type: application/json" \
            -d '{"action":"poll"}'
          echo
          curl --fail-with-body --silent --show-error \
            -X POST "https://ceobnyikrudlxasyjukg.supabase.co/functions/v1/ptcg-push" \
            -H "Content-Type: application/json" \
            -d '{"action":"poll"}'
          echo
