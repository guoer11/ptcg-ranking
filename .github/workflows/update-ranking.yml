name: Update PTCG ranking

on:
  workflow_dispatch:
  schedule:
    # Supabase Cron 於台灣時間 00:05 主動觸發 workflow_dispatch。
    # GitHub schedule 僅作台灣時間 00:15 備援；cron 使用 UTC。
    - cron: "15 16 * * *"
  push:
    branches:
      - main
    paths:
      - "scraper.py"
      - "scrape_identity.py"
      - "scrape_identity_preflight.py"
      - "sync_identity_supabase.py"
      - "encrypt_identity.py"
      - "privacy/player_identity_public.pem"
      - "requirements.txt"
      - "data/player_identity_sources.json"
      - ".github/workflows/update-ranking.yml"

permissions:
  contents: write

concurrency:
  group: update-ptcg-ranking
  # 連續修改來源/抓取程式時，只保留最新一次；避免舊任務拿過期 main 寫回造成衝突。
  cancel-in-progress: true

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update historical player names
        run: |
          python scrape_identity.py
          python scrape_identity_preflight.py

      - name: Sync private player names to Supabase
        env:
          PLAYER_IDENTITY_PRIVATE_KEY: ${{ secrets.PLAYER_IDENTITY_PRIVATE_KEY }}
        run: python sync_identity_supabase.py

      - name: Encrypt historical player names
        run: |
          python encrypt_identity.py data/player_identity.json data/player_identity.enc.json data/player_identity.json
          if grep -q '"real_name"' data/player_identity.json; then
            echo "Plain-text identity data is still present; refusing to commit."
            exit 1
          fi

      - name: Fetch official ranking
        env:
          POKEMON_EMAIL: ${{ secrets.POKEMON_EMAIL }}
          POKEMON_PASSWORD: ${{ secrets.POKEMON_PASSWORD }}
        run: python scraper.py

      - name: Commit data changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update ranking history and encrypted player identity data"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Notify immediately after ranking data changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          # 排名更新後立即觸發 LINE 與網站 Push，不等待固定通知輪詢。
          sleep 3
          curl --fail-with-body --silent --show-error \
            -X POST "https://ceobnyikrudlxasyjukg.supabase.co/functions/v1/ptcg-line" \
            -H "Content-Type: application/json" \
            -d '{"action":"poll"}'
          echo
          curl --fail-with-body --silent --show-error \
            -X POST "https://ceobnyikrudlxasyjukg.supabase.co/functions/v1/ptcg-push" \
            -H "Content-Type: application/json" \
            -d '{"action":"poll"}'
          echo
