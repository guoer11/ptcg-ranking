name: Update CPBL game batting stats

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_cpbl_batting.py"
      - ".github/workflows/update-cpbl-game-stats.yml"
  schedule:
    - cron: "20 10 * * *"

permissions:
  contents: write

concurrency:
  group: cpbl-game-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch CPBL 2026 batting stats
        run: python scripts/update_cpbl_batting.py

      - name: Commit updated stats
        run: |
          if git diff --quiet -- data/cpbl_batting_2026.json; then
            echo "No batting stat changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cpbl_batting_2026.json
          git commit -m "Update CPBL batting stats"
          git push
