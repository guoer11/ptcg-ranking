name: Expand pitcher repertoires
on:
  push:
    paths:
      - 'scripts/expand_pitch_repertoire.py'
      - '.github/workflows/expand-pitch-repertoire.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Expand pitch repertoire
        run: python scripts/expand_pitch_repertoire.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib, subprocess, tempfile
          s=pathlib.Path('baseball-game.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          js='\n'.join(blocks)
          p=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8')
          p.write(js); p.close()
          subprocess.run(['node','--check',p.name],check=True)
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add baseball-game.html
          git diff --cached --quiet || git commit -m 'Expand pitcher pitch repertoires'
          git push
