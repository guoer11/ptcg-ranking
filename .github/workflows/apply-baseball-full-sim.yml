name: Apply baseball full simulation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_baseball_full_sim.py'
      - '.github/workflows/apply-baseball-full-sim.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply full simulation upgrade
        run: python scripts/apply_baseball_full_sim.py
      - name: Commit baseball game upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add baseball-game.html
          if git diff --cached --quiet; then
            echo 'No baseball changes'
            exit 0
          fi
          git commit -m 'Add pitchers positions physics substitutions parks and broadcast systems'
          git push
