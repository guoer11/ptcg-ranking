name: Apply WCS 2026 official icon

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-ivan-logo.yml"

permissions:
  contents: write

concurrency:
  group: apply-wcs-2026-icon
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download WCS icon
        run: curl -fsSL "https://ptcg.bcb.idv.tw/images/wcs2026icon.png" -o /tmp/wcs2026icon.png

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --quiet pillow

      - name: Apply icon refinement
        run: python apply_wcs_icon.py

      - name: Commit icon refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/q-icons/wcs2026icon.webp ranking-season-ui.js ranking-season-ui.css index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Use WCS 2026 logo for player badge"
          git pull --rebase origin main
          git push origin HEAD:main
