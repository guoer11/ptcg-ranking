name: Apply user WCS 2026 icon

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-ivan-logo.yml"

permissions:
  contents: write

concurrency:
  group: apply-wcs-2026-icon
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply user-provided WCS icon
        run: python apply_wcs_icon.py

      - name: Commit icon refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranking-season-ui.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Use user provided WCS 2026 badge"
          git pull --rebase origin main
          git push origin HEAD:main
