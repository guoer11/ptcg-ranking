name: Apply Pitch Duel v3

on:
  push:
    branches: [pitch-duel-v3-actual]
    paths:
      - 'scripts/add_pitch_duel_v3.py'
      - '.github/workflows/apply-pitch-duel-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pitch-duel-v3-actual
      - name: Apply duel patch
        run: python scripts/add_pitch_duel_v3.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('pitching-app/index.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',t)
          Path('/tmp/pitch.js').write_text(m.group(1))
          PY
          node --check /tmp/pitch.js
      - name: Commit app changes
        run: |
          git config user.name "guoer11"
          git config user.email "71049596+guoer11@users.noreply.github.com"
          git add pitching-app/index.html pitching-app/sw.js pitching-app/version.txt
          git diff --cached --quiet || git commit -m "feat: add batter duel mode to pitching app"
          git push origin HEAD:pitch-duel-v3-actual
