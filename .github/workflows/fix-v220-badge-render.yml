name: Stabilize v2.2.0 badge rendering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v220-badge-render.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch badge rendering and cache keys
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('player-badges.js')
          text = path.read_text(encoding='utf-8')

          anchor = '''  function legendHtml() {\n'''
          helper = '''  function badgeSignature(playerId, options = {}) {\n    const id = normalizeId(playerId);\n    const info = playerInfo(id);\n    const forcedAttention = options.attentionOverride;\n    const attention = typeof forcedAttention === 'boolean' ? forcedAttention : attentionSet.has(id);\n    return [\n      id,\n      info.wcs_2026 ? 1 : 0,\n      Number(info.premier?.best_rank || 0),\n      Number(info.ultra?.best_rank || 0),\n      Number(info.great?.best_rank || 0),\n      attention ? 1 : 0,\n      options.interactiveAttention ? 1 : 0,\n      wcsIconSrc ? 1 : 0\n    ].join('|');\n  }\n\n'''
          if helper not in text:
              if anchor not in text:
                  raise SystemExit('legend anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          old_ranking = '''      let badgeRow = playerCell.querySelector(':scope > .player-badge-row');\n      const existingWcs = playerCell.querySelector('.wcs-id-icon');\n      const generated = badgesHtml(id, { skipWcs: Boolean(existingWcs) });\n      if (!generated && !existingWcs) {\n        badgeRow?.remove();\n        continue;\n      }\n      if (!badgeRow) {\n        badgeRow = document.createElement('div');\n        badgeRow.className = 'player-badge-row';\n        playerCell.appendChild(badgeRow);\n      }\n      badgeRow.innerHTML = generated;\n      if (existingWcs) {\n        existingWcs.classList.add('player-badge-wcs');\n        badgeRow.prepend(existingWcs);\n      }\n'''
          new_ranking = '''      let badgeRow = playerCell.querySelector(':scope > .player-badge-row');\n      const legacyWcs = playerCell.querySelector('.player-id-line > .wcs-id-icon');\n      if (legacyWcs) legacyWcs.remove();\n      const generated = badgesHtml(id);\n      const signature = badgeSignature(id);\n      if (!generated) {\n        badgeRow?.remove();\n        continue;\n      }\n      if (!badgeRow) {\n        badgeRow = document.createElement('div');\n        badgeRow.className = 'player-badge-row';\n        playerCell.appendChild(badgeRow);\n      }\n      if (badgeRow.dataset.badgeSignature !== signature) {\n        badgeRow.innerHTML = generated;\n        badgeRow.dataset.badgeSignature = signature;\n      }\n'''
          if old_ranking in text:
              text = text.replace(old_ranking, new_ranking, 1)
          elif new_ranking not in text:
              raise SystemExit('ranking block not found')

          old_article = '''  function renderArticleBadges(article, playerId, options = {}) {\n    if (!article || !playerId) return;\n    let row = article.querySelector('.player-badge-row');\n    if (!row) {\n      row = document.createElement('div');\n      row.className = 'player-badge-row';\n      article.appendChild(row);\n    }\n    row.innerHTML = badgesHtml(playerId, options);\n    if (!row.innerHTML) row.remove();\n  }\n'''
          new_article = '''  function renderArticleBadges(article, playerId, options = {}) {\n    if (!article || !playerId) return;\n    const generated = badgesHtml(playerId, options);\n    const signature = badgeSignature(playerId, options);\n    let row = article.querySelector('.player-badge-row');\n    if (!generated) {\n      row?.remove();\n      return;\n    }\n    if (!row) {\n      row = document.createElement('div');\n      row.className = 'player-badge-row';\n      article.appendChild(row);\n    }\n    if (row.dataset.badgeSignature !== signature) {\n      row.innerHTML = generated;\n      row.dataset.badgeSignature = signature;\n    }\n  }\n'''
          if old_article in text:
              text = text.replace(old_article, new_article, 1)
          elif new_article not in text:
              raise SystemExit('article block not found')

          old_modal = '''    box.innerHTML = `<div class="player-badge-row">${infoHtml}</div>${auth ? `<button class="player-attention-modal-control${attentionSet.has(id) ? ' is-active' : ''}" type="button" data-player-attention-toggle="${esc(id)}">${attentionSet.has(id) ? '★ 已標記注意' : '☆ 標記注意'}</button>` : ''}`;\n'''
          new_modal = '''    const modalHtml = `<div class="player-badge-row">${infoHtml}</div>${auth ? `<button class="player-attention-modal-control${attentionSet.has(id) ? ' is-active' : ''}" type="button" data-player-attention-toggle="${esc(id)}">${attentionSet.has(id) ? '★ 已標記注意' : '☆ 標記注意'}</button>` : ''}`;\n    const modalSignature = `${badgeSignature(id)}|${auth ? 1 : 0}`;\n    if (box.dataset.badgeSignature !== modalSignature) {\n      box.innerHTML = modalHtml;\n      box.dataset.badgeSignature = modalSignature;\n    }\n'''
          if old_modal in text:
              text = text.replace(old_modal, new_modal, 1)
          elif new_modal not in text:
              raise SystemExit('modal block not found')

          path.write_text(text, encoding='utf-8')

          replacements = {
            'site-version.js': [
              ('player-badges.css?v=2.2.0-r1', 'player-badges.css?v=2.2.0-r2'),
              ('player-badges.js?v=2.2.0-r1', 'player-badges.js?v=2.2.0-r2'),
            ],
            'index.html': [('site-version.js?v=2.2.0-r1', 'site-version.js?v=2.2.0-r2')],
            'pairing.html': [('site-version.js?v=2.2.0-r1', 'site-version.js?v=2.2.0-r2')],
            'family-notify.html': [
              ('player-badges.css?v=2.2.0-r1', 'player-badges.css?v=2.2.0-r2'),
              ('player-badges.js?v=2.2.0-r1', 'player-badges.js?v=2.2.0-r2'),
            ],
          }
          for filename, pairs in replacements.items():
              p = Path(filename)
              value = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  value = value.replace(old, new)
              p.write_text(value, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player-badges.js site-version.js index.html pairing.html family-notify.html
          if git diff --cached --quiet; then
            echo 'Already patched.'
            exit 0
          fi
          git commit -m 'Stabilize v2.2.0 player badge rendering'
          git pull --rebase origin main
          git push origin HEAD:main
