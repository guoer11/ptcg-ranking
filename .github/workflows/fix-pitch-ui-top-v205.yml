name: Fix baseball pitch UI v205

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_pitch_ui_top_v205.py'
      - '.github/workflows/fix-pitch-ui-top-v205.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply pitch UI fix
        run: python .github/scripts/fix_pitch_ui_top_v205.py
      - name: Check JS syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('baseball-game.html').read_text(encoding='utf-8')
          start=s.rfind('<script>')+len('<script>')
          end=s.rfind('</script>')
          Path('/tmp/baseball-game.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/baseball-game.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball-game.html
          git commit -m "fix: apply top pitch selector to all pitching views" || exit 0
          git push
