name: Inspect CPBL pitch API

on:
  push:
    paths:
      - '.github/workflows/inspect-cpbl-pitch-api.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official player pitch logs
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base='https://stats.cpbl.com.tw/api/proxy/v1/players/logs'
          params={'playerType':'pitcher','acnt':'0000007053','year':'2026','kindCode':'A'}
          url=base+'?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/json','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          print('TOP_TYPE',type(data).__name__)
          print('TOP_KEYS',list(data)[:50] if isinstance(data,dict) else '')
          def walk(obj,path='root',depth=0):
              if depth>5:return
              if isinstance(obj,dict):
                  print('DICT',path,'KEYS',list(obj)[:80])
                  for k,v in list(obj.items())[:15]:
                      if isinstance(v,(dict,list)): walk(v,path+'.'+k,depth+1)
              elif isinstance(obj,list):
                  print('LIST',path,'LEN',len(obj))
                  if obj:
                      print('SAMPLE',path,json.dumps(obj[0],ensure_ascii=False)[:12000])
                      walk(obj[0],path+'[0]',depth+1)
          walk(data)
          PY
