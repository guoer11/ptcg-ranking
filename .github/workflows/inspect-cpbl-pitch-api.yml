name: Inspect CPBL pitch API

on:
  push:
    paths:
      - '.github/workflows/inspect-cpbl-pitch-api.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official pitch tracking response
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://stats.cpbl.com.tw/api/proxy/v1/leaderboards/pitch-tracking?year=2026&gameKind=A'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Content-Type':'application/json','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:
              data=json.load(r)
          lb=data.get('Data',{}).get('Leaderboard')
          print('LEADERBOARD_TYPE',type(lb).__name__)
          if isinstance(lb,dict):
              print('LEADERBOARD_KEYS',list(lb)[:50])
              for k,v in lb.items():
                  print('KEY',k,'TYPE',type(v).__name__, 'LEN',len(v) if hasattr(v,'__len__') else '')
                  if isinstance(v,list) and v:
                      print('ITEM_KEYS',list(v[0])[:100] if isinstance(v[0],dict) else type(v[0]).__name__)
                      print('ITEM',json.dumps(v[0],ensure_ascii=False)[:8000])
                  elif isinstance(v,dict):
                      print('DICT_SAMPLE',json.dumps(v,ensure_ascii=False)[:8000])
          elif isinstance(lb,list):
              print('LEN',len(lb))
              for i,item in enumerate(lb[:3]):
                  print('ITEM',i,json.dumps(item,ensure_ascii=False)[:8000])
          else:
              print('RAW',json.dumps(lb,ensure_ascii=False)[:8000])
          PY
