name: Inspect CPBL pitch API

on:
  push:
    paths:
      - '.github/workflows/inspect-cpbl-pitch-api.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Taiwan baseball wiki API
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base='https://twbsball.dils.tku.edu.tw/api.php'
          params={'action':'query','prop':'extracts','titles':'徐若熙','format':'json','formatversion':'2','explaintext':'1','redirects':'1'}
          url=base+'?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=30) as r:
                  print('STATUS',r.status,'TYPE',r.headers.get('content-type'))
                  body=r.read().decode('utf-8','replace')
                  print('BODY',body[:12000])
          except Exception as e:
              print('ERROR',type(e).__name__,str(e))
          PY
