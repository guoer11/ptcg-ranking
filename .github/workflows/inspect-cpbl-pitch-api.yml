name: Inspect CPBL pitch API

on:
  push:
    paths:
      - '.github/workflows/inspect-cpbl-pitch-api.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Install browser scraper
        run: |
          python -m pip install --disable-pip-version-check 'scrapling[ai]' >/dev/null
          python -m patchright install --with-deps chromium >/dev/null
      - name: Probe Taiwan baseball wiki through browser
        run: |
          python - <<'PY'
          from scrapling.fetchers import StealthyFetcher
          url='https://twbsball.dils.tku.edu.tw/wiki/index.php?title=%E5%BE%90%E8%8B%A5%E7%86%99'
          page=StealthyFetcher.fetch(url, headless=True, network_idle=True, timeout=60000)
          print('TITLE', page.css('title::text').get())
          content=page.css('#mw-content-text')
          text=content[0].get_all_text(separator='\n') if content else page.get_all_text(separator='\n')
          print('HAS擅長球路', '擅長球路' in text)
          idx=text.find('擅長球路')
          print('EXCERPT', text[max(0,idx-500):idx+1800] if idx>=0 else text[:5000])
          PY
