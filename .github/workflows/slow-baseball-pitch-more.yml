name: Slow baseball opponent pitches more

on:
  push:
    branches: [main]
    paths:
      - scripts/slow_baseball_pitch_more.py
      - .github/workflows/slow-baseball-pitch-more.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Slow opponent pitch travel time more
        run: python scripts/slow_baseball_pitch_more.py
      - name: Commit patched game
        run: |
          if git diff --quiet -- baseball-game.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball-game.html
          git commit -m "Slow opponent pitching further"
          git push
