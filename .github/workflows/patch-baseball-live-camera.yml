name: Patch baseball live camera

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-baseball-live-camera.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply live camera patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('baseball-game.html')
          s = path.read_text(encoding='utf-8')
          marker = '/* ===== V203 LIVE GAME CAMERA ===== */'

          css = r'''
/* ===== V203 LIVE GAME CAMERA ===== */
#gameApp.v202-cinematic-game .gamebar{height:44px;padding:3px 7px;background:linear-gradient(180deg,rgba(3,10,13,.94),rgba(5,15,18,.70));box-shadow:0 4px 18px #0005}
#gameApp.v202-cinematic-game .hud{top:50px;left:6px;max-width:42%;padding:4px 6px;background:rgba(2,10,12,.66);border-color:#ffffff20}
#gameApp.v202-cinematic-game .batterCard{top:50px;right:6px;max-width:44%;padding:5px 7px;background:rgba(2,10,12,.68);border-color:#ffffff20}
#gameApp.v202-cinematic-game .message{top:12%;width:68%}
#gameApp.v202-cinematic-game .message strong{font-size:clamp(22px,7vw,31px)}
#gameApp.v202-cinematic-game .v15-wind{top:94px;opacity:.78}

/* Low, over-the-shoulder batting camera. The dirt/grass wedges create a clear plate-to-mound depth line. */
.scene.v202-cinematic-bat:not(.user-pitching){perspective:1450px;background:linear-gradient(#64b8ed 0 29%,#c4e6f3 30%,#557f5b 31%,#183c27 100%)}
.scene.v202-cinematic-bat:not(.user-pitching) .stadium{top:14%;height:28%;left:-12%;right:-12%;filter:brightness(.94) saturate(1.05)}
.scene.v202-cinematic-bat:not(.user-pitching) .crowd{top:20%;height:18%}
.scene.v202-cinematic-bat:not(.user-pitching) .scoreboardBig{top:16%;width:20%;height:7.5%}
.scene.v202-cinematic-bat:not(.user-pitching) .outfield{top:35%;left:-13%;right:-13%;bottom:-24%;clip-path:polygon(0 0,100% 0,80% 100%,20% 100%)}
.scene.v202-cinematic-bat:not(.user-pitching) .infieldDirt{top:73%;width:min(122vw,1050px);height:min(88vw,780px);clip-path:polygon(46.5% 0,53.5% 0,94% 100%,6% 100%);filter:drop-shadow(0 6px 6px rgba(0,0,0,.24))}
.scene.v202-cinematic-bat:not(.user-pitching) .infieldGrass{top:72%;width:min(92vw,790px);height:min(73vw,650px);clip-path:polygon(48.2% 1%,51.8% 1%,78% 100%,22% 100%);background:repeating-linear-gradient(92deg,#397d49 0 42px,#347545 43px 84px)}
.scene.v202-cinematic-bat:not(.user-pitching) .mound{top:46.2%;width:54px;height:18px;transform:translate(-50%,-50%) scale(.76);box-shadow:0 5px 10px #0004}
.scene.v202-cinematic-bat:not(.user-pitching) .pitcher{top:41.7%;transform:translate(-50%,-50%) scale(.57);z-index:16}
.scene.v202-cinematic-bat:not(.user-pitching) .zone{bottom:8%;width:110px;height:138px;border-color:rgba(255,255,255,.68);background:rgba(255,255,255,.012);box-shadow:0 0 22px #0002}
.scene.v202-cinematic-bat:not(.user-pitching) .batter{--bscale:1.32;right:-8%;bottom:-7%;z-index:22;filter:drop-shadow(0 10px 7px rgba(0,0,0,.42))}
.scene.v202-cinematic-bat:not(.user-pitching) .bat{right:-2%;bottom:18%;height:176px;z-index:23}
.scene.v202-cinematic-bat.bat-left:not(.user-pitching) .batter{right:auto;left:-8%;transform-origin:0 100%}
.scene.v202-cinematic-bat.bat-left:not(.user-pitching) .bat{right:auto;left:-2%;transform:rotate(-28deg)}
.scene.v202-cinematic-bat:not(.user-pitching) .catcher,.scene.v202-cinematic-bat:not(.user-pitching) .umpire{opacity:.11}
.scene.v202-cinematic-bat:not(.user-pitching) .f-lf{top:40%}.scene.v202-cinematic-bat:not(.user-pitching) .f-cf{top:37%}.scene.v202-cinematic-bat:not(.user-pitching) .f-rf{top:40%}
.scene.v202-cinematic-bat:not(.user-pitching) .f-ss,.scene.v202-cinematic-bat:not(.user-pitching) .f-2b{top:52%}

/* Pitching camera: camera sits behind the pitcher; plate, catcher and hitter are clearly in the distance. */
.scene.user-pitching.v202-cinematic-pitch{perspective:1500px;background:linear-gradient(#65b9ed 0 29%,#c2e5f3 30%,#527a58 31%,#173b27 100%)}
.scene.user-pitching.v202-cinematic-pitch .stadium{top:14%;height:29%;left:-10%;right:-10%}
.scene.user-pitching.v202-cinematic-pitch .crowd{top:20%;height:18%}
.scene.user-pitching.v202-cinematic-pitch .outfield{top:35%;left:-12%;right:-12%;bottom:-24%}
.scene.user-pitching.v202-cinematic-pitch .infieldDirt{top:68%;width:min(118vw,980px);height:min(86vw,740px);clip-path:polygon(47% 2%,53% 2%,90% 100%,10% 100%);filter:drop-shadow(0 7px 7px rgba(0,0,0,.24))}
.scene.user-pitching.v202-cinematic-pitch .infieldGrass{top:66%;width:min(86vw,740px);height:min(69vw,600px);clip-path:polygon(48.5% 2%,51.5% 2%,72% 100%,28% 100%)}
.scene.user-pitching.v202-cinematic-pitch .mound{top:83%;width:112px;height:38px;z-index:12}
.scene.user-pitching.v202-cinematic-pitch .pitcher{top:83%;z-index:28;filter:drop-shadow(0 12px 8px rgba(0,0,0,.45))}
.scene.user-pitching.v202-cinematic-pitch.pitch-right .pitcher{left:44%}
.scene.user-pitching.v202-cinematic-pitch.pitch-left .pitcher{left:56%}
.scene.user-pitching.v202-cinematic-pitch .zone{bottom:43%;width:76px;height:96px;border-color:rgba(255,255,255,.78);background:rgba(255,255,255,.015);z-index:24}
.scene.user-pitching.v202-cinematic-pitch .batter{--bscale:.43;right:22%;bottom:41.5%;z-index:21}
.scene.user-pitching.v202-cinematic-pitch.bat-left .batter{right:auto;left:22%;transform-origin:0 100%}
.scene.user-pitching.v202-cinematic-pitch .bat{right:23%;bottom:45%;height:72px;z-index:22}
.scene.user-pitching.v202-cinematic-pitch.bat-left .bat{right:auto;left:23%;transform:rotate(-28deg)}
.scene.user-pitching.v202-cinematic-pitch .catcher{bottom:40%;transform:translateX(-50%) scale(.47);z-index:20;opacity:.96}
.scene.user-pitching.v202-cinematic-pitch .umpire{bottom:39%;transform:translateX(-50%) scale(.43);z-index:19;opacity:.70}
.scene.user-pitching.v202-cinematic-pitch .fielder{opacity:.46;transform:translate(-50%,-50%) scale(.34)}
.scene.v202-cinematic-bat #ball,.scene.user-pitching.v202-cinematic-pitch #ball{will-change:left,top,transform;filter:drop-shadow(0 2px 2px #0008)}

/* Edge HUD: keep tactical controls away from the hitter/strike zone on phones. */
#gameApp.v202-mode-bat #scene .v20-batbar{left:6px;right:auto;bottom:68px;width:min(46%,220px);display:flex;flex-wrap:wrap;justify-content:flex-start;gap:4px}
#gameApp.v202-mode-bat #scene .v20-batbar button{padding:5px 7px;font-size:9px;background:rgba(5,20,21,.78);backdrop-filter:blur(5px)}
#gameApp.v202-mode-bat #scene.bat-left .v20-batbar{left:auto;right:6px;justify-content:flex-end}
#gameApp.v202-mode-pitch #scene .v20-pitchassist{top:auto;right:6px;bottom:132px;max-width:42%;padding:5px 7px;background:rgba(5,20,21,.76);backdrop-filter:blur(5px)}
#gameApp.v202-mode-pitch .pitch-mode-panel{background:linear-gradient(180deg,rgba(4,14,16,.82),rgba(3,10,12,.72));border-color:#ffffff22}

/* A batted ball still cuts to the existing high defensive/track camera. */
.hitCam:not(.hidden){animation:v203FollowCut .16s ease-out}
@keyframes v203FollowCut{from{opacity:.35;transform:scale(1.025)}to{opacity:1;transform:scale(1)}}

@media (orientation:landscape){
  #gameApp.v202-cinematic-game .gamebar{height:36px}
  #gameApp.v202-cinematic-game .hud,#gameApp.v202-cinematic-game .batterCard{top:40px}
  #gameApp.v202-cinematic-game .v15-wind{top:75px}
  .scene.v202-cinematic-bat:not(.user-pitching) .batter{--bscale:1.06;right:-1%;bottom:-10%}
  .scene.v202-cinematic-bat.bat-left:not(.user-pitching) .batter{right:auto;left:-1%}
  .scene.v202-cinematic-bat:not(.user-pitching) .bat{right:4%;bottom:16%;height:150px}
  .scene.v202-cinematic-bat.bat-left:not(.user-pitching) .bat{right:auto;left:4%}
  .scene.v202-cinematic-bat:not(.user-pitching) .zone{bottom:5%;width:92px;height:114px}
  .scene.v202-cinematic-bat:not(.user-pitching) .pitcher{top:40.8%;transform:translate(-50%,-50%) scale(.53)}
  .scene.user-pitching.v202-cinematic-pitch .pitcher{top:85%;transform:translate(-50%,-50%) scale(1.03)}
  .scene.user-pitching.v202-cinematic-pitch .zone{bottom:39%;width:68px;height:84px}
  .scene.user-pitching.v202-cinematic-pitch .batter{--bscale:.36;bottom:37.5%}
  .scene.user-pitching.v202-cinematic-pitch .catcher{bottom:36%;transform:translateX(-50%) scale(.40)}
  .scene.user-pitching.v202-cinematic-pitch .umpire{bottom:35%;transform:translateX(-50%) scale(.37)}
  #gameApp.v202-mode-pitch #scene .v20-pitchassist{bottom:68px;max-width:30%}
  #gameApp.v202-mode-bat #scene .v20-batbar{bottom:8px;width:min(35%,260px)}
}

@media (orientation:portrait){
  .scene.v202-cinematic-bat:not(.user-pitching) .batter{--bscale:1.38;right:-14%;bottom:-6%}
  .scene.v202-cinematic-bat.bat-left:not(.user-pitching) .batter{right:auto;left:-14%}
  .scene.v202-cinematic-bat:not(.user-pitching) .bat{right:-5%;height:168px}
  .scene.v202-cinematic-bat.bat-left:not(.user-pitching) .bat{right:auto;left:-5%}
  #gameApp.v202-mode-bat #scene .v20-batbar{width:44%;bottom:70px}
  #gameApp.v202-mode-pitch #scene .v20-pitchassist{bottom:136px;max-width:45%}
}
'''

          if marker not in s:
              if '</style>' not in s:
                  raise SystemExit('style end tag not found')
              s = s.replace('</style>', css + '\n</style>', 1)

          # Make the live view visibly the default choice while keeping legacy cameras selectable.
          s = s.replace('實戰（影片風格）</option>', '實戰視角（預設）</option>')
          s = s.replace('實戰（投手丘）</option>', '實戰視角（預設）</option>')

          # One-time migration for existing devices that had previously stored another camera.
          if 'cpblFantasyLiveViewV203' not in s:
              anchor = '\nfunction v15Hash(s){'
              if anchor not in s:
                  raise SystemExit('v15Hash anchor not found')
              migration = "\ntry{if(!localStorage.getItem('cpblFantasyLiveViewV203')){v15Prefs.batView='cinematic';v15Prefs.pitchView='cinematic';v15SavePrefs();localStorage.setItem('cpblFantasyLiveViewV203','1')}}catch{}"
              s = s.replace(anchor, migration + anchor, 1)

          # Preserve all pitch physics/curve calculations, but map the rendered ball to the correct camera direction.
          start = s.find('function animatePitch(now){')
          end = s.find('\nfunction strikeLoc()', start)
          if start < 0 or end < 0:
              raise SystemExit('animatePitch block not found')
          new_animate = r'''function animatePitch(now){if(paused||!pitching)return;const scene=$('scene'),f=scene.getBoundingClientRect(),e=pitchEnd(),t=clamp((now-pitchStart)/pitchDuration,0,1),ease=t*t*(3-2*t),cinePitch=halfMode==='pitch'&&scene.classList.contains('v202-cinematic-pitch'),cineBat=halfMode==='bat'&&scene.classList.contains('v202-cinematic-bat');let sx=f.width*.5,sy=f.height*.455,startScale=.62,endScale=1.64;if(cinePitch){const hand=scene.classList.contains('pitch-left')?-1:1,side=scene.classList.contains('delivery-sidearm'),sub=scene.classList.contains('delivery-submarine'),xoff=sub?.052:side?.045:.034;sx=f.width*(.5+hand*xoff);sy=f.height*(sub?.80:side?.755:.72);startScale=sub?1.18:1.34;endScale=.48}else if(cineBat){const hand=scene.classList.contains('pitch-left')?-1:1;sx=f.width*(.5+hand*.008);sy=f.height*.425;startScale=.42;endScale=1.68}const x=sx+(e.x-sx)*ease+Math.sin(Math.PI*t)*pitchCurve*(1-t*.2),y=sy+(e.y-sy)*ease+Math.pow(t,2)*pitchDrop,scale=startScale+(endScale-startScale)*ease,b=$('ball'),sh=$('ballShadow');b.style.left=x+'px';b.style.top=y+'px';b.style.transform=`translate(-50%,-50%) scale(${scale})`;if(sh){const groundY=sy+(cinePitch?18:26)+(e.y-sy)*ease*.92;sh.style.left=x+'px';sh.style.top=groundY+'px';sh.style.opacity=String((cinePitch?.30:.16)+ease*(cinePitch?-.16:.28));sh.style.transform=`translate(-50%,-50%) scale(${cinePitch?(1.02-ease*.58):(.48+ease*.72)})`}if(t>=1){pitching=false;$('tacticsBtn').disabled=false;b.style.display='none';if(sh)sh.style.display='none';if(halfMode==='pitch')resolveCpuPitch();else takePitch();return}raf=requestAnimationFrame(animatePitch)}'''
          s = s[:start] + new_animate + s[end:]

          path.write_text(s, encoding='utf-8')
          PY

      - name: Check JavaScript syntax and patch markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('baseball-game.html').read_text(encoding='utf-8')
          assert '/* ===== V203 LIVE GAME CAMERA ===== */' in s
          assert "cpblFantasyLiveViewV203" in s
          assert "cinePitch=halfMode==='pitch'" in s
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          if not m: raise SystemExit('script block not found')
          Path('/tmp/baseball-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/baseball-game.js

      - name: Commit patched game
        shell: bash
        run: |
          if git diff --quiet -- baseball-game.html; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add baseball-game.html
          git commit -m 'feat: upgrade baseball live game camera'
          git push origin HEAD:main
