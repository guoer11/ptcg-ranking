name: Patch baseball live camera

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-baseball-live-camera.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply live camera patch
        run: |
          python .github/scripts/patch_baseball_camera.py
          node --check /tmp/baseball-game.js
      - name: Commit patched game
        run: |
          if git diff --quiet -- baseball-game.html; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add baseball-game.html
          git commit -m 'feat: upgrade baseball live game camera'
          git push origin HEAD:main
