name: Add five-second in-game rest v141
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/add_interplay_5sec_rest_v141.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Apply five-second rest upgrade
        run: python scripts/add_interplay_5sec_rest_v141.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('baseball-game.html').read_text()
          js=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          Path('/tmp/baseball-v141.js').write_text(js)
          PY
          node --check /tmp/baseball-v141.js
      - name: Smoke check rest feature
        run: |
          grep -q 'V141_INTERPLAY_REST' baseball-game.html
          grep -q '投球後休息' baseball-game.html
          grep -q '打擊後休息' baseball-game.html
          grep -q 'v141RestChip' baseball-game.html
          grep -q "SITE_VERSION = 'v1.14." site-version.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball-game.html site-version.js
          git diff --cached --quiet || git commit -m "Add five-second rest between plays"
          git push
