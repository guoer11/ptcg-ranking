name: Probe Ivan 2025-26

on:
  push:
    branches:
      - probe-ivan-2025-26
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Probe Ivan 2025-26 data
        shell: python
        run: |
          import json
          import requests

          BASE='https://ptcg.bcb.idv.tw'
          PAGE=BASE+'/TE'
          s=requests.Session()
          s.headers.update({
              'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36',
              'Accept':'application/json,text/plain,*/*',
              'Referer':PAGE,
          })

          def get_json(path, params=None):
              r=s.get(BASE+path, params=params, timeout=60)
              print('\nGET', r.url, '->', r.status_code, r.headers.get('content-type'), 'len', len(r.content))
              r.raise_for_status()
              data=r.json()
              print('top type/keys:', type(data).__name__, list(data) if isinstance(data,dict) else '')
              return data

          wanted={'tw22756831','tw37208259','tw08069127'}

          sp=get_json('/TE/SearchPlayers', {'keyword':'tw'})
          rows=sp.get('players') or []
          print('SearchPlayers count',len(rows))
          for row in rows:
              if str(row.get('twpid','')).lower() in wanted:
                  print('SEARCH SAMPLE', json.dumps(row, ensure_ascii=False))

          ranks=get_json('/TE/GetPlayerRankings')
          print('GetPlayerRankings preview:', json.dumps(ranks, ensure_ascii=False)[:2500])
          def walk(o):
              if isinstance(o,dict):
                  if str(o.get('twpid','')).lower() in wanted:
                      print('RANK SAMPLE',json.dumps(o,ensure_ascii=False))
                  for v in o.values(): walk(v)
              elif isinstance(o,list):
                  for v in o: walk(v)
          walk(ranks)

          wcs=get_json('/TE/GetWcsPlayers', {'season':'2025-26'})
          print('GetWcsPlayers preview:', json.dumps(wcs, ensure_ascii=False)[:2500])
          walk(wcs)

          # Count WCS markers in SearchPlayers by current league to understand coverage.
          marked=[r for r in rows if r.get('hasWcs2026')]
          print('hasWcs2026 count',len(marked))
          by={}
          for r in marked:
              key=r.get('league202526') or r.get('league') or '-'
              by[key]=by.get(key,0)+1
          print('hasWcs2026 by league',json.dumps(by,ensure_ascii=False,sort_keys=True))
