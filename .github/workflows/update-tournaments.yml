name: Update PTCG tournaments

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron 使用 UTC。
    # 16:01 UTC = 台灣時間隔日 00:01；04:00 UTC = 台灣時間 12:00。
    - cron: "1 16 * * *"
    - cron: "0 4 * * *"
  push:
    branches:
      - main
    paths:
      - "scrape_tournaments.py"
      - "backfill_early_tournaments.py"
      - "enrich_registration_windows.py"
      - "requirements.txt"
      - ".github/workflows/update-tournaments.yml"

permissions:
  contents: write

concurrency:
  group: update-ptcg-tournaments
  cancel-in-progress: true

jobs:
  update-tournaments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch official tournament information
        run: python scrape_tournaments.py

      - name: Backfill early-season official tournaments
        run: python backfill_early_tournaments.py

      - name: Fetch official registration windows
        run: python enrich_registration_windows.py

      - name: Commit tournament changes
        id: commit
        run: |
          if [[ -z "$(git status --porcelain -- data/tournaments.json data/tournament_registration.json)" ]]; then
            echo "No tournament changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tournaments.json data/tournament_registration.json
          git commit -m "Update official tournament data"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Notify immediately after tournament data changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          # 通知後端改讀 GitHub main 的原始 JSON，因此不必等待 GitHub Pages 部署完成。
          sleep 3
          curl --fail-with-body --silent --show-error \
            -X POST "https://ceobnyikrudlxasyjukg.supabase.co/functions/v1/ptcg-line" \
            -H "Content-Type: application/json" \
            -d '{"action":"poll"}'
          echo
          curl --fail-with-body --silent --show-error \
            -X POST "https://ceobnyikrudlxasyjukg.supabase.co/functions/v1/ptcg-push" \
            -H "Content-Type: application/json" \
            -d '{"action":"poll"}'
          echo
