name: Update PTCG tournaments

on:
  workflow_dispatch:
  schedule:
    # Supabase Cron 於台灣時間 00:01 / 12:01 / 17:01 主動觸發 workflow_dispatch。
    # GitHub schedule 僅作 00:10 / 12:10 / 17:10 備援；cron 使用 UTC。
    - cron: "10 16 * * *"
    - cron: "10 4 * * *"
    - cron: "10 9 * * *"
  push:
    branches:
      - main
    paths:
      - "scrape_tournaments.py"
      - "update_log.py"
      - "backfill_early_tournaments.py"
      - "enrich_registration_windows.py"
      - "requirements.txt"
      - ".github/workflows/update-tournaments.yml"

permissions:
  contents: write

concurrency:
  group: update-ptcg-tournaments
  cancel-in-progress: true

jobs:
  update-tournaments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch official tournament information
        run: python scrape_tournaments.py

      - name: Backfill early-season official tournaments
        run: python backfill_early_tournaments.py

      - name: Fetch official registration windows
        run: python enrich_registration_windows.py

      - name: Build tournament update log
        run: python update_log.py tournaments

      - name: Commit tournament changes
        id: commit
        run: |
          if [[ -z "$(git status --porcelain -- data/tournaments.json data/tournament_registration.json data/update_log_tournaments.json)" ]]; then
            echo "No tournament changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tournaments.json data/tournament_registration.json data/update_log_tournaments.json
          git commit -m "Update official tournament data"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Notify after tournament data changes
        if: steps.commit.outputs.changed == 'true'
        run: |
          # 賽事資料一旦更新，立即讓 LINE 與網站 Push 都檢查一次。
          # ptcg-line / ptcg-push 目前都以「排名＋積分簽章」判斷排行榜，
          # 不會因 checked_at / updated_at 變動誤發排行榜通知。
          sleep 3
          curl --fail-with-body --silent --show-error \
            -X POST "https://ceobnyikrudlxasyjukg.supabase.co/functions/v1/ptcg-line" \
            -H "Content-Type: application/json" \
            -d '{"action":"poll"}'
          echo
          curl --fail-with-body --silent --show-error \
            -X POST "https://ceobnyikrudlxasyjukg.supabase.co/functions/v1/ptcg-push" \
            -H "Content-Type: application/json" \
            -d '{"action":"poll"}'
          echo
