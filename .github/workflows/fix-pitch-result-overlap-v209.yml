name: Fix baseball pitch result overlap v209

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run v209 pitch result overlap patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply result-safe pitch UI fix
        run: python .github/scripts/fix_pitch_result_overlap_v209.py
      - name: Check JS syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('baseball-game.html').read_text(encoding='utf-8')
          js=s.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/baseball-game.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/baseball-game.js
      - name: Commit fix
        run: |
          if git diff --quiet -- baseball-game.html; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add baseball-game.html
          git commit -m 'fix: keep previous at-bat result above pitch selector'
          git push origin main
