name: Inspect Ivan TE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-ivan-te.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public TE player records
        shell: bash
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse

          endpoint = 'https://ptcg.bcb.idv.tw/TE/SearchPlayers'
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept': 'application/json,text/plain,*/*',
              'Referer': 'https://ptcg.bcb.idv.tw/TE',
          }

          def search(keyword):
              url = endpoint + '?' + urllib.parse.urlencode({'keyword': keyword})
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as r:
                  raw = r.read().decode(r.headers.get_content_charset() or 'utf-8', errors='replace')
              data = json.loads(raw)
              players = data.get('players') or [] if data.get('success') else []
              return data, players

          os.makedirs('ivan_te_players', exist_ok=True)
          data, players = search('tw')
          valid = []
          seen = set()
          for p in players:
              pid = str(p.get('twpid') or '').strip().lower()
              name = str(p.get('cName') or '').strip()
              if not (pid.startswith('tw') and pid[2:].isdigit() and name):
                  continue
              if pid in seen:
                  continue
              seen.add(pid)
              valid.append({'player_id': pid, 'real_name': name})

          print('SEARCH_SUCCESS', bool(data.get('success')))
          print('RAW_PLAYER_COUNT', len(players))
          print('VALID_IDENTITY_COUNT', len(valid))
          print('FIELDS', sorted({k for p in players[:100] for k in p.keys()}))
          if players:
              print('FIRST_ID', str(players[0].get('twpid') or '').strip().lower())
              print('LAST_ID', str(players[-1].get('twpid') or '').strip().lower())

          with open('ivan_te_players/players.json', 'w', encoding='utf-8') as f:
              json.dump(valid, f, ensure_ascii=False, indent=2)
          with open('ivan_te_players/meta.json', 'w', encoding='utf-8') as f:
              json.dump({'raw_count': len(players), 'valid_count': len(valid), 'success': bool(data.get('success'))}, f, ensure_ascii=False, indent=2)
          PY
      - name: Upload public player data
        uses: actions/upload-artifact@v4
        with:
          name: ivan-te-players
          path: ivan_te_players/
          retention-days: 1
