name: Add baseball pitcher staff

on:
  push:
    branches: [main]
    paths:
      - scripts/add_pitcher_staff.py
      - .github/workflows/add-pitcher-staff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Add pitching staff system
        run: python scripts/add_pitcher_staff.py
      - name: Commit patched game
        run: |
          if git diff --quiet -- baseball-game.html; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball-game.html
          git commit -m "Add selectable starting and bullpen pitchers"
          git push
