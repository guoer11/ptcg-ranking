name: Sync PTCG unofficial-preliminary ranking

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: 'Official Pokémon Asia event ID (optional, for registering the live event)'
        required: false
        type: string
      tid:
        description: 'TCG Meister TID (required with event_id)'
        required: false
        type: string
  schedule:
    - cron: '40 17 * * *'
    - cron: '40 9 * * *'
  push:
    branches: [main]
    paths:
      - 'sync_preliminary.py'
      - 'data/preliminary_sources.json'
      - '.github/workflows/sync-preliminary.yml'

permissions:
  contents: write

concurrency:
  group: sync-preliminary
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape public standings and validate completeness
        env:
          SOURCE_EVENT_ID: ${{ inputs.event_id }}
          SOURCE_TID: ${{ inputs.tid }}
        run: |
          if [[ -n "$SOURCE_EVENT_ID" || -n "$SOURCE_TID" ]]; then
            python sync_preliminary.py --event-id "$SOURCE_EVENT_ID" --tid "$SOURCE_TID"
          else
            python sync_preliminary.py
          fi
      - name: Commit verified preliminary data only
        run: |
          if [[ -z "$(git status --porcelain -- data/preliminary_results.json data/preliminary_sources.json)" ]]; then
            echo 'No new verified ranking data'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/preliminary_results.json data/preliminary_sources.json
          git commit -m 'Sync verified public preliminary standings'
          git pull --rebase origin main
          git push origin HEAD:main
