name: Refresh v2.2.0 pairing cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-v220-pairing-cache.yml'

permissions:
  contents: write

jobs:
  bump-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update pairing cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pairing.html')
          text = path.read_text(encoding='utf-8')
          old = 'site-version.js?v=1.14.2-r1'
          new = 'site-version.js?v=2.2.0-r1'
          if old not in text and new not in text:
              raise SystemExit('site-version script reference not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- pairing.html; then
            echo 'Already updated.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pairing.html
          git commit -m 'Refresh v2.2.0 pairing cache key'
          git pull --rebase origin main
          git push origin HEAD:main
