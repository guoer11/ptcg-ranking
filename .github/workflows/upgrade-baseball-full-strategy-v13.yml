name: Upgrade baseball full strategy v13
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/upgrade_baseball_full_strategy_v13.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Apply v13 upgrade
        run: python scripts/upgrade_baseball_full_strategy_v13.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('baseball-game.html').read_text()
          js=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          Path('/tmp/baseball-game.js').write_text(js)
          PY
          node --check /tmp/baseball-game.js
      - name: Smoke check features
        run: |
          grep -q 'id="catcher"' baseball-game.html
          grep -q 'id="umpire"' baseball-game.html
          grep -q '牽制一壘' baseball-game.html
          grep -q 'pitchMastery' baseball-game.html
          grep -q 'cpuReadBonus' baseball-game.html
          grep -q 'buntCallBtn' baseball-game.html
          grep -q 'GAME_SAVE_KEY' baseball-game.html
          grep -q 'pitchChartGrid' baseball-game.html
          grep -q 'result===.*DP' baseball-game.html
          grep -q "v1.13.0" site-version.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball-game.html site-version.js
          git diff --cached --quiet || git commit -m "Add complete baseball strategy systems"
          git push
