name: Refine baseball v15 hot zones
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fix_baseball_v15_hotzones.py
      - .github/workflows/fix-baseball-v15-hotzones.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Apply v15 refinements
        run: python scripts/fix_baseball_v15_hotzones.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('baseball-game.html').read_text()
          js=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          Path('/tmp/baseball-v15-fix.js').write_text(js)
          PY
          node --check /tmp/baseball-v15-fix.js
      - name: Smoke check refinements
        run: |
          grep -q 'v15PitchZones' baseball-game.html
          grep -q '綠框=投手擅長區' baseball-game.html
          grep -q '上場 ${x.pitches} 球' baseball-game.html
          grep -q 'v15UserThrowPitchBase' baseball-game.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball-game.html
          git diff --cached --quiet || git commit -m "Refine baseball v15 hot zones and fatigue"
          git push
