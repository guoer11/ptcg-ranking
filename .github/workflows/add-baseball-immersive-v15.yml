name: Add immersive baseball v15
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/add_baseball_immersive_v15.py
      - .github/workflows/add-baseball-immersive-v15.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Apply immersive baseball v15
        run: python scripts/add_baseball_immersive_v15.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('baseball-game.html').read_text()
          js=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          Path('/tmp/baseball-v15.js').write_text(js)
          PY
          node --check /tmp/baseball-v15.js
      - name: Smoke check v15 systems
        run: |
          grep -q 'V15 IMMERSIVE BASEBALL' baseball-game.html
          grep -q 'v15HotZoneLayer' baseball-game.html
          grep -q 'v15MaybeWildPitch' baseball-game.html
          grep -q 'v15MoundVisitBtn' baseball-game.html
          grep -q 'v15RenderLeaders' baseball-game.html
          grep -q 'v15RollInjury' baseball-game.html
          grep -q 'v15-pitch-behind' baseball-game.html
          grep -q "SITE_VERSION = 'v1.15.0'" site-version.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball-game.html site-version.js
          git diff --cached --quiet || git commit -m "Add immersive baseball v15 systems"
          git push
