name: Expand Pitching App Library
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/expand-pitching-app-library.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Expand pitch library
        run: python scripts/expand_pitching_app_library.py
      - name: Validate
        run: git diff --check
      - name: Commit changes
        run: |
          if git diff --quiet -- pitching-app/index.html pitching-app/sw.js; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pitching-app/index.html pitching-app/sw.js
          git commit -m "feat: expand pitching app to 45 pitch types"
          git push origin main
