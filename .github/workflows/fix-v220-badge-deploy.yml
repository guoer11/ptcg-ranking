name: Fix v2.2.0 badge deployment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v220-badge-deploy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh badge cache keys
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('site-version.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace('player-badges.css?v=2.2.0-r2', 'player-badges.css?v=2.2.0-r4')
          text = text.replace('player-badges.js?v=2.2.0-r3', 'player-badges.js?v=2.2.0-r4')
          p.write_text(text, encoding='utf-8')

          p = Path('player-badges.js')
          text = p.read_text(encoding='utf-8')
          text = text.replace("data/player_badges.json?v=2.2.0-r1", "data/player_badges.json?v=2.2.0-r2")
          p.write_text(text, encoding='utf-8')

          for filename in ('index.html', 'pairing.html'):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              text = text.replace('site-version.js?v=2.2.0-r3', 'site-version.js?v=2.2.0-r4')
              p.write_text(text, encoding='utf-8')

          p = Path('family-notify.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('player-badges.css?v=2.2.0-r2', 'player-badges.css?v=2.2.0-r4')
          text = text.replace('player-badges.js?v=2.2.0-r3', 'player-badges.js?v=2.2.0-r4')
          text = text.replace('family-attention-bridge.js?v=2.2.0-r1', 'family-attention-bridge.js?v=2.2.0-r2')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-version.js player-badges.js index.html pairing.html family-notify.html
          if git diff --cached --quiet; then
            echo 'Already refreshed.'
            exit 0
          fi
          git commit -m 'Refresh v2.2.0 player badge cache'
          git pull --rebase origin main
          git push origin HEAD:main
