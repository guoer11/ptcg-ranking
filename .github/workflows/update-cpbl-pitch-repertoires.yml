name: Update CPBL pitch repertoires

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_cpbl_pitch_repertoires.py'
      - '.github/workflows/update-cpbl-pitch-repertoires.yml'
  schedule:
    - cron: '40 18 1,15 * *'

permissions:
  contents: write

concurrency:
  group: cpbl-pitch-repertoires
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Install scraper and browser
        run: |
          python -m pip install --disable-pip-version-check 'scrapling[ai]' requests >/dev/null
          python -m patchright install --with-deps chromium >/dev/null

      - name: Build verified pitcher repertoire data
        run: python scripts/update_cpbl_pitch_repertoires.py

      - name: Show coverage summary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/cpbl_pitch_repertoires_2026.json',encoding='utf-8'))
          print('count=',p['count'],'verified=',p['verified_count'],'partial=',p['partial_count'],'unresolved=',p['unresolved_count'])
          print('samples:')
          for k,v in list(p['repertoires'].items())[:10]:
              print(k,v['source_type'],v['pitches'],v.get('repertoire_text'))
          PY

      - name: Commit updated repertoire data
        run: |
          if [ -z "$(git status --porcelain -- data/cpbl_pitch_repertoires_2026.json)" ]; then
            echo 'No repertoire changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cpbl_pitch_repertoires_2026.json
          git commit -m 'Update CPBL pitcher repertoires'
          git push
