name: Upgrade baseball cinematic view v202

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/upgrade_baseball_cinematic_view_v202.py
      - .github/workflows/upgrade-baseball-cinematic-view-v202.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Apply cinematic camera upgrade
        run: python scripts/upgrade_baseball_cinematic_view_v202.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('baseball-game.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/baseball-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/baseball-inline.js

      - name: Smoke check cinematic upgrade
        run: |
          set -euo pipefail
          grep -q "V202 CINEMATIC CAMERA" baseball-game.html
          grep -q "v202-cinematic-bat" baseball-game.html
          grep -q "v202-cinematic-pitch" baseball-game.html
          grep -q "實戰（影片風格）" baseball-game.html
          grep -q "實戰（投手丘）" baseball-game.html
          grep -q "cpblFantasyCinematicViewV202" baseball-game.html
          grep -q "pitchView==='cinematic'" baseball-game.html
          grep -q "const SITE_VERSION = 'v2.0.2'" site-version.js

      - name: Commit changes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball-game.html site-version.js
          git commit -m "Add cinematic batting and pitching views"
          git push origin main
