name: Apply Pitch Hit FX v4

on:
  push:
    branches: ["pitch-hit-fx-v4-work"]
    paths:
      - ".github/workflows/apply-pitch-hit-fx-v4.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply Pitch King v4 patch
        run: python scripts/apply_pitch_hit_fx_v4.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('pitching-app/index.html').read_text(encoding='utf-8')
          start=text.rfind('<script>')+len('<script>')
          end=text.rfind('</script>')
          Path('/tmp/pitching-app.js').write_text(text[start:end],encoding='utf-8')
          PY
          node --check /tmp/pitching-app.js
      - name: Commit app changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pitching-app/index.html pitching-app/sw.js pitching-app/update.html pitching-app/version.txt
          git commit -m "feat: add batted ball and strikeout effects" || exit 0
          git push
