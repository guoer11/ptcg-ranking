name: Fix baseball pitcher staff records

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_pitcher_staff_records.py
      - .github/workflows/fix-pitcher-staff-records.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - run: python scripts/fix_pitcher_staff_records.py
      - name: Commit patched game
        run: |
          if git diff --quiet -- baseball-game.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseball-game.html
          git commit -m "Fix pitching staff game records"
          git push
