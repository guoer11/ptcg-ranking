name: Patch baseball pitch UI v204

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-baseball-pitch-ui-v204.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Apply pitch UI patch
        run: |
          python .github/scripts/patch_baseball_pitch_ui_v204.py
          python - <<'PY'
          from pathlib import Path
          s = Path('baseball-game.html').read_text(encoding='utf-8')
          a = s.find('<script>')
          b = s.rfind('</script>')
          if a < 0 or b < 0:
              raise SystemExit('script block not found')
          Path('/tmp/baseball-game.js').write_text(s[a+8:b], encoding='utf-8')
          PY
          node --check /tmp/baseball-game.js
      - name: Commit patched game
        run: |
          git config user.name "guoer11"
          git config user.email "71049596+guoer11@users.noreply.github.com"
          git add baseball-game.html
          git diff --cached --quiet && exit 0
          git commit -m "ui: move pitch types to top"
          git push origin main
