name: Refine v2.2.0 attention labels

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-v220-attention-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refine badge wording and player-detail attention control
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('player-badges.js')
          text = p.read_text(encoding='utf-8')
          replacements = [
              ("const range = type === 'great' ? '近60天' : '本賽季';",
               "const range = type === 'great' ? '自該次冠／亞軍日起60天內' : '本賽季';"),
              ("<span class=\"player-badge-legend-line\"><b>¹</b>＝冠軍　<b>²</b>＝亞軍；超級球看近60天，高級球／紀念球看本賽季</span>",
               "<span class=\"player-badge-legend-line\"><b>¹</b>＝冠軍　<b>²</b>＝亞軍；超級球自該次冠／亞軍日起保留60天，高級球／紀念球看本賽季</span>"),
              ("${attentionSet.has(id) ? '★ 已標記注意' : '☆ 標記注意'}",
               "${attentionSet.has(id) ? '★ 已加入注意名單' : '☆ 加入注意名單'}"),
          ]
          for old, new in replacements:
              if old not in text and new not in text:
                  raise SystemExit(f'player-badges.js target not found: {old}')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          p = Path('site-version.js')
          text = p.read_text(encoding='utf-8')
          old = 'player-badges.js?v=2.2.0-r2'
          new = 'player-badges.js?v=2.2.0-r3'
          if old not in text and new not in text:
              raise SystemExit('site-version badge script cache key not found')
          p.write_text(text.replace(old, new), encoding='utf-8')

          for filename in ('index.html', 'pairing.html'):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              old = 'site-version.js?v=2.2.0-r2'
              new = 'site-version.js?v=2.2.0-r3'
              if old not in text and new not in text:
                  raise SystemExit(f'{filename} site-version cache key not found')
              p.write_text(text.replace(old, new), encoding='utf-8')

          p = Path('family-notify.html')
          text = p.read_text(encoding='utf-8')
          old = 'player-badges.js?v=2.2.0-r2'
          new = 'player-badges.js?v=2.2.0-r3'
          if old not in text and new not in text:
              raise SystemExit('family-notify badge script cache key not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player-badges.js site-version.js index.html pairing.html family-notify.html
          if git diff --cached --quiet; then
            echo 'Already updated.'
            exit 0
          fi
          git commit -m 'Clarify v2.2.0 badge timing and attention labels'
          git pull --rebase origin main
          git push origin HEAD:main
