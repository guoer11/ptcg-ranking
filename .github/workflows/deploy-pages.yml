name: Deploy PTCG ranking site

# GitHub Pages source: GitHub Actions
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Build public site artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data _site/data/players
          cp index.html app.js identity-ui.js auth-ui.js auth-ui.css styles.css summary-compact.css _site/
          cp data/ranking.json _site/data/ranking.json
          cp -R data/players/. _site/data/players/
          touch _site/.nojekyll
          if find _site -type f -name 'player_identity*.json' | grep -q .; then
            echo "Identity database must never be included in the public Pages artifact."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
