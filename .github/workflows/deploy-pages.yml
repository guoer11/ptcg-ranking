name: Deploy PTCG ranking site

# GitHub Pages source: GitHub Actions
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # 資料排程在台灣時間 00:05 / 12:00 執行；Pages 於 00:15 / 12:15 重新發布最新資料與報名期間。
    - cron: "15 16 * * *"
    - cron: "15 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Build public site artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data _site/data/players _site/data/seasons
          cp index.html tournaments.html manifest.webmanifest sw.js app.js identity-ui.js auth-ui.js auth-ui.css lookup-ui.js lookup-ui.css ranking-season-ui.js ranking-season-ui.css tournaments.js tournaments.css site-nav.css styles.css summary-compact.css push-ui.js push-ui.css push-fix.js line-ui.js _site/
          cp data/ranking.json _site/data/ranking.json
          cp data/ranking_history.json _site/data/ranking_history.json
          cp data/tournaments.json _site/data/tournaments.json
          if [ -f data/tournament_registration.json ]; then
            cp data/tournament_registration.json _site/data/tournament_registration.json
          else
            printf '%s\n' '{"updated_at":null,"events":{}}' > _site/data/tournament_registration.json
          fi
          cp -R data/players/. _site/data/players/
          cp -R data/seasons/. _site/data/seasons/
          python -m pip install --disable-pip-version-check --quiet pillow
          python generate_pwa_icons.py _site
          touch _site/.nojekyll
          if find _site -type f -name 'player_identity*.json' | grep -q .; then
            echo "Identity database must never be included in the public Pages artifact."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
