name: Deploy PTCG ranking site

# GitHub Pages source: GitHub Actions
# Baseball realism v7 deployment marker
# Baseball full strategy v13 deployment marker
# Baseball complete v14 deployment marker
# Baseball v14 edge-fix deployment marker
# Baseball v14 error-scoring deployment marker
# Baseball v14.3 five-second-rest deployment marker
# Baseball v14.4 half-inning-rest deployment marker
# Baseball immersive v15 deployment marker
# Baseball v2.0 mega expansion deployment marker
# Baseball v2.0 pitch-clock removal deployment marker
on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - "Update PTCG ranking"
      - "Update PTCG tournaments"
      - "Update CPBL game stats"
    types:
      - completed
  schedule:
    # 資料工作完成後會立即重新部署；以下 00:15 / 12:15 僅作 GitHub 排程備援。
    - cron: "15 16 * * *"
    - cron: "15 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Build public site artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data _site/data/players _site/data/seasons _site/assets/q-icons
          cp index.html tournaments.html pairing.html family-notify.html pun-game.html baseball-game.html baseball-roster.html manifest.webmanifest sw.js app.js identity-ui.js auth-ui.js auth-ui.css lookup-ui.js lookup-ui.css ranking-season-ui.js ranking-season-ui.css tournaments.js tournaments.css pairing.js pairing.css pairing-odds.js pairing-odds-engine.js pairing-odds-worker.js pairing-odds.css pairing-quick-lookup.js pairing-quick-lookup.css pairing-deck-scout.js pairing-deck-scout.css pairing-history.js pairing-history.css deck-settings-ui.js deck-settings-ui.css update-log-ui.js update-log-ui.css site-version.js site-nav.css styles.css summary-compact.css push-ui.js push-ui.css push-fix.js line-ui.js site-account-ui.js account-hub-v2.js account-hub-v2.css family-owner-ui.js family-owner-ui.css family-notify.js family-notify.css _site/
          cp assets/q-icons/*.webp _site/assets/q-icons/
          cp data/pairing-odds-3000442*.json _site/data/
          cp data/ranking.json _site/data/ranking.json
          cp data/ranking_history.json _site/data/ranking_history.json
          cp data/tournaments.json _site/data/tournaments.json
          cp data/update_log_ranking.json _site/data/update_log_ranking.json
          cp data/update_log_tournaments.json _site/data/update_log_tournaments.json
          if [ -f data/cpbl_batting_2026.json ]; then
            cp data/cpbl_batting_2026.json _site/data/cpbl_batting_2026.json
          else
            printf '%s\n' '{"year":2026,"updated_at":null,"count":0,"players":{}}' > _site/data/cpbl_batting_2026.json
          fi
          if [ -f data/cpbl_pitching_2026.json ]; then
            cp data/cpbl_pitching_2026.json _site/data/cpbl_pitching_2026.json
          else
            printf '%s\n' '{"year":2026,"updated_at":null,"count":0,"pitchers":{}}' > _site/data/cpbl_pitching_2026.json
          fi
          if [ -f data/tournament_registration.json ]; then
            cp data/tournament_registration.json _site/data/tournament_registration.json
          else
            printf '%s\n' '{"updated_at":null,"events":{}}' > _site/data/tournament_registration.json
          fi
          cp -R data/players/. _site/data/players/
          cp -R data/seasons/. _site/data/seasons/
          python -m pip install --disable-pip-version-check --quiet pillow
          python generate_pwa_icons.py _site
          touch _site/.nojekyll
          if find _site -type f -name 'player_identity*.json' | grep -q .; then
            echo "Identity database must never be included in the public Pages artifact."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
