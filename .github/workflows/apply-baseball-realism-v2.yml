name: Apply baseball realism v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-baseball-realism-v2.yml'
      - 'scripts/patch_baseball_realism_v2.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Apply realism patch
        run: python scripts/patch_baseball_realism_v2.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('baseball-game.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m:
              raise SystemExit('script block not found')
          Path('/tmp/baseball-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/baseball-game.js
      - name: Commit patched game
        run: |
          if git diff --quiet -- baseball-game.html; then
            echo 'No change needed'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add baseball-game.html
            git commit -m 'Add fielding, baserunning and home run camera animations'
            git push
          fi
      - name: Deploy latest main to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
