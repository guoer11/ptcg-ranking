<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0a1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="投球王" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <title>投球王</title>
  <style>
    :root{
      --bg:#07101d;--panel:#0e1b2d;--panel2:#13253b;--text:#f6f8fb;--muted:#91a3b8;
      --accent:#4ab3ff;--accent2:#8ce2ff;--good:#51d88a;--warn:#ffcc66;--bad:#ff6b6b;
      --line:rgba(255,255,255,.11);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;overscroll-behavior:none}
    body{min-height:100dvh;background:
      radial-gradient(circle at 50% 0%,rgba(74,179,255,.14),transparent 32%),
      linear-gradient(180deg,#091625 0%,#06101c 62%,#030910 100%)}
    button{font:inherit;color:inherit}
    .app{width:min(100%,520px);min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 18px)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .brand{display:flex;align-items:center;gap:10px}
    .logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#153d62,#0b1f36);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 10px 28px rgba(0,0,0,.25)}
    .logo .ball{width:25px;height:25px;border-radius:50%;background:#fff;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.28)}
    .logo .ball:before,.logo .ball:after{content:"";position:absolute;top:3px;width:7px;height:18px;border:2px solid #e34c4c;border-top-color:transparent;border-bottom-color:transparent;border-radius:50%}
    .logo .ball:before{left:3px}.logo .ball:after{right:3px}
    h1{font-size:18px;line-height:1.1;margin:0}.sub{font-size:11px;color:var(--muted);margin-top:4px}
    .modeBtn{border:1px solid var(--line);background:#122238;color:var(--text);border-radius:12px;padding:10px 11px;font-size:12px;font-weight:700;appearance:none;-webkit-appearance:none}
    .duelHud{position:absolute;left:12px;top:12px;z-index:18;padding:9px 11px;border-radius:14px;background:rgba(4,11,19,.76);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);min-width:150px}
    .baseBoard{display:flex;align-items:center;gap:9px;margin-top:7px;padding-top:6px;border-top:1px solid #ffffff22;font-size:11px;color:#e8eef7}.diamond{position:relative;width:51px;height:46px;flex-shrink:0}.base{position:absolute;width:13px;height:13px;transform:rotate(45deg);background:#536579;border:2px solid #bdc9d5;border-radius:2px}.base.on{background:#ffce48;border-color:#fff0a6;box-shadow:0 0 10px #f3b534}.base.first{right:3px;top:22px}.base.second{left:19px;top:3px}.base.third{left:3px;top:22px}.baseText{line-height:1.5;font-weight:700}
    .duelHud.aboveField{position:relative;top:auto;left:auto;width:100%;box-sizing:border-box;margin:0 0 8px;z-index:1;padding:9px 12px;border-radius:16px;background:rgba(4,11,19,.88)}
    .duelHud.hidden{display:none}.duelName{font-size:11px;color:#c6d3e1}.duelCount{display:flex;align-items:center;gap:8px;margin-top:4px}.duelCount b{font-size:16px}.duelCount span{font-size:10px;color:var(--muted);margin-left:auto}
    .batter.swing{animation:batterSwing .42s cubic-bezier(.2,.8,.2,1)}
    @keyframes batterSwing{0%{transform:rotate(0) translateX(0)}34%{transform:rotate(-26deg) translateX(-11px) translateY(1px)}62%{transform:rotate(-10deg) translateX(-5px)}100%{transform:rotate(0) translateX(0)}}
    .scorebar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
    .score{background:rgba(14,27,45,.88);border:1px solid var(--line);border-radius:14px;padding:9px 8px;text-align:center}
    .score b{display:block;font-size:17px}.score span{font-size:10px;color:var(--muted)}
    .stage{position:relative;height:min(52vh,455px);min-height:355px;border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,.09);box-shadow:0 18px 45px rgba(0,0,0,.32);touch-action:none;user-select:none;-webkit-user-select:none;background:
      radial-gradient(ellipse at 50% 18%,rgba(204,233,255,.22),transparent 35%),
      linear-gradient(180deg,#1d4b71 0 29%,#1f6a4e 29% 64%,#8b5b37 64% 100%)}
    .stadiumLights{position:absolute;inset:0;background:
      radial-gradient(circle at 10% 7%,#fff 0 1px,transparent 2px),
      radial-gradient(circle at 21% 7%,#fff 0 1px,transparent 2px),
      radial-gradient(circle at 79% 7%,#fff 0 1px,transparent 2px),
      radial-gradient(circle at 90% 7%,#fff 0 1px,transparent 2px);opacity:.8}
    .grass{position:absolute;left:-20%;right:-20%;bottom:18%;height:43%;border-radius:50%;background:radial-gradient(ellipse at center,#2e845f 0 47%,#256d51 48% 62%,transparent 63%)}
    .grass:before{content:"";position:absolute;left:50%;top:7%;width:65%;height:85%;transform:translateX(-50%);border-left:2px solid rgba(255,255,255,.32);border-right:2px solid rgba(255,255,255,.32);clip-path:polygon(50% 100%,0 0,100% 0);pointer-events:none}
    .grass:after{content:"";position:absolute;left:12%;right:12%;top:28%;height:36%;border-top:3px solid rgba(246,220,157,.5);border-radius:50%;pointer-events:none}
    .landingRing{position:absolute;display:none;width:28px;height:12px;border:2px solid #fff2a8;border-radius:50%;box-shadow:0 0 16px #ffda4e;transform:translate(-50%,-50%);pointer-events:none;z-index:8}
    .landingRing.show{display:block;animation:landPulse .55s ease-out infinite alternate}
    @keyframes landPulse{from{opacity:.55;scale:.8}to{opacity:1;scale:1.2}}
    .dirt{position:absolute;width:60%;height:34%;left:20%;bottom:5%;border-radius:50%;background:#9a6841;box-shadow:inset 0 0 35px rgba(66,33,13,.25)}
    .mound{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);width:48%;height:19%;border-radius:50%;background:radial-gradient(ellipse,#b47a4e,#895837 68%,transparent 70%)}
    .rubber{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);width:50px;height:7px;border-radius:2px;background:#f4f2eb}
    .plate{position:absolute;left:50%;top:66%;transform:translate(-50%,-50%);width:44px;height:34px;background:#f8f8f4;clip-path:polygon(12% 0,88% 0,100% 52%,50% 100%,0 52%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
    .batter{position:absolute;right:10%;top:39%;width:28px;height:118px;opacity:.9;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
    .batter:before{content:"";position:absolute;left:5px;top:0;width:22px;height:22px;border-radius:50%;background:#101820}
    .batter:after{content:"";position:absolute;left:9px;top:18px;width:15px;height:54px;border-radius:10px;background:#101820;box-shadow:-10px 47px 0 -4px #101820,11px 47px 0 -4px #101820,20px 0 0 -6px #101820;transform:rotate(-5deg)}
    .stadiumStand{position:absolute;top:12%;left:-5%;width:110%;height:19%;background:repeating-linear-gradient(90deg,#19354b 0 9px,#284b60 9px 12px);border-bottom:7px solid #c6a05e;box-shadow:0 5px 14px #112b36;opacity:.8}
    .stadiumStand:after{content:"";position:absolute;inset:8px 0;background:radial-gradient(circle,#f7df9a 1px,transparent 2px) 0 0/19px 11px;opacity:.55}
    .backstop{position:absolute;left:3%;right:3%;top:30%;height:28%;border:2px solid rgba(218,235,243,.17);border-radius:50% 50% 8% 8%;background:repeating-linear-gradient(90deg,transparent 0 13px,rgba(225,235,244,.07) 14px 15px);pointer-events:none}
    .catcher{position:absolute;left:50%;top:62%;width:46px;height:49px;transform:translate(-50%,-50%);z-index:2;pointer-events:none;filter:drop-shadow(0 4px 3px #102233)}
    .catcher .helmet{position:absolute;left:13px;top:0;width:21px;height:21px;border-radius:45% 45% 38% 38%;background:#183552;border:3px solid #a7c5d8;box-shadow:inset 0 -5px #122b42}
    .catcher .helmet:after{content:"";position:absolute;inset:6px 2px 2px;border:2px solid #d1e2e8;border-radius:3px}
    .catcher .body{position:absolute;left:9px;top:19px;width:29px;height:22px;border-radius:10px 10px 7px 7px;background:linear-gradient(90deg,#234b70,#467a9b,#234b70);border:2px solid #a7c5d8}
    .catcher .body:after{content:"";position:absolute;left:-8px;top:17px;width:41px;height:12px;border-radius:12px;background:#173b5b}
    .catcher .mitt{position:absolute;left:-5px;top:23px;width:17px;height:20px;border-radius:50%;background:#ae6738;border:2px solid #5d351d;transform:rotate(-22deg)}
    .batter{z-index:3;width:39px;height:122px;right:8%;top:38%;opacity:1}
    .batter:before{left:8px;width:23px;height:24px;background:#e8b787;border:5px solid #183653;box-sizing:border-box}
    .batter:after{left:11px;top:22px;width:20px;height:56px;background:linear-gradient(90deg,#f1f5f7 0 42%,#9db9d4 43% 100%);box-shadow:-10px 50px 0 -4px #e8edf1,12px 50px 0 -4px #e8edf1,22px 0 0 -7px #e3b58a}
    .batter .bat{position:absolute;right:-9px;top:4px;width:7px;height:75px;background:linear-gradient(90deg,#79502e,#e4b77c,#8c5d36);border-radius:6px;transform:rotate(-30deg);transform-origin:50% 80%;box-shadow:0 0 0 1px #51351d}
    .batter.swing .bat{animation:batSwing .42s ease-in-out}
    @keyframes batSwing{0%{transform:rotate(-30deg)}40%{transform:rotate(-100deg)}80%{transform:rotate(45deg)}100%{transform:rotate(-30deg)}}
    .strikeWrap{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:145px;height:190px}
    .strikeZone{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.25),0 0 24px rgba(255,255,255,.08);pointer-events:none}
    .cell{border:1px solid rgba(255,255,255,.32);background:rgba(4,13,22,.12);position:relative;pointer-events:none}
    .cell.active{background:rgba(74,179,255,.25);box-shadow:inset 0 0 0 2px var(--accent)}
    .cell.challenge:after{content:"";position:absolute;inset:10px;border-radius:50%;border:3px solid #ffd75a;background:rgba(255,215,90,.17);box-shadow:0 0 22px rgba(255,215,90,.36)}
    .aim{position:absolute;width:30px;height:30px;border:2px solid #8ce2ff;border-radius:50%;left:50%;top:48%;transform:translate(-50%,-50%);pointer-events:none;z-index:12;box-shadow:0 0 0 6px rgba(74,179,255,.13),0 0 18px rgba(74,179,255,.55)}
    .aim:before,.aim:after{content:"";position:absolute;background:#8ce2ff;opacity:.8}
    .aim:before{width:2px;height:38px;left:11px;top:-7px}.aim:after{height:2px;width:38px;top:11px;left:-7px}
    .ballFlight{display:none;position:absolute;left:50%;bottom:10%;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.35);z-index:9}
    .ballFlight:before,.ballFlight:after{content:"";position:absolute;top:4px;width:6px;height:15px;border:1.7px solid #df4a4a;border-top-color:transparent;border-bottom-color:transparent;border-radius:50%}
    .ballFlight:before{left:3px}.ballFlight:after{right:3px}
    .trail{display:none;position:absolute;width:4px;height:70px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.0),rgba(140,226,255,.55));transform-origin:bottom center;z-index:8}
    .toast{position:absolute;left:50%;top:16%;transform:translateX(-50%) scale(.95);min-width:150px;text-align:center;padding:10px 15px;border-radius:999px;background:rgba(5,12,21,.83);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);font-weight:800;opacity:0;transition:.2s;z-index:20;pointer-events:none}
    .toast.show{opacity:1;transform:translateX(-50%) scale(1)}
    .battedBall{display:none;position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.2),0 2px 8px rgba(0,0,0,.38),0 0 12px rgba(255,255,255,.8);z-index:24;pointer-events:none}
    .battedBall:before,.battedBall:after{content:"";position:absolute;top:2px;width:3px;height:9px;border:1px solid #d34a4a;border-top-color:transparent;border-bottom-color:transparent;border-radius:50%}.battedBall:before{left:2px}.battedBall:after{right:2px}
    .impactFlash{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:21;background:radial-gradient(circle at 58% 48%,rgba(255,255,255,.95) 0 2%,rgba(255,215,90,.46) 3% 10%,transparent 28%)}
    .impactFlash.show{animation:impactFlash .32s ease-out}.impactFlash.homer{background:radial-gradient(circle at 58% 48%,rgba(255,255,255,1) 0 2%,rgba(255,130,50,.62) 3% 12%,transparent 34%)}
    @keyframes impactFlash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
    .bigFx{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%) scale(.72);opacity:0;z-index:26;pointer-events:none;white-space:nowrap;font-size:30px;font-weight:1000;letter-spacing:.04em;text-shadow:0 4px 14px rgba(0,0,0,.65)}
    .bigFx.show{animation:bigFxPop .9s cubic-bezier(.18,.85,.2,1)}.bigFx.strikeout{color:#9ce9ff}.bigFx.homer{color:#ffd76a;font-size:34px}.bigFx.hit{color:#9df5b9}.bigFx.foul{color:#fff}
    @keyframes bigFxPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-58%) scale(1.03)}}
    .stage.fxShake{animation:stageShake .28s ease-out}@keyframes stageShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
    .resultCard{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:15px;background:rgba(4,11,19,.78);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.10)}
    .resultMain{font-size:14px;font-weight:800}.resultSub{font-size:11px;color:#c8d3df;margin-top:2px}.velo{font-size:21px;font-weight:900;white-space:nowrap}.velo small{font-size:10px;color:var(--muted)}
    .panel{margin-top:11px;background:rgba(14,27,45,.86);border:1px solid var(--line);border-radius:20px;padding:12px}
    .pitchTools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
    .pitchSelect{min-width:132px;border:1px solid var(--line);background:#122238;color:var(--text);border-radius:11px;padding:8px 10px;font-size:12px;font-weight:700}
    #pitchCountLabel{font-size:10px;color:var(--muted);white-space:nowrap}
    .pitchRow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.pitchRow::-webkit-scrollbar{display:none}
    .pitch{flex:0 0 auto;border:1px solid var(--line);background:#122238;border-radius:13px;padding:9px 12px;min-width:82px;text-align:left}
    .pitch strong{display:block;font-size:13px}.pitch span{font-size:10px;color:var(--muted)}
    .pitch.active{border-color:var(--accent);background:linear-gradient(180deg,rgba(74,179,255,.22),rgba(74,179,255,.08));box-shadow:0 0 0 1px rgba(74,179,255,.18)}
    .throwBtn{width:100%;border:0;border-radius:17px;margin-top:11px;padding:15px 16px;background:linear-gradient(135deg,#54c6ff,#2f8cff);font-size:17px;font-weight:900;box-shadow:0 10px 24px rgba(47,140,255,.28)}
    .throwBtn:active{transform:translateY(1px)}.throwBtn:disabled{opacity:.5;transform:none}
    .footer{display:flex;justify-content:center;gap:18px;margin-top:11px}
    .textBtn{border:0;background:transparent;color:var(--muted);font-size:11px;padding:6px}
    .sheet{position:fixed;inset:0;background:rgba(0,0,0,.52);display:none;align-items:flex-end;justify-content:center;z-index:99;padding:14px}
    .sheet.open{display:flex}.sheetCard{width:min(100%,500px);max-height:75dvh;overflow:auto;background:#0f1d30;border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:18px}
    .sheetHead{display:flex;justify-content:space-between;align-items:center}.sheetHead h2{font-size:18px;margin:0}.close{border:0;background:#1a2b42;width:34px;height:34px;border-radius:50%;font-size:18px}
    .statsGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.statBox{background:#14253b;border-radius:15px;padding:13px}.statBox b{display:block;font-size:22px}.statBox span{font-size:11px;color:var(--muted)}
    .help{font-size:13px;line-height:1.7;color:#d2dbe5}
    @media (max-height:700px){.stage{height:390px;min-height:330px}.panel{padding:9px}.throwBtn{padding:12px}.scorebar{margin-bottom:7px}.topbar{margin-bottom:7px}}
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo"><div class="ball"></div></div>
      <div><h1>投球王</h1><div class="sub" id="modeLabel">自由投球</div></div>
    </div>
    <select class="modeBtn" id="difficultySelect" aria-label="對決難度"><option value="normal">🙂 普通</option><option value="hard">🔥 困難</option><option value="hell">💀 地獄</option></select><select class="modeBtn" id="modeSelect" aria-label="遊戲模式"><option value="duel">⚔️ 打者對決</option><option value="free">⚾ 自由投球</option><option value="challenge">🎯 控球挑戰</option></select>
  </div>

  <div class="scorebar">
    <div class="score"><b id="pitchCount">0</b><span>投球數</span></div>
    <div class="score"><b id="strikePct">—</b><span>好球率</span></div>
    <div class="score"><b id="avgVelo">—</b><span>平均球速</span></div>
    <div class="score"><b id="challengeScore">—</b><span>挑戰分數</span></div>
  </div>

  <div class="stage" id="stage">
    <div class="stadiumLights"></div><div class="stadiumStand"></div><div class="backstop"></div><div class="grass"></div><div class="dirt"></div><div class="mound"></div><div class="rubber"></div><div class="plate"></div><div class="catcher"><div class="helmet"></div><div class="body"></div><div class="mitt"></div></div><div class="batter"><div class="bat"></div></div>
    <div class="strikeWrap" id="strikeWrap">
      <div class="strikeZone" id="strikeZone"></div>
    </div>
    <div class="aim" id="aim"></div>
    <div class="landingRing" id="landingRing"></div><div class="trail" id="trail"></div><div class="ballFlight" id="ballFlight"></div><div class="battedBall" id="battedBall"></div><div class="impactFlash" id="impactFlash"></div><div class="bigFx" id="bigFx"></div>
    <div class="toast" id="toast">STRIKE!</div>
    <div class="duelHud" id="duelHud"><div class="duelName" id="duelName">AI 打者</div><div class="duelCount"><b id="ballCount">B 0</b><b id="strikeCount">S 0</b><span id="outCount">● ● ●  0 OUT</span><span id="duelRecord">K 0 · BB 0</span></div><div class="baseBoard"><div class="diamond"><i class="base first" id="base1"></i><i class="base second" id="base2"></i><i class="base third" id="base3"></i></div><div class="baseText"><div id="runCount">本局失分 0</div><div id="baseStatus">無人上壘</div></div></div></div>
    <div class="resultCard">
      <div><div class="resultMain" id="resultMain">拖曳準星瞄準</div><div class="resultSub" id="resultSub">可滑到好球帶內外任意位置</div></div>
      <div class="velo" id="velo">— <small>km/h</small></div>
    </div>
  </div>

  <div class="panel">
    <div class="pitchTools"><select id="teamSelect" class="pitchSelect" aria-label="選擇球隊"></select><select id="pitcherSelect" class="pitchSelect" aria-label="選擇投手"></select></div><div id="pitcherInfo" style="font-size:12px;color:#c8e2fa;margin:0 0 9px 3px"></div><div class="pitchTools">
      <select id="pitchCategory" class="pitchSelect" aria-label="球種分類">
        <option value="all">全部球種</option>
        <option value="fast">速球系</option>
        <option value="slider">滑球系</option>
        <option value="curve">曲球系</option>
        <option value="change">變速球系</option>
        <option value="drop">下墜系</option>
        <option value="special">特殊／歷史球種</option>
      </select>
      <span id="pitchCountLabel">45 種球路</span>
    </div>
    <div class="pitchRow" id="pitchRow"></div>
    <button class="throwBtn" id="throwBtn">⚾ 投球</button>
  </div>

  <div class="footer">
    <button class="textBtn" id="statsBtn">📊 投球紀錄</button>
    <button class="textBtn" id="helpBtn">❔玩法</button>
    <button class="textBtn" id="resetBtn">↺ 重設</button>
  </div>
</div>

function advanceRunners(type){
  let runs=0;
  if(type==='homer'){runs=bases.filter(Boolean).length+1;bases=[false,false,false]}
  else if(type==='walk'){
    if(bases[0]&&bases[1]&&bases[2])runs++;
    if(bases[0]&&bases[1])bases[2]=true;
    if(bases[0])bases[1]=true;
    bases[0]=true;
  }else if(type==='double'){
    if(bases[2])runs++;
    if(bases[1])runs++;
    const first=bases[0];bases=[false,true,first];
  }else if(type==='single'){
    if(bases[2])runs++;
    if(bases[1])runs++;
    bases=[true,bases[0],false];
  }
  inningRuns+=runs;totalRuns+=runs;updateDuelHud();return runs;
}

function setTargetFromPointer(e){
  const s=stage.getBoundingClientRect();
  const z=$('#strikeWrap').getBoundingClientRect();
  const resultRect=$('.resultCard').getBoundingClientRect();
  const x=clamp(e.clientX,s.left+15,s.right-15);

function beginAim(e){

function moveAim(e){
  if(!aiming || e.pointerId!==aimPointer || throwing)return;
  setTargetFromPointer(e);

function targetPixel(normX,normY){
  const s=stage.getBoundingClientRect(), z=$('#strikeWrap').getBoundingClientRect();
  return {x:z.left-s.left+normX*z.width,y:z.top-s.top+normY*z.height};

function actualPitch(){
  const bonus=chosenPitcher.special.includes(selected.id)?.025:0;
  const eraControl=chosenPitcher.era==null?0:clamp((3.5-chosenPitcher.era)*.055,-.20,.14);
  const spread=(1-clamp(selected.control+chosenPitcher.control+eraControl+bonus,.35,.99))*.68 + .055;
  let x=target.x+randn()*spread*.33, y=target.y+randn()*spread*.42;
  x+=selected.breakX/520; y+=selected.breakY/580;
  return {x,y};
}
function animateBall(actual,done){
  const rect=stage.getBoundingClientRect(), end=targetPixel(actual.x,actual.y);
  const start={x:rect.width*.5,y:rect.height*.83};
  const ctrl={x:(start.x+end.x)/2-selected.breakX*.65,y:(start.y+end.y)/2-selected.breakY*.8-25};
  ball.style.display='block';
  const dur=430, t0=performance.now();
  function frame(now){
    let t=clamp((now-t0)/dur,0,1), q=1-t;
    let x=q*q*start.x+2*q*t*ctrl.x+t*t*end.x;
    let y=q*q*start.y+2*q*t*ctrl.y+t*t*end.y;
    let scale=.68+t*.48;
    ball.style.left=(x-12)+'px';ball.style.top=(y-12)+'px';ball.style.bottom='auto';ball.style.transform=`scale(${scale}) rotate(${t*250}deg)`;
    if(t<1)requestAnimationFrame(frame);else{setTimeout(()=>{ball.style.display='none';done();},120)}
  }requestAnimationFrame(frame)
}
function classify(actual){
  const inside=actual.x>=0&&actual.x<=1&&actual.y>=0&&actual.y<=1;
  const dist=Math.hypot(actual.x-target.x,actual.y-target.y);
  let label,kind;
  if(!inside){label='BALL';kind='bad'}
  else if(dist<.16){label='漂亮好球';kind='good'}
  else {label='STRIKE';kind='good'}
  return {inside,dist,label,kind};
}

function animateBattedBall(kind,actual){
  fxBusy=true;throwBtn.disabled=true;
  const rect=stage.getBoundingClientRect(),start=targetPixel(actual.x,actual.y),side=Math.random()<.5?-1:1;
  let end={x:rect.width*.5,y:rect.height*.32},ctrl={x:rect.width*.5,y:rect.height*.12},dur=720;
  if(kind==='foul'){end={x:side<0?-28:rect.width+28,y:rect.height*(.34+Math.random()*.20)};ctrl={x:rect.width*(side<0?.18:.82),y:rect.height*.16};dur=560}
  else if(kind==='ground'){end={x:rect.width*(.36+Math.random()*.28),y:rect.height*.57};ctrl={x:rect.width*.5,y:rect.height*.47};dur=520}
  else if(kind==='out'){end={x:rect.width*(.28+Math.random()*.44),y:rect.height*(.24+Math.random()*.13)};ctrl={x:rect.width*(.34+Math.random()*.32),y:rect.height*.07};dur=720}
  else if(kind==='double'){end={x:rect.width*(.20+Math.random()*.60),y:rect.height*.14};ctrl={x:rect.width*(.26+Math.random()*.48),y:-12};dur=820}
  else if(kind==='homer'){end={x:rect.width*(.12+Math.random()*.76),y:-38};ctrl={x:rect.width*(.20+Math.random()*.60),y:-70};dur=980}
  else{end={x:rect.width*(.24+Math.random()*.52),y:rect.height*.29};ctrl={x:rect.width*(.30+Math.random()*.40),y:rect.height*.03};dur=700}
  const landingRing=$('#landingRing');landingRing.classList.remove('show');
  if(kind!=='foul'&&kind!=='homer'){
    landingRing.style.left=end.x+'px';landingRing.style.top=end.y+'px';
    landingRing.classList.add('show');
  }
  battedBall.style.display='block';battedBall.style.left=(start.x-6.5)+'px';battedBall.style.top=(start.y-6.5)+'px';battedBall.style.transform='scale(1)';
  impact(kind);const t0=performance.now();
  function frame(now){
    const t=clamp((now-t0)/dur,0,1),q=1-t;
    const x=q*q*start.x+2*q*t*ctrl.x+t*t*end.x,y=q*q*start.y+2*q*t*ctrl.y+t*t*end.y;
    const scale=kind==='homer'?1-t*.58:1-t*.38;
    battedBall.style.left=(x-6.5)+'px';battedBall.style.top=(y-6.5)+'px';battedBall.style.transform=`scale(${Math.max(.34,scale)}) rotate(${t*720}deg)`;
    if(t<1)requestAnimationFrame(frame);else{setTimeout(()=>{battedBall.style.display='none';landingRing.classList.remove('show');fxBusy=false;if(!throwing&&!paLocked)throwBtn.disabled=false;},80)}
  }
  requestAnimationFrame(frame);
}

  if(isOut)inningOuts++;

  paLocked=true;state.duel.pa++;resultMain.textContent=title;resultSub.textContent=sub;showToast(title,kind);updateDuelHud();save();updateStats();
  setTimeout(()=>{
    if(inningOuts>=3){
      const summary=`第 ${inningNumber} 局結束｜${inningPitches} 球、${inningKs} K、${inningHits} 安、${inningWalks} 保送、失 ${inningRuns} 分`;

      setTimeout(()=>{resetInning();paLocked=false;throwing=false;throwBtn.disabled=fxBusy;resultMain.textContent=`第 ${inningNumber} 局開始`;resultSub.textContent='三出局後進入下一局';},3500);
    }else{newBatter();paLocked=false;throwing=false;throwBtn.disabled=fxBusy;resultMain.textContent='下一位打者';resultSub.textContent=`目前 ${inningOuts} 出局，繼續投球`;}
  },1050);

function handleDuelPitch(actual,r,speed){
  inningPitches++;
  const outsideX=actual.x<0?-actual.x:actual.x>1?actual.x-1:0;
  const outsideY=actual.y<0?-actual.y:actual.y>1?actual.y-1:0;
  const outsideDist=Math.hypot(outsideX,outsideY);
  const repeatCount=recentPitchIds.filter(id=>id===selected.id).length;
  const level=difficultySettings[difficulty];
  const eraPenalty=chosenPitcher.era==null?0:clamp((chosenPitcher.era-3.5)*.045,-.13,.19);
  let swingProb=r.inside?currentBatter.zoneSwing+level.swing:(currentBatter.chase+level.chase)*clamp(1-outsideDist/.6,.08,1);
  if(strikesCount===2)swingProb+=.12;if(balls===3&&!r.inside)swingProb-=.10;if(repeatCount>=2)swingProb+=.14;if(balls>=2&&r.inside)swingProb+=.07;
  swingProb=clamp(swingProb,.03,.96);
  const swings=Math.random()<swingProb;
  recentPitchIds.push(selected.id);recentPitchIds=recentPitchIds.slice(-4);
  if(!swings){
    if(r.inside){strikesCount++;resultMain.textContent='看著好球';resultSub.textContent=`${selected.name}｜${speed} km/h`;showToast('CALLED STRIKE','good')}
    else{balls++;resultMain.textContent='選掉壞球';resultSub.textContent=`${selected.name}｜${speed} km/h`;showToast('BALL','bad')}
  }else{
    swingBatter();
    const breakDifficulty=clamp((Math.abs(selected.breakX)+Math.abs(selected.breakY))/170,0,.22);
    const veloDifficulty=clamp((speed-145)/140,0,.12);
    let contactProb=currentBatter.contact+level.contact+eraPenalty-breakDifficulty-veloDifficulty+(repeatCount*.08)+(strikesCount===2?.07:0);
    if(!r.inside)contactProb-=.13+outsideDist*.30;
    contactProb=clamp(contactProb,.22,.97);
    if(Math.random()>contactProb){strikesCount++;resultMain.textContent='揮棒落空！';resultSub.textContent=`${selected.name} 騙到打者`;showToast('SWING & MISS','good');buzz(22)}
    else{
      const poor=(!r.inside&&outsideDist>.20)||r.dist>.30||Math.random()>.86;
      if(poor||Math.random()<.20){if(strikesCount<2)strikesCount++;resultMain.textContent='界外球';resultSub.textContent='打者碰到球，但沒有打好';showToast('FOUL');showBigFx('FOUL','foul');animateBattedBall('foul',actual);buzz(18)}
      else{
        const hitChance=clamp(.42+currentBatter.power*.28+level.hit+eraPenalty-(r.dist<.12?.04:0),.15,.92);
        if(Math.random()<hitChance){
          state.duel.hits++;
          const centerDist=Math.hypot(actual.x-.5,actual.y-.5);
          const hrChance=clamp(.015+Math.max(0,currentBatter.power-.42)*.29+(centerDist<.42?.035:0)+(speed>145?.018:0),.01,.17);
          if(Math.random()<clamp(hrChance*level.homeRun,.005,.40)){
            state.duel.hr++;const scored=advanceRunners('homer');showBigFx('HOME RUN!','homer');animateBattedBall('homer',actual);buzz([35,30,70,35,110]);
            endPlateAppearance('全壘打！',`${currentBatter.name} 把 ${selected.name} 轟出牆，攻下 ${scored} 分`,'bad');return true;
          }
          const extra=Math.random()<currentBatter.power*.24;const scored=advanceRunners(extra?'double':'single');
          showBigFx(extra?'EXTRA BASE!':'BASE HIT','hit');animateBattedBall(extra?'double':'hit',actual);buzz(34);
          endPlateAppearance(extra?'長打！':'安打',`${currentBatter.name} 把 ${selected.name} 打進場內${scored?'，攻下 '+scored+' 分':''}`,'bad');return true;
        }
        animateBattedBall(Math.random()<.45?'ground':'out',actual);buzz(16);
        endPlateAppearance('打者出局','球被打進場內但形成出局','good',true);return true
      }
    }
  }
  updateDuelHud();
  if(strikesCount>=3){state.duel.ks++;showBigFx('STRIKE OUT!','strikeout');impact('strikeout');buzz([55,35,95]);endPlateAppearance('三振！',`${selected.name} 解決 ${currentBatter.name}`,'good',true);return true}
  if(balls>=4){state.duel.bb++;const scored=advanceRunners('walk');endPlateAppearance('四壞保送',`${currentBatter.name} 選到保送${scored?'，擠回 '+scored+' 分':''}`,'bad');return true}
  return false;
}
function pitch(){
  if(throwing||paLocked||fxBusy)return;throwing=true;throwBtn.disabled=true;
  const actual=actualPitch(), speed=Math.max(70,Math.round(selected.base+chosenPitcher.velo+randn()*selected.sd));
  velo.innerHTML=`${speed} <small>km/h</small>`;resultMain.textContent='投球中…';resultSub.textContent=selected.name;
  animateBall(actual,()=>{
    const r=classify(actual);
    state.total++;if(r.inside)state.strikes++;state.veloSum+=speed;state.best=Math.max(state.best,speed);
    if(gameMode==='duel'){
      const ended=handleDuelPitch(actual,r,speed);
      const duelResult=resultMain.textContent;state.history.unshift({t:Date.now(),pitch:selected.name,speed,result:duelResult});state.history=state.history.slice(0,40);
      save();updateStats();if(ended)return;
    }else if(gameMode==='challenge'){
      challengeRound++;const goal=cellCenter(challengeTarget);const goalDist=Math.hypot(actual.x-goal.x,actual.y-goal.y);const hit=goalDist<.19;const pts=hit?Math.max(50,Math.round(100-goalDist*260)):Math.max(0,Math.round(35-goalDist*80));challengePoints+=pts;
      resultMain.textContent=hit?`命中目標 +${pts}`:`偏掉了 +${pts}`;resultSub.textContent=`第 ${challengeRound}/10 球｜${r.label}`;showToast(hit?'TARGET!':r.label,hit?'good':r.kind);
      state.history.unshift({t:Date.now(),pitch:selected.name,speed,result:hit?'TARGET':r.label});state.history=state.history.slice(0,40);
      if(challengeRound>=10)setTimeout(()=>finishChallenge(),700);else{const previous=challengeTarget;do{challengeTarget=Math.floor(Math.random()*9)}while(challengeTarget===previous);updateChallengeMarker()}
    }else{
      resultMain.textContent=r.label;resultSub.textContent=`${selected.name}｜落點誤差 ${Math.round(r.dist*100)}%`;showToast(r.label,r.kind);state.history.unshift({t:Date.now(),pitch:selected.name,speed,result:r.label});state.history=state.history.slice(0,40);
    }
    save();updateStats();throwing=false;throwBtn.disabled=fxBusy;
  })
}

  else{challenge=false;$('#modeLabel').textContent='自由投球';throwBtn.textContent='⚾ 投球';resultMain.textContent='拖曳準星瞄準';resultSub.textContent='可投好球帶內外任意位置'}
  updateChallengeMarker();updateDuelHud();updateStats();

    $('#sheetTitle').textContent='投球紀錄';
    const pct=state.total?Math.round(state.strikes/state.total*100):0, avg=state.total?Math.round(state.veloSum/state.total):0;
    let h=`<div class="statsGrid"><div class="statBox"><b>${state.total}</b><span>累計投球</span></div><div class="statBox"><b>${pct}%</b><span>好球率</span></div><div class="statBox"><b>${avg||'—'}</b><span>平均球速 km/h</span></div><div class="statBox"><b>${state.best||'—'}</b><span>最快球速 km/h</span></div><div class="statBox"><b>${state.duel.ks}</b><span>對決三振</span></div><div class="statBox"><b>${state.duel.bb}</b><span>四壞保送</span></div><div class="statBox"><b>${state.duel.hits}</b><span>被敲安打</span></div><div class="statBox"><b>${state.duel.hr}</b><span>被轟全壘打</span></div><div class="statBox"><b>${state.duel.pa}</b><span>完成打席</span></div></div>`;
    h+=`<div style="margin-top:15px;font-size:12px;color:#91a3b8">最近投球</div>`;
    h+=state.history.length?state.history.slice(0,12).map(x=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px"><span>${x.pitch}・${x.result}</span><b>${x.speed} km/h</b></div>`).join(''):`<p class="help">還沒有紀錄，先投幾球吧。</p>`;
    $('#sheetBody').innerHTML=h;
  }else{
    $('#sheetTitle').textContent='玩法';
    $('#sheetBody').innerHTML=`<div class="help"><p><b>選擇投手：</b>可從六支中職球隊選擇投手，球速、控球與擅長球種有不同的遊戲加成。這些能力是遊戲模擬值，不代表球員實際球速或球探評價。</p><p><b>打者對決：</b>可選普通、困難、地獄三種難度，每局三出局後顯示局結算並自動進入下一局。普通適合練習，困難接近強打者，地獄模式更容易被安打及全壘打。AI 打者會依球的位置、球速、變化量與目前 B/S 球數決定是否揮棒。三振、四壞、安打、全壘打與出局都會記錄；打中球時會看到球飛往場內、界外或飛出牆。如果一直重複同一球種，打者會更容易抓到。</p><p><b>自由投球：</b>選球種後拖曳藍色準星，可瞄準好球帶內外任意位置。</p><p><b>控球挑戰：</b>共 10 球，實際落點越接近黃色目標分數越高。</p><p><b>配球提示：</b>兩好球時可用變化球引誘；三壞球時要小心保送；速球與變化球交錯會比一直投同一球更有效。</p><p>目前收錄 45 種球路，紀錄只存在這支手機，不會上傳。</p></div>`;
  }
}
$('#difficultySelect').value=difficulty;
$('#difficultySelect').onchange=e=>{difficulty=e.target.value;localStorage.setItem('pitchKingDifficulty',difficulty);if(gameMode==='duel'){newBatter();resultMain.textContent=`${difficultySettings[difficulty].label}難度`;resultSub.textContent='新難度從下一球開始生效';}};
$('#teamSelect').onchange=e=>{if(throwing||paLocked){$('#teamSelect').value=chosenPitcher.team;return;}chosenPitcher=pitcherRoster.find(p=>p.team===e.target.value);localStorage.setItem('pitchKingPitcher',chosenPitcher.name);renderPitcherSelect();};
$('#pitcherSelect').onchange=e=>{if(throwing||paLocked){$('#pitcherSelect').value=chosenPitcher.name;return;}chosenPitcher=pitcherRoster.find(p=>p.name===e.target.value);localStorage.setItem('pitchKingPitcher',chosenPitcher.name);renderPitcherSelect();resultSub.textContent='已換投：'+chosenPitcher.name;};
renderPitcherSelect();
$('#modeSelect').onchange=e=>setMode(e.target.value);throwBtn.onclick=pitch;
$('#statsBtn').onclick=()=>openSheet('stats');$('#helpBtn').onclick=()=>openSheet('help');
$('#closeSheet').onclick=()=>$('#sheet').classList.remove('open');$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('open')};
$('#resetBtn').onclick=()=>{if(confirm('要清除全部投球紀錄嗎？')){state={total:0,strikes:0,veloSum:0,best:0,history:[],duel:{ks:0,bb:0,hits:0,hr:0,pa:0}};balls=0;strikesCount=0;save();updateStats();updateDuelHud();resultMain.textContent='紀錄已重設';resultSub.textContent='可以重新開始投球'}};
if($('#pitchCategory')) $('#pitchCategory').onchange=renderPitches;renderZone();renderPitches();setMode('duel');updateStats();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body>
</html>
