<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>更新投球王</title>
<style>
html,body{margin:0;min-height:100%;background:#07101d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}body{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(100%,420px);background:#0e1b2d;border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:22px;text-align:center}.ball{font-size:42px}.t{font-size:20px;font-weight:800;margin-top:8px}.s{font-size:13px;color:#a9bbcf;line-height:1.7;margin-top:8px}.ok{color:#78dfa6}
</style>
</head>
<body>
<div class="card"><div class="ball">⚾</div><div class="t" id="t">正在更新投球王…</div><div class="s" id="s">只會清除投球王自己的舊快取，不會影響其他 App。</div></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>r.scope.includes('/pitching-app/')).map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('pitch-king-')).map(k=>caches.delete(k)));
    }
    document.getElementById('t').textContent='更新完成';
    document.getElementById('t').classList.add('ok');
    document.getElementById('s').textContent='正在重新開啟最新版…';
  }catch(e){
    document.getElementById('s').textContent='快取清理完成，正在重新開啟最新版…';
  }
  setTimeout(()=>location.replace('./?v=4&fresh='+Date.now()),450);
})();
</script>
</body>
</html>
